  b.innerHTML='';var s=mk('div','s-sec');s.innerHTML='<div class="s-h">Hashtags</div>';
  var list=mk('div','');list.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px';
  D.hashtags.forEach(function(tag,i){var sp=mk('span','');sp.style.cssText='background:var(--cyan3);color:var(--cyan);padding:2px 9px;border-radius:20px;font-size:10px;display:flex;align-items:center;gap:4px;letter-spacing:.07em;border:1px solid var(--border2)';sp.innerHTML=esc(tag)+' <span style="cursor:pointer;opacity:.4" data-rh="'+i+'">×</span>';list.appendChild(sp);});
  s.appendChild(list);
  var ar=mk('div','');ar.style.cssText='display:flex;gap:7px';ar.innerHTML='<input type="text" id="ht-i" class="finp" placeholder="#aerodance" style="flex:1"><button class="btn btn-p btn-sm" id="ht-add">+</button>';
  s.appendChild(ar);b.appendChild(s);
  list.querySelectorAll('[data-rh]').forEach(function(el){el.addEventListener('click',async function(){saveUndo();D.hashtags.splice(+el.dataset.rh,1);await saveMain();stHashtags(b);});});
  G('ht-add').addEventListener('click',async function(){var t=(gv('ht-i')||'').trim();if(!t)return;var tag=t.startsWith('#')?t:'#'+t;if(!D.hashtags.includes(tag)){saveUndo();D.hashtags.push(tag);await saveMain();stHashtags(b);}});
}

function stKpis(b){
  b.innerHTML='';var s=mk('div','s-sec');
  s.innerHTML='<div class="s-h">Historial de KPIs mensuals</div>';
  if(!D.kpiHistory||!D.kpiHistory.length){s.innerHTML+='<div style="font-size:11px;color:var(--muted);margin-bottom:12px">No hi ha registres. Afegeix el primer des del botó "📊 Registrar KPIs mensuals" de la secció Resum.</div>';}
  else{
    // Table
    var tbl=mk('div','');tbl.style.cssText='overflow-x:auto';
    var header='<div style="display:grid;grid-template-columns:100px repeat(6,1fr);gap:6px;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border)">'+
      '<div>Data</div><div>Seguidors</div><div>Reprod.</div><div>Interacc.</div><div>Alcance</div><div>Nous</div><div>Accions</div></div>';
    tbl.innerHTML=header;
    D.kpiHistory.slice().reverse().forEach(function(k,i){
      var realIdx=D.kpiHistory.length-1-i;
      var row=mk('div','');row.style.cssText='display:grid;grid-template-columns:100px repeat(6,1fr);gap:6px;font-size:11px;color:var(--text);padding:6px 0;border-bottom:1px solid var(--border);align-items:center';
      row.innerHTML='<div style="color:var(--muted)">'+esc(k.date||'—')+'</div>'+
        '<div>'+esc(String(k.seguidors||'—'))+'</div>'+
        '<div>'+esc(String(k.reproduccions||'—'))+'</div>'+
        '<div>'+esc(String(k.interaccions||'—'))+'</div>'+
        '<div>'+esc(String(k.alcance||'—'))+'</div>'+
        '<div style="color:'+(k.nous>=0?'var(--green)':'var(--red)')+'">'+esc(String(k.nous||0))+'</div>';
      var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){saveUndo();D.kpiHistory.splice(realIdx,1);await saveMain();stKpis(b);buildStats_update();toast('Eliminat');});
      var dbwrap=mk('div','');dbwrap.appendChild(db);row.appendChild(dbwrap);
      tbl.appendChild(row);
    });
    s.appendChild(tbl);
  }
  var addBtn=mk('button','btn btn-p btn-sm');addBtn.textContent='+ Registrar KPIs';addBtn.style.marginTop='10px';addBtn.addEventListener('click',openKpiModal);s.appendChild(addBtn);
  b.appendChild(s);
}

function stAccess(b){
  b.innerHTML='';var s=mk('div','s-sec');s.innerHTML="<div class=\"s-h\">Usuaris</div>";
  Object.keys(D.users).forEach(function(u){
    var uobj=D.users[u];var uname=uobj&&uobj.name?uobj.name:u;
    var card=mk('div','');card.style.cssText='background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:7px';
    var hdr=mk('div','');hdr.style.cssText='display:flex;align-items:center;gap:7px;flex-wrap:wrap';
    hdr.innerHTML='<div class="av" style="background:rgba(0,200,212,.08);color:var(--cyan)">'+u[0].toUpperCase()+'</div><div style="flex:1"><div class="iname">'+esc(u)+'</div><div class="isub">'+esc(uname)+(u==='admin'?' · Admin':'')+'</div></div>';
    var cpBtn=mk('button','btn btn-xs');cpBtn.textContent='🔑';cpBtn.addEventListener('click',function(){genModal('Contrasenya de "'+esc(u)+'"','<div class="field"><div class="flbl">Nova contrasenya</div><input type="password" id="gm-p1" class="finp"></div><div class="field"><div class="flbl">Confirmar</div><input type="password" id="gm-p2" class="finp"></div><div style="font-size:10px;color:var(--red);min-height:12px" id="gm-perr"></div>',async function(){var nw=gv('gm-p1'),c2=gv('gm-p2');if(nw.length<4){st('gm-perr','Mínim 4 caràcters');return;}if(nw!==c2){st('gm-perr','No coincideixen');return;}if(typeof D.users[u]==='object')D.users[u].pass=nw;else D.users[u]={pass:nw,name:u};await saveUsers();cm('gen-modal');toast('✓ Actualitzada');});});
    var rnBtn=mk('button','btn btn-xs');rnBtn.textContent='✏️';rnBtn.addEventListener('click',function(){genModal('Nom de "'+esc(u)+'"','<div class="field"><div class="flbl">Nom complet</div><input type="text" id="gm-nm" class="finp" value="'+eq(uname)+'"></div>',async function(){var nm=gv('gm-nm').trim();if(!nm)return;if(typeof D.users[u]==='object')D.users[u].name=nm;else D.users[u]={pass:D.users[u],name:nm};await saveUsers();cm('gen-modal');stAccess(b);if(currentUser===u){var tw=G('top-welcome');if(tw)tw.textContent='Benvinguda, '+nm;}toast('✓ Actualitzat');});});
    hdr.appendChild(cpBtn);hdr.appendChild(rnBtn);
    if(u!=='admin'){var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){if(!confirm('Eliminar "'+u+'"?'))return;delete D.users[u];if(D.userSections)delete D.userSections[u];await saveUsers();await saveMain();stAccess(b);toast('Eliminat');});hdr.appendChild(db);}
    card.appendChild(hdr);s.appendChild(card);
  });
  var ab=mk('button','btn btn-sm');ab.textContent='+ Nou usuari';ab.style.marginTop='7px';
  ab.addEventListener('click',function(){genModal('Nou usuari','<div class="field"><div class="flbl">Nom d\'usuari</div><input type="text" id="gm-u" class="finp"></div><div class="field"><div class="flbl">Nom complet</div><input type="text" id="gm-nm" class="finp"></div><div class="field"><div class="flbl">Contrasenya</div><input type="password" id="gm-p" class="finp"></div>',async function(){var u2=gv('gm-u').trim(),p=gv('gm-p'),nm=gv('gm-nm').trim();if(!u2||!p){toast('⚠️ Omple els camps');return;}D.users[u2]={pass:p,name:nm||u2};cm('gen-modal');await saveUsers();await saveMain();stAccess(b);toast('✓ Creat');});});
  s.appendChild(ab);b.appendChild(s);
}

// ══ GENERIC MODAL ══
function genModal(title,html,saveFn,delFn){
  st('gen-lbl',title);G('gen-body').innerHTML=html;var foot=G('gen-foot');foot.innerHTML='';
  if(delFn){var db=mk('button','btn btn-d btn-sm');db.style.marginRight='auto';db.textContent='Eliminar';db.addEventListener('click',delFn);foot.appendChild(db);}
  var cb=mk('button','btn btn-sm');cb.textContent='Cancel·lar';cb.addEventListener('click',function(){cm('gen-modal');});foot.appendChild(cb);
  var sb=mk('button','btn btn-p btn-sm');sb.textContent='Guardar';sb.addEventListener('click',saveFn);foot.appendChild(sb);
  om('gen-modal');
}
</script>
</body>
</html>
