<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERODANCE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020406;--bg2:#060c0e;--bg3:#0d1a1c;--bg4:#122022;
  --cyan:#00c8d4;--cyan2:#00e5f0;--cyan3:rgba(0,200,212,0.07);
  --text:#f0ede8;--muted:#506060;
  --border:rgba(0,200,212,0.07);--border2:rgba(0,200,212,0.15);
  --red:#e05252;--green:#52c97a;--amber:#d4a044;--purple:#a78bfa;
  --gold:#c9a84c;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-title:Georgia,serif;
  --r:8px;--r2:16px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* EDIT MODE */
.edit-only{display:none!important}
body.edit-mode .edit-only{display:flex!important}
body.edit-mode .edit-only-block{display:block!important}
.edit-only-block{display:none!important}

/* DOTS MENU */
.sec-dots-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,200,212,.1);border:1px solid var(--border2);color:var(--cyan);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:20;transition:background .2s;letter-spacing:1px;font-weight:700;line-height:1;user-select:none}
body.edit-mode .sec-dots-btn{display:flex!important}
.sec-dots-btn:hover{background:rgba(0,200,212,.22)}
.dots-menu{position:absolute;top:52px;right:16px;z-index:50;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:6px;min-width:210px;box-shadow:0 10px 36px rgba(0,0,0,.8);display:none;flex-direction:column;gap:1px}
.dots-menu.open{display:flex}
.dots-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:12px;color:var(--text);letter-spacing:.04em;transition:background .15s;white-space:nowrap}
.dots-item:hover{background:var(--cyan3);color:var(--cyan)}
.dots-item.danger{color:var(--red)}
.dots-item.danger:hover{background:rgba(224,82,82,.08);color:var(--red)}
.dots-sep{height:1px;background:var(--border);margin:3px 0}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,90,108,.5) 0%,rgba(0,24,32,.3) 42%,rgba(2,4,6,1) 70%)}
.login-orb{position:absolute;border-radius:50%;pointer-events:none}
.login-orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(0,155,180,.12) 0%,transparent 65%);top:-12%;left:-8%;animation:orb1 14s ease-in-out infinite}
.login-orb-2{width:480px;height:480px;background:radial-gradient(circle,rgba(0,95,115,.16) 0%,transparent 65%);bottom:-14%;right:-6%;animation:orb2 18s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.08)}}
@keyframes orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
.login-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.login-logo-wrap{min-height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.login-logo-img{max-height:85px;max-width:300px;object-fit:contain}
.login-wordmark{font-family:var(--font-title);font-size:clamp(34px,7vw,70px);letter-spacing:.22em;color:#fff;font-weight:400;text-transform:uppercase;line-height:1}
.login-subtitle{font-size:clamp(13px,2.3vw,20px);letter-spacing:.42em;color:var(--cyan);font-style:italic;font-weight:300;margin-top:8px}
.login-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.14);text-transform:uppercase;margin-top:12px}
.login-box{width:286px;display:flex;flex-direction:column;gap:12px;margin-top:40px}
.login-lbl{font-size:9px;letter-spacing:.2em;color:rgba(0,200,212,.5);text-transform:uppercase;margin-bottom:4px}
.login-inp{background:rgba(0,14,18,.7);border:1px solid rgba(0,200,212,.13);border-radius:6px;color:var(--text);font-family:var(--font-sans);font-size:14px;padding:11px 14px;outline:none;transition:border-color .25s;width:100%}
.login-inp:focus{border-color:rgba(0,200,212,.38)}
.login-btn{background:transparent;border:1px solid rgba(0,200,212,.33);border-radius:6px;color:var(--cyan);font-size:11px;letter-spacing:.2em;padding:13px;cursor:pointer;transition:all .25s;font-family:var(--font-sans);text-transform:uppercase;margin-top:4px}
.login-btn:hover{background:var(--cyan);color:#000}
.login-err{font-size:11px;color:var(--red);text-align:center;min-height:16px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
#app.visible{display:flex}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;display:flex;align-items:center;padding:0 20px;gap:8px;transition:background .4s,border-color .4s}
.topbar.scrolled{background:rgba(2,4,6,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.top-logo-img{max-height:28px;max-width:110px;object-fit:contain}
.top-wordmark{font-family:var(--font-title);font-size:13px;letter-spacing:.28em;color:#fff;text-transform:uppercase;font-weight:400}
.top-nav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;padding:0 8px}
.top-nav::-webkit-scrollbar{display:none}
.top-nav-btn{background:transparent;border:none;color:var(--muted);font-size:10px;letter-spacing:.1em;padding:5px 11px;border-radius:4px;cursor:pointer;white-space:nowrap;font-family:var(--font-sans);transition:all .2s;text-transform:uppercase}
.top-nav-btn:hover{color:var(--cyan)}
.top-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.top-welcome{font-size:11px;color:var(--muted);letter-spacing:.05em}
.top-badge{font-size:9px;background:var(--cyan3);color:var(--cyan);padding:2px 6px;border-radius:10px;letter-spacing:.1em;border:1px solid var(--border2)}
.tbtn{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;transition:all .2s;font-family:var(--font-sans);letter-spacing:.08em;text-transform:uppercase}
.tbtn:hover{color:var(--cyan);border-color:var(--border2)}
#btn-settings{transition:all .25s}
#btn-settings.active{background:rgba(0,200,212,.15);color:var(--cyan);border-color:var(--border2)}
.tbtn-undo{color:var(--amber);border-color:rgba(212,160,68,.2);display:none}

/* GLOBAL GLOWS */
.page-glow{position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
.page-glow-1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,140,165,.08) 0%,transparent 65%);top:4%;left:-10%;animation:orb1 16s ease-in-out infinite}
.page-glow-2{width:600px;height:600px;background:radial-gradient(circle,rgba(0,80,100,.1) 0%,transparent 65%);bottom:8%;right:-8%;animation:orb2 20s ease-in-out infinite}

/* PHASE TIMELINE */
#phase-bar{position:fixed;top:52px;left:0;right:0;z-index:190;background:rgba(2,4,6,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:44px;display:flex;align-items:center;gap:0;overflow:hidden}
.phase-item{display:flex;align-items:center;flex:1;min-width:0;position:relative;cursor:pointer;transition:all .2s}
.phase-item:last-child .phase-arrow{display:none}
.phase-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;transition:all .3s}
.phase-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;transition:color .3s}
.phase-arrow{flex:1;height:1px;background:rgba(255,255,255,.07);margin:0 8px;min-width:8px;position:relative}
.phase-arrow::after{content:'▶';position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:7px;color:rgba(255,255,255,.12)}
.phase-item.past .phase-dot{background:var(--muted);border-color:var(--muted)}
.phase-item.current .phase-dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,200,212,.6)}
.phase-item.current .phase-label{color:var(--cyan);font-weight:600}
.phase-item.current .phase-arrow{background:rgba(0,200,212,.3)}
.phase-item.future .phase-dot{background:transparent;border-color:rgba(255,255,255,.15)}
body.edit-mode #phase-bar{top:52px}

/* FADE IN */
.fade-in{opacity:0;transform:translateY(26px);transition:opacity .85s ease,transform .85s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}

/* SECTIONS */
.hub-sec{padding:82px 0;border-top:1px solid var(--border);position:relative}
.hub-sec:first-child{border-top:none}
.sec-inner{max-width:1240px;margin:0 auto;padding:0 50px}
.sec-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:38px;gap:16px;flex-wrap:wrap}
.sec-title{font-family:var(--font-title);font-size:clamp(21px,3.3vw,38px);font-weight:400;letter-spacing:.08em;color:#fff;line-height:1.1}
.sec-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6;max-width:440px;letter-spacing:.03em}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;flex-shrink:0}

/* HERO */
.hero-sec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:80px 50px 60px}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,95,112,.52) 0%,rgba(0,28,36,.32) 40%,rgba(2,4,6,1) 70%)}
.hero-grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none}
.hero-orb-1{width:min(60vw,600px);height:min(60vw,600px);background:radial-gradient(circle,rgba(0,180,210,.15) 0%,transparent 65%);top:-12%;left:-6%;animation:orb1 13s ease-in-out infinite}
.hero-orb-2{width:min(50vw,500px);height:min(50vw,500px);background:radial-gradient(circle,rgba(0,100,125,.2) 0%,transparent 65%);bottom:-18%;right:-9%;animation:orb2 17s ease-in-out infinite}
.hero-content{position:relative;z-index:1;text-align:center;max-width:840px}
.hero-logo-img{max-height:95px;max-width:360px;object-fit:contain;margin-bottom:14px}
.hero-title{font-family:var(--font-title);font-size:clamp(48px,10vw,115px);letter-spacing:.13em;color:#fff;font-weight:400;text-transform:uppercase;line-height:.95;display:block}
.hero-sub{font-size:clamp(14px,2.7vw,25px);letter-spacing:.44em;color:var(--cyan);font-style:italic;display:block;margin-top:10px}
.hero-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.17);text-transform:uppercase;display:block;margin-top:18px}
.hero-welcome{font-size:12px;letter-spacing:.13em;color:rgba(0,200,212,.6);display:block;margin-top:28px;font-style:italic}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;opacity:.33;transition:opacity .25s;z-index:1}
.hero-scroll:hover{opacity:.8}
.hero-scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--cyan),transparent)}
.hero-scroll-txt{font-size:8px;letter-spacing:.26em;color:var(--cyan);text-transform:uppercase}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.stat-card{background:var(--bg2);padding:20px 16px}
.stat-lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat-val{font-family:var(--font-title);font-size:28px;color:#fff;font-weight:400;line-height:1}

/* PILLAR BADGES */
.pillar-badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.p-espectacle{background:rgba(201,168,76,.15);color:var(--gold)}
.p-comunitat{background:rgba(0,200,212,.12);color:var(--cyan)}
.p-historia{background:rgba(167,139,250,.14);color:var(--purple)}
.p-competicio{background:rgba(82,201,122,.14);color:var(--green)}
.p-participacio{background:rgba(224,82,82,.13);color:var(--red)}

/* PIPELINE */
.board-scroll{display:flex;gap:13px;overflow-x:auto;padding-bottom:13px}
.stage-col{display:flex;flex-direction:column;min-width:236px;flex:0 0 236px}
.stage-hd{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 2px 9px;border-bottom:1px solid var(--sc,var(--border));margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.stage-n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000}
.post-cards{display:flex;flex-direction:column;gap:6px}
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .2s}
.post-card:hover{border-color:var(--border2);background:var(--bg3)}
.pc-title{font-size:12px;color:var(--text);line-height:1.4;margin-bottom:6px;letter-spacing:.02em}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.chip-m{background:rgba(255,255,255,.04);color:var(--muted)}
.add-stage{border:1px dashed var(--border);border-radius:var(--r);background:transparent;color:var(--muted);font-size:10px;padding:7px;cursor:pointer;transition:all .2s;margin-top:5px;width:100%;letter-spacing:.08em}
.add-stage:hover{border-color:var(--cyan);color:var(--cyan)}

/* CALENDAR */
.cal-wrap{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.cal-hd{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.cal-nav{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 11px;cursor:pointer;font-size:10px;transition:all .2s}
.cal-nav:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-lbl{font-family:var(--font-title);font-size:16px;letter-spacing:.12em;flex:1;color:#fff}
.cal-gw{padding:12px 15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dn{text-align:center;font-size:8px;color:var(--muted);padding:3px 0 7px;text-transform:uppercase;letter-spacing:.14em}
.cal-cell{min-height:68px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px;cursor:pointer;transition:border-color .2s}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.today{border-color:rgba(0,200,212,.35)}
.cal-cell.other{opacity:.15}
.cal-num{font-size:9px;color:var(--muted);margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--cyan)}
.cal-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.cal-leg{padding:10px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:9px;background:var(--bg2);align-items:center}
.leg-it{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);letter-spacing:.06em}
.leg-sw{width:7px;height:7px;border-radius:2px}

/* LIST */
.list-it{display:flex;align-items:flex-start;gap:11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 15px;margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.list-it:hover{border-color:var(--border2)}
.list-it.done{opacity:.33}
.list-chk{width:15px;height:15px;border-radius:4px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:8px;cursor:pointer;transition:all .2s}
.list-it.done .list-chk{background:var(--green);border-color:var(--green);color:#000}
.li-info{flex:1;min-width:0}
.li-title{font-size:13px;color:var(--text);margin-bottom:3px;letter-spacing:.02em}
.list-it.done .li-title{text-decoration:line-through;color:var(--muted)}
.li-sub{font-size:11px;color:var(--muted);line-height:1.4;letter-spacing:.03em}
.dl-badge{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.07em}
.br{background:rgba(224,82,82,.12);color:var(--red)}
.ba{background:rgba(212,160,68,.15);color:var(--amber)}
.bc{background:rgba(0,200,212,.1);color:var(--cyan)}
.dl-days{font-family:var(--font-title);font-size:15px;min-width:44px;text-align:right;flex-shrink:0}

/* SPONSORS */
.sponsor-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sponsor-filter-chip{font-size:9px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);color:var(--muted);background:transparent;transition:all .2s;letter-spacing:.08em;text-transform:uppercase}
.sponsor-filter-chip:hover,.sponsor-filter-chip.on{background:var(--cyan3);color:var(--cyan);border-color:var(--border2)}
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sponsor-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;transition:border-color .2s;cursor:pointer}
.sponsor-card:hover{border-color:var(--border2)}
.sponsor-cat{font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.sc-principal{color:var(--gold)}
.sc-amic{color:var(--cyan)}
.sc-impulsor{color:var(--purple)}
.sponsor-name{font-size:14px;color:var(--text);font-weight:500;margin-bottom:3px;letter-spacing:.03em}
.sponsor-role{font-size:11px;color:var(--muted);margin-bottom:10px;letter-spacing:.04em}
.sponsor-status{font-size:9px;padding:2px 8px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ss-contactat{background:rgba(212,160,68,.15);color:var(--amber)}
.ss-interessat{background:rgba(0,200,212,.12);color:var(--cyan)}
.ss-confirmat{background:rgba(82,201,122,.14);color:var(--green)}
.ss-rebutjat{background:rgba(224,82,82,.12);color:var(--red)}
.sponsor-amount{font-family:var(--font-title);font-size:18px;color:var(--gold);margin-top:6px}

/* THEMES */
.themes-s{position:relative;padding:0 0 20px}
.themes-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(to bottom,transparent,rgba(0,200,212,.11) 15%,rgba(0,200,212,.11) 85%,transparent);transform:translateX(-50%);pointer-events:none}
.theme-row{display:flex;align-items:center;margin-bottom:34px;position:relative}
.theme-row:nth-child(odd){justify-content:flex-start;padding-left:3%}
.theme-row:nth-child(even){justify-content:flex-end;padding-right:3%}
.theme-node{position:relative;width:min(44vw,420px);flex-shrink:0}
.theme-link{display:block;text-decoration:none}
.theme-card{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9;background:var(--bg3)}
.theme-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,130,155,.3) 0%,rgba(0,25,36,.55) 55%,rgba(2,4,6,.97) 100%);z-index:1;transition:opacity .5s}
.theme-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(.35) blur(1.5px);transition:transform .7s cubic-bezier(.4,0,.2,1),filter .7s ease;z-index:0}
.theme-yr-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:min(9vw,88px);color:rgba(0,200,212,.055);letter-spacing:.05em;pointer-events:none;user-select:none;z-index:2}
.theme-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,8,12,.35) 55%,rgba(0,20,26,.06) 100%);z-index:3}
.theme-info{position:absolute;bottom:0;left:0;right:0;padding:18px 20px;z-index:4}

function cm(id){var e=G(id);if(e)e.classList.remove('open');}

function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function eq(s){return(s||'').replace(/"/g,'&quot;');}
function uid(){return Date.now()+Math.floor(Math.random()*9999);}

function daysUntil(ds){return Math.ceil((new Date(ds)-today)/864e5);}

var fadeObs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');fadeObs.unobserve(e.target);}});},{threshold:.08,rootMargin:'0px 0px -50px 0px'});
function obsFade(el){el.querySelectorAll('.fade-in').forEach(function(e){fadeObs.observe(e);});}

var editMode=false;

function setEditMode(on){
  editMode=on;
  document.body.classList.toggle('edit-mode',on);
  var btn=G('btn-settings');
  if(btn){btn.textContent=on?'✕ Edició ON':'⚙ Ajustes';btn.classList.toggle('active',on);}
  if(!on){G('settings-panel').classList.remove('open');settingsPanelOpen=false;}
}
function toggleSettingsPanel(){
  settingsPanelOpen=!settingsPanelOpen;
  if(settingsPanelOpen){G('settings-panel').classList.add('open');renderSettings();}
  else G('settings-panel').classList.remove('open');
}
G('settings-toggle-btn').addEventListener('click',toggleSettingsPanel);

async function saveMain(){await dbSet('aero_main2',{sections:D.sections,categories:D.categories,people:D.people,hashtags:D.hashtags,cfg:D.cfg,legendExtra:D.legendExtra,trash:D.trash,userSections:D.userSections,kpiHistory:D.kpiHistory,phases:D.phases,pillars:D.pillars,taskTypes:D.taskTypes,userViewOrder:D.userViewOrder});}
async function saveUsers(){await dbSet('aero_users2',D.users);}
async function loadAll(){
  var main=await dbGet('aero_main2');var users=await dbGet('aero_users2');
  D=JSON.parse(JSON.stringify(DEFAULTS));
  if(main){['sections','categories','people','hashtags','cfg','legendExtra','trash','userSections','kpiHistory','phases','pillars','taskTypes','userViewOrder'].forEach(function(k){if(main[k]!==undefined)D[k]=main[k];});}
  if(!D.taskTypes)D.taskTypes=[...DEFAULT_TASK_TYPES];
  if(!D.userViewOrder)D.userViewOrder={};
  D.users=JSON.parse(JSON.stringify(DEFAULTS.users));
  if(users){Object.keys(users).forEach(function(u){var v=users[u];D.users[u]=typeof v==='object'?v:{pass:v,name:u};});}
}

  var uobj=D.users[currentUser];var oldPass=uobj?(uobj.pass||uobj):'';
  if(oldPass!==old){st('cpwd-err','Contrasenya actual incorrecta');return;}

  await saveUsers();cm('chpwd-modal');toast('✓ Contrasenya canviada');
});

async function doLogin(){
  var u=gv('l-user').trim(),p=gv('l-pass');
  st('l-err','Verificant...');await loadAll();
  var uobj=D.users[u];var pass=uobj?(typeof uobj==='object'?uobj.pass:uobj):'';
  if((u==='admin'&&p==='aerodance31m')||(pass&&pass===p)){
    currentUser=u;G('login-screen').style.display='none';G('app').classList.add('visible');
    var dn=uobj&&uobj.name?uobj.name:u;
    st('top-welcome','Benvinguda, '+dn);
    G('top-badge').style.display=isAdmin()?'inline':'none';
    st('l-err','');applyLogo();applyFont();buildPage();buildPhaseBar();
  }else{st('l-err','Usuari o contrasenya incorrectes');setTimeout(function(){st('l-err','');},2500);}
}

// ══ LOGO & FONT ══
function applyLogo(){
  var logo=D.cfg.logoUrl||'';
  var lw=G('login-logo-wrap');
  if(logo)lw.innerHTML='<img class="login-logo-img" src="'+logo+'" alt="ADC">';
  else lw.innerHTML='<div class="login-wordmark">AERODANCE</div>';
  var tw=G('top-wordmark');
  if(logo&&tw&&tw.parentNode)tw.parentNode.innerHTML='<img class="top-logo-img" src="'+logo+'" alt="ADC">';
  else if(tw)tw.textContent='AERODANCE';
  var ls=G('login-subtitle');if(ls)ls.textContent=D.cfg.heroSubtitle||'Berlin After Dark';
}
function applyFont(){
  var f=D.cfg.fontTitle||'Georgia,serif';
  if(D.cfg.customFontName&&D.cfg.customFontUrl){
    if(!document.getElementById('custom-font-style')){var s=document.createElement('style');s.id='custom-font-style';s.textContent='@font-face{font-family:"'+D.cfg.customFontName+'";src:url("'+D.cfg.customFontUrl+'");}';document.head.appendChild(s);}
    f='"'+D.cfg.customFontName+'",'+f;
  }
  document.documentElement.style.setProperty('--font-title',f);
}

function buildPhaseBar(){
  var bar=G('phase-bar');bar.innerHTML='';
  var phases=D.phases||DEFAULT_PHASES;
  var curMonth=today.getMonth();
  phases.forEach(function(ph,i){
    var item=mk('div','phase-item');

    var isCurrent=false;
    if(sm<=em){isCurrent=curMonth>=sm&&curMonth<=em;}
    else{isCurrent=curMonth>=sm||curMonth<=em;}// wrap around year
    var isPast=!isCurrent&&((sm<em&&curMonth>em)||(sm>em&&curMonth>em&&curMonth<sm));

    var dot=mk('div','phase-dot');
    var lbl=mk('div','phase-label');lbl.textContent=ph.name+' · '+ph.months;
    lbl.title=ph.desc||'';

  });

// ══ DATE UTILITIES (fix UTC timezone shift) ══
function parseLocalDate(ds){
  if(!ds)return null;
  var p=ds.split('-');
  return new Date(+p[0],+p[1]-1,+p[2]);
}
function dateToStr(d){
  if(!d)return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysUntilLocal(ds){
  var d=parseLocalDate(ds);
  if(!d)return 9999;
  var t=new Date();t.setHours(0,0,0,0);
  return Math.ceil((d-t)/864e5);
}

function _renderKanban(el,sec,isTaller){
  var accentRgb=isTaller?'255,122,170':'0,200,212';
  var accent='rgba('+accentRgb+',1)';
  var secId=sec.id;
  var nf=sec.fields.find(function(f){return f.id==='net';});
  var netOpts='<option value="all">Totes les xarxes</option>';
  if(nf&&nf.options)nf.options.forEach(function(o){netOpts+='<option value="'+eq(o)+'">'+esc(o)+'</option>';});
  var filterHTML=isTaller?'':'<select id="fnet-'+secId+'" class="finp" style="width:auto;font-size:11px;padding:5px 9px">'+netOpts+'</select>';
  var addLabel=isTaller?'+ Tasca':'+ Post';
  var addHTML=isAdmin()?'<button class="btn btn-sm" id="add-rec-'+secId+'">'+addLabel+'</button>':'';
  var inner=mkHdr(sec,filterHTML+addHTML);
  var bw=mk('div','sec-inner');bw.style.paddingTop='0';
  var board=mk('div','board-scroll');
  var stages=sec.stages||['Idea','Esborrany','Llest'];
  var recs=sec.records||[];
  var _fnet='all';
  function buildBoard(){
    board.innerHTML='';
    stages.forEach(function(stage){
      var col=mk('div','stage-col');
      var sr=recs.filter(function(r){
        return r._status===stage&&(_fnet==='all'||!r.net||r.net===_fnet);
      });
      var hd=mk('div','stage-hd');
      hd.style.setProperty('--sc','rgba('+accentRgb+',.4)');
      var n=mk('div','stage-n');
      n.style.background='rgba('+accentRgb+',.65)';
      n.textContent=sr.length;
      hd.innerHTML='<span style="color:var(--text);letter-spacing:.08em">'+esc(stage)+'</span>';
      hd.appendChild(n);
      col.appendChild(hd);
      var cards=mk('div','post-cards');
      sr.forEach(function(r){
        var card=mk('div','post-card');
        if(isTaller)card.classList.add('taller-card');
        var pillar=r.pillar||'';
        var pillarObj=PILLARS.find(function(p){return p.name===pillar;});
        var chips='';
        if(!isTaller){
          if(r.net)chips+='<span class="chip" style="background:rgba('+accentRgb+',.1);color:'+accent+'">' +esc(r.net)+'</span>';
          if(r.fmt)chips+='<span class="chip chip-m">'+esc(r.fmt)+'</span>';
          if(pillarObj)chips+='<span class="pillar-badge '+pillarObj.cls+'">'+esc(pillar)+'</span>';
        } else {
          if(r.qty)chips+='<span class="chip" style="background:rgba(255,122,170,.1);color:#ff7aaa">'+esc(r.qty)+'</span>';
          if(r.managers&&r.managers.length){r.managers.forEach(function(pid){var p=D.people.find(function(pp){return pp.id===pid;});if(p)chips+='<span class="chip chip-m">'+esc(p.name)+'</span>';});}
        }

function buildCalGrid(gw,legEl){
  if(!gw)return;
  gw.innerHTML='';
  var grid=mk('div','cal-grid');
  CAL_D.forEach(function(d){var dn=mk('div','cal-dn');dn.textContent=d;grid.appendChild(dn);});

  var first=new Date(calY,calM,1);
  var startDow=(first.getDay()+6)%7; // Monday=0
  var daysInMonth=new Date(calY,calM+1,0).getDate();

  // Collect all events
  var evs=collectCalEvents();

  // Prev month fill
  var prevDays=new Date(calY,calM,0).getDate();
  for(var i=0;i<startDow;i++){
    var c=mk('div','cal-cell other');
    var n=mk('div','cal-num');n.textContent=prevDays-startDow+1+i;
    c.appendChild(n);grid.appendChild(c);
  }

  var todayStamp=dateToStr(today);

  for(var d=1;d<=daysInMonth;d++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cell=mk('div','cal-cell');
    if(ds===todayStamp)cell.classList.add('today');
    var num=mk('div','cal-num');num.textContent=d;
    cell.appendChild(num);
    // Add events
    (evs[ds]||[]).forEach(function(ev){
      var evEl=mk('div','cal-ev');
      evEl.style.background='rgba('+hexToRgb(ev.color||'#00c8d4')+',0.18)';
      evEl.style.color=ev.color||'#00c8d4';
      evEl.style.borderLeft='2px solid '+(ev.color||'#00c8d4');
      evEl.textContent=ev.title;
      evEl.title=ev.title+(ev.notes?'\n'+ev.notes:'');
      if(ev.onClick)evEl.addEventListener('click',function(e){e.stopPropagation();ev.onClick();});
      cell.appendChild(evEl);
    });
    cell.addEventListener('click',function(capDs){return function(){if(isAdmin())openCalAddModal(capDs);};}(ds));
    grid.appendChild(cell);
  }

  // Fill remaining cells
  var total=startDow+daysInMonth;
  var remaining=7-((total)%7);if(remaining===7)remaining=0;
  for(var i=1;i<=remaining;i++){
    var c=mk('div','cal-cell other');
    var n=mk('div','cal-num');n.textContent=i;
    c.appendChild(n);grid.appendChild(c);
  }
  gw.appendChild(grid);

  // Legend
  if(legEl){
    legEl.innerHTML='<span style="font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-right:4px">Llegenda</span>';
    var cats=D.categories||[];
    var le=D.legendExtra||[];
    cats.forEach(function(cat){
      var it=mk('div','leg-it');
      it.innerHTML='<div class="leg-sw" style="background:'+cat.color+'"></div>'+esc(cat.name);
      legEl.appendChild(it);
    });
    le.forEach(function(l){
      var it=mk('div','leg-it');
      it.innerHTML='<div class="leg-sw" style="background:'+l.color+'"></div>'+esc(l.label);
      legEl.appendChild(it);
    });
  }
}

function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.substring(0,2),16);
  var g=parseInt(hex.substring(2,4),16);
  var b=parseInt(hex.substring(4,6),16);
  return r+','+g+','+b;
}

function collectCalEvents(){
  var evs={};
  function add(ds,ev){if(!evs[ds])evs[ds]=[];evs[ds].push(ev);}

  // From deadlines
  var dl=D.sections.find(function(s){return s.type==='deadlines';});
  if(dl)(dl.records||[]).forEach(function(r){
    if(!r.date)return;
    var cat=D.categories.find(function(c){return c.name===r.cat;});
    add(r.date,{title:r.title,color:cat?cat.color:'#d4a044',notes:r.notes,onClick:function(){var dlSec=D.sections.find(function(s){return s.type==='deadlines';});if(dlSec)openRecModal(dlSec,r,null);}});
  });

  // From pipeline (published + scheduled)
  var pl=D.sections.find(function(s){return s.type==='pipeline';});
  if(pl)(pl.records||[]).forEach(function(r){
    if(!r.date)return;
    var le=D.legendExtra||[];
    var color=r._status==='Publicat'?(le.find(function(l){return l.id==='p2';})||{color:'#52c97a'}).color:(le.find(function(l){return l.id==='p1';})||{color:'#a78bfa'}).color;
    add(r.date,{title:r.title||(r.net?r.net+': ':'')+r.fmt,color:color,onClick:function(){if(pl)openRecModal(pl,r,null);}});
  });

  // From taller pipeline
  var tl=D.sections.find(function(s){return s.type==='taller';});
  if(tl)(tl.records||[]).forEach(function(r){
    if(!r.date)return;
    add(r.date,{title:'🪡 '+r.title,color:'#ff7aaa',onClick:function(){if(tl)openRecModal(tl,r,null);}});
  });

  // From custom calendar events
  var ce=D.calEvents||[];
  ce.forEach(function(r){
    if(!r.date)return;
    var cat=D.categories.find(function(c){return c.id===r.catId;});
    add(r.date,{title:r.title,color:cat?cat.color:'#00c8d4',notes:r.notes});
  });

  return evs;
}

function openCalAddModal(dateStr){
  var cats=D.categories||[];
  var catGrid='<div class="cat-pick-grid">';
  cats.forEach(function(cat,i){
    catGrid+='<div class="cat-pick-item" data-catid="'+cat.id+'" data-i="'+i+'" onclick="pickCalCat(this,'+cat.id+')">'+
      '<div class="cat-pick-dot" style="background:'+cat.color+'"></div>'+
      '<span style="font-size:12px;color:var(--text)">'+esc(cat.name)+'</span></div>';
  });
  catGrid+='</div>';

  var fieldsHTML='<div class="cal-add-fields" id="cal-add-fields">'+
    '<div class="field"><div class="flbl">Títol</div><input type="text" id="cal-ev-title" class="finp" placeholder="Nom de l\'event"></div>'+
    '<div class="field"><div class="flbl">Data</div><input type="date" id="cal-ev-date" class="finp" value="'+dateStr+'"></div>'+
    '<div id="cal-extra-fields"></div>'+
    '<div class="field"><div class="flbl">Notes</div><textarea id="cal-ev-notes" class="finp finp-ta" style="min-height:50px"></textarea></div>'+
    '</div>';

  genModal('Nou event — '+dateStr,
    '<div class="field"><div class="flbl" style="margin-bottom:8px">Tipus d\'event</div>'+catGrid+'</div>'+fieldsHTML,
    async function(){
      var title=gv('cal-ev-title').trim();
      var date=gv('cal-ev-date');
      var notes=gv('cal-ev-notes');
      var catEl=document.querySelector('.cat-pick-item.sel');
      var catId=catEl?+catEl.dataset.catid:null;
      if(!title||!date){toast('⚠️ Títol i data obligatoris');return;}

      // Check if it's a pipeline post (Xarxes socials category)
      var cat=D.categories.find(function(c){return c.id===catId;});
      var isPost=cat&&(cat.name==='Xarxes socials'||cat.name==='Estratègia');

      if(isPost){
        // Add to pipeline
        var pl=D.sections.find(function(s){return s.type==='pipeline';});
        if(pl){
          saveUndo();
          if(!pl.records)pl.records=[];
          pl.records.push({id:uid(),title:title,date:date,notes:notes,_status:pl.stages?pl.stages[0]:'Idea'});
          cm('gen-modal');
          await saveMain();
          var calSec=D.sections.find(function(s){return s.type==='calendar';});
          if(calSec){var calEl=G('sec-'+calSec.id);if(calEl)renderSection(calEl,calSec);}
          toast('✓ Afegit a Pipeline');
          return;
        }
      }

      // Add as custom calendar event
      saveUndo();
      if(!D.calEvents)D.calEvents=[];
      D.calEvents.push({id:uid(),title:title,date:date,notes:notes,catId:catId});
      cm('gen-modal');
      await saveMain();
      var calSec=D.sections.find(function(s){return s.type==='calendar';});
      if(calSec){var calEl=G('sec-'+calSec.id);if(calEl)renderSection(calEl,calSec);}
      toast('✓ Event afegit');
    }
  );
}

// ══ RECORD MODAL ══
function openRecModal(sec,rec,defaultStatus){
  var isNew=!rec;
  if(isNew){
    rec={id:uid()};
    (sec.fields||[]).forEach(function(f){
      if(f.type==='checklist'||f.type==='multiselect'||f.type==='people')rec[f.id]=[];
      else rec[f.id]='';
    });
    if(sec.stages){rec._status=defaultStatus||(sec.stages[0]||'Idea');}
    rec._done=false;
  }
  G('rec-title').textContent=isNew?'Nou element':(rec.title||rec.name||'Element');
  var body=G('rec-body');body.innerHTML='';

  // Stage selector for kanban
  if(sec.stages){
    var sf=mk('div','field');
    sf.innerHTML='<div class="flbl">Estat</div>';
    var ss=mk('select','finp');ss.id='rf-_status';
    (sec.stages||[]).forEach(function(s){
      var o=mk('option');o.value=s;o.textContent=s;if(rec._status===s)o.selected=true;ss.appendChild(o);
    });
    sf.appendChild(ss);body.appendChild(sf);
  }

  var chkArrays={};// store checklist arrays by field id

  (sec.fields||[]).forEach(function(f){
    var val=rec[f.id];
    var field=mk('div','field');
    field.innerHTML='<div class="flbl">'+esc(f.name)+'</div>';

    if(f.type==='text'||f.type==='url'){
      var i=mk('input','finp');i.type='text';i.id='rf-'+f.id;i.value=val||'';field.appendChild(i);
    } else if(f.type==='number'){
      var i=mk('input','finp');i.type='number';i.id='rf-'+f.id;i.value=val||'';field.appendChild(i);
    } else if(f.type==='textarea'){
      var ta=mk('textarea','finp finp-ta');ta.id='rf-'+f.id;ta.value=val||'';field.appendChild(ta);
    } else if(f.type==='date'){
      var i=mk('input','finp');i.type='date';i.id='rf-'+f.id;i.value=val||'';field.appendChild(i);
    } else if(f.type==='time'){
      var i=mk('input','finp');i.type='time';i.id='rf-'+f.id;i.value=val||'';field.appendChild(i);
    } else if(f.type==='select'){
      var s=mk('select','finp');s.id='rf-'+f.id;
      s.innerHTML='<option value="">— Selecciona —</option>';
      (f.options||[]).forEach(function(o){var op=mk('option');op.value=o;op.textContent=o;if(val===o)op.selected=true;s.appendChild(op);});
      field.appendChild(s);
    } else if(f.type==='multiselect'){
      var ms=mk('div','pchecks');ms.id='rf-'+f.id;
      var selMs=Array.isArray(val)?val:[];
      (f.options||[]).forEach(function(o){var ch=mk('div','pcheck'+(selMs.includes(o)?' on':''));ch.textContent=o;ch.addEventListener('click',function(){ch.classList.toggle('on');});ms.appendChild(ch);});
      field.appendChild(ms);
    } else if(f.type==='people'){
      var ps=mk('div','pchecks');ps.id='rf-'+f.id;
      var selP=Array.isArray(val)?val:[];
      (D.people||[]).forEach(function(p){
        var ch=mk('div','pcheck'+(selP.includes(p.id)?' on':''));
        var dot=mk('div','pcheck-dot');dot.style.background=p.color||'#888';
        ch.appendChild(dot);ch.appendChild(document.createTextNode(p.name));
        ch.dataset.pid=p.id;
        ch.addEventListener('click',function(){ch.classList.toggle('on');});
        ps.appendChild(ch);
      });
      field.appendChild(ps);
    } else if(f.type==='checkbox'){
      var i=mk('input','finp');i.type='checkbox';i.id='rf-'+f.id;i.checked=!!val;i.style.width='auto';field.appendChild(i);
    } else if(f.type==='image'){
      var ia=mk('div','img-area');ia.id='rf-'+f.id;
      if(val)ia.innerHTML='<img src="'+esc(val)+'" style="max-width:100%;max-height:120px;border-radius:4px">';
      else ia.textContent='+ URL de la imatge';
      var ui=mk('input','finp');ui.type='text';ui.id='rf-'+f.id+'-url';ui.placeholder='https://...';ui.value=val||'';ui.style.marginTop='6px';
      ui.addEventListener('input',function(){if(ui.value)ia.innerHTML='<img src="'+ui.value+'" style="max-width:100%;max-height:120px;border-radius:4px">';else ia.textContent='+ URL de la imatge';});
      field.appendChild(ia);field.appendChild(ui);
    } else if(f.type==='checklist'){
      var cl=mk('div','');cl.id='rf-'+f.id;
      var checked=Array.isArray(val)?[...val]:[];
      chkArrays[f.id]=checked;
      (f.options||[]).forEach(function(o){
        var row=mk('div','');row.style.cssText='display:flex;align-items:center;gap:7px;margin-bottom:4px;cursor:pointer;font-size:12px;color:var(--text)';
        var box=mk('div','list-chk');
        var isDone=checked.includes(o);
        if(isDone){box.textContent='✓';box.style.cssText='background:var(--green);border-color:var(--green);color:#000';}
        box.dataset.opt=o;
        row.addEventListener('click',function(){
          var idx=checked.indexOf(o);
          if(idx>=0){checked.splice(idx,1);box.textContent='';box.style.cssText='';}
          else{checked.push(o);box.textContent='✓';box.style.cssText='background:var(--green);border-color:var(--green);color:#000';}
        });
        row.appendChild(box);row.appendChild(document.createTextNode(o));
        cl.appendChild(row);
      });
      field.appendChild(cl);
    }
    body.appendChild(field);
  });

  var foot=G('rec-foot');foot.innerHTML='';
  if(!isNew&&isAdmin()){
    var db=mk('button','btn btn-d btn-sm');db.textContent='Eliminar';
    db.addEventListener('click',async function(){
      if(!confirm('Eliminar aquest element?'))return;
      saveUndo();
      var idx=(sec.records||[]).findIndex(function(r2){return r2.id===rec.id;});
      if(idx>=0){
        var del=sec.records.splice(idx,1)[0];
        if(!D.trash)D.trash=[];del._secName=sec.name;del._deleted=todayStr;D.trash.unshift(del);
      }
      cm('rec-modal');await saveMain();refreshSec(sec.id);buildStats_update();toast('Element eliminat');
    });
    foot.appendChild(db);
  }
  var sp=mk('div','');sp.style.flex='1';foot.appendChild(sp);
  var cb=mk('button','btn btn-sm');cb.textContent='Cancel·lar';cb.addEventListener('click',function(){cm('rec-modal');});foot.appendChild(cb);
  var sv=mk('button','btn btn-p btn-sm');sv.textContent=isNew?'Crear':'Guardar';
  sv.addEventListener('click',async function(){
    saveUndo();
    if(sec.stages){var ss=G('rf-_status');if(ss)rec._status=ss.value;}
    (sec.fields||[]).forEach(function(f){
      var el=G('rf-'+f.id);if(!el&&f.type!=='checklist'&&f.type!=='image')return;
      if(f.type==='people'){rec[f.id]=Array.from(el.querySelectorAll('.pcheck.on')).map(function(c){return+c.dataset.pid;});}
      else if(f.type==='multiselect'){rec[f.id]=Array.from(el.querySelectorAll('.pcheck.on')).map(function(c){return c.textContent.trim();});}
      else if(f.type==='checklist'){rec[f.id]=chkArrays[f.id]||[];}
      else if(f.type==='image'){var ui=G('rf-'+f.id+'-url');rec[f.id]=ui?ui.value:'';}
      else if(f.type==='checkbox'){rec[f.id]=el.checked;}
      else{rec[f.id]=el.value||'';}
    });
    // Set display title
    var tf=sec.fields.find(function(f){return f.id==='title'||f.id==='name';});
    if(tf&&!rec._title)rec._title=rec[tf.id];
    if(isNew){if(!sec.records)sec.records=[];sec.records.push(rec);}
    cm('rec-modal');await saveMain();refreshSec(sec.id);buildStats_update();toast(isNew?'✓ Creat':'✓ Guardat');
  });
  foot.appendChild(sv);
  om('rec-modal');
}

function editLegend(){

    var cats=D.categories||[];

    cats.forEach(function(cat,i){
      html+='<div class="irow"><div class="im"><div class="iname">'+esc(cat.name)+'</div></div>'+

        (isAdmin()?'<button class="btn btn-xs btn-d" onclick="delCat('+cat.id+')">×</button>':'')+'</div>';
    });
    html+='<div class="s-h" style="margin-top:16px">Llegenda extra</div>';
    le.forEach(function(l,i){
      html+='<div class="irow"><div class="im"><div class="iname">'+esc(l.label)+'</div></div>'+
        '<div class="csw" style="background:'+l.color+'"></div>'+
        (isAdmin()?'<button class="btn btn-xs btn-d" onclick="delLegExtra(\''+l.id+'\')">×</button>':'')+'</div>';
    });
    html+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-sm" onclick="addCat()">+ Categoria</button>'+

// ══ FIELD MANAGER ══
function openFieldsMgr(sec){
  function build(){
    var b=G('gen-body');if(!b)return;b.innerHTML='';
    (sec.fields||[]).forEach(function(f,i){
      var row=mk('div','fb-row');
      row.innerHTML='<span style="font-size:12px;color:var(--text);flex:1">'+esc(f.name)+'</span>'+
        '<span class="fb-badge">'+esc(f.type)+'</span>';
      if(!f.sys){
        var eb=mk('button','btn btn-xs');eb.textContent='✏️';
        var db=mk('button','btn btn-xs btn-d');db.textContent='×';
        eb.addEventListener('click',function(){openFieldEdit(f,sec,function(){openFieldsMgr(sec);});});
        db.addEventListener('click',async function(){
          saveUndo();sec.fields.splice(i,1);await saveMain();openFieldsMgr(sec);toast('Eliminat');
        });
        row.appendChild(eb);row.appendChild(db);
      } else {
        row.innerHTML+='<span style="font-size:9px;color:var(--muted)">sistema</span>';
      }
      b.appendChild(row);
    });
    var ab=mk('button','btn btn-sm');ab.textContent='+ Nou camp';ab.style.marginTop='10px';
    ab.addEventListener('click',function(){openFieldNew(sec,function(){openFieldsMgr(sec);});});
    b.appendChild(ab);
    var ft=G('gen-foot');if(ft)ft.innerHTML='<button class="btn btn-sm" onclick="cm(\'gen-modal\')">Tancar</button>';
  }
  genModal('Camps de "'+esc(sec.name)+'"','',null,null);
  setTimeout(build,10);
}

// ══ SETTINGS ══
var _stab='general';
function renderSettings(){
  var tabs=['general','persones','categories','hashtags','seccions','usuaris','vista','tasques'];
  var labels={general:'General',persones:'Persones',categories:'Categories',hashtags:'Hashtags',seccions:'Seccions',usuaris:'Usuaris',vista:'Vista',tasques:'Tipus Tasques'};
  var stabs=G('stabs');stabs.innerHTML='';
  tabs.forEach(function(t){
    if(t==='usuaris'&&!isAdmin())return;
    var btn=mk('button','stab'+(t===_stab?' active':''));btn.textContent=labels[t];
    btn.addEventListener('click',function(){_stab=t;renderSettings();});
    stabs.appendChild(btn);
  });
  var sb=G('sbody');sb.innerHTML='';
  if(_stab==='general')renderSetGeneral(sb);
  else if(_stab==='persones')renderSetPeople(sb);
  else if(_stab==='categories')renderSetCats(sb);
  else if(_stab==='hashtags')renderSetHashtags(sb);
  else if(_stab==='seccions')renderSetSections(sb);
  else if(_stab==='usuaris')renderSetUsers(sb);
  else if(_stab==='vista')renderSetVista(sb);
  else if(_stab==='tasques')renderSetTaskTypes(sb);
}

function renderSetSections(sb){

  var wrap=G('usec-wrap');

    var uDiv=mk('div','');uDiv.style.marginBottom='14px';
    var uLbl=mk('div','s-h');uLbl.textContent=getUserName(u)+' ('+u+')';uDiv.appendChild(uLbl);
    var userSecs=D.userSections&&D.userSections[u]?D.userSections[u]:D.sections.map(function(s){return s.id;});
    D.sections.filter(function(s){return s.type!=='trash';}).forEach(function(sec){
      var row=mk('div','irow');row.style.cursor='pointer';
      var on=userSecs.includes(sec.id);
      var chk=mk('div','csw');chk.style.background=on?'var(--cyan)':'transparent';

      var im=mk('div','im');im.innerHTML='<div class="iname">'+esc(sec.name)+'</div><div class="isub">'+esc(sec.type)+'</div>';
      row.appendChild(chk);row.appendChild(im);

        saveUndo();if(!D.userSections)D.userSections={};if(!D.userSections[u])D.userSections[u]=D.sections.map(function(s){return s.id;});

function renderSetVista(sb){
  sb.innerHTML='<div class="s-sec"><div class="s-h">Ordre de seccions per usuari</div><div id="vista-wrap"></div></div>';
  var wrap=G('vista-wrap');
  var users=Object.keys(D.users||{});
  users.forEach(function(u){
    var uDiv=mk('div','');uDiv.style.marginBottom='16px';
    var uLbl=mk('div','s-h');uLbl.textContent=getUserName(u)+' — ordre personalitzat';uDiv.appendChild(uLbl);
    // Show current sections order
    var uvo=D.userViewOrder&&D.userViewOrder[u];
    var secIds=uvo?uvo:D.sections.filter(function(s){return s.type!=='trash';}).map(function(s){return s.id;});
    var ordSecs=secIds.map(function(id){return D.sections.find(function(s){return s.id===id;});}).filter(Boolean);
    ordSecs.forEach(function(sec,i){
      var row=mk('div','irow');row.style.cursor='pointer';
      row.innerHTML='<span style="font-size:12px;color:var(--muted);margin-right:8px;flex-shrink:0">'+esc(sec.name)+'</span>';
      var upBtn=mk('button','btn btn-xs');upBtn.textContent='↑';upBtn.disabled=i===0;
      var dnBtn=mk('button','btn btn-xs');dnBtn.textContent='↓';dnBtn.disabled=i===ordSecs.length-1;
      upBtn.addEventListener('click',async function(){
        if(i===0)return;saveUndo();if(!D.userViewOrder)D.userViewOrder={};
        var arr=ordSecs.map(function(s){return s.id;});
        var tmp=arr[i-1];arr[i-1]=arr[i];arr[i]=tmp;
        D.userViewOrder[u]=arr;await saveMain();renderSetVista(sb);toast('✓ Ordre actualitzat');
      });
      dnBtn.addEventListener('click',async function(){
        if(i===ordSecs.length-1)return;saveUndo();if(!D.userViewOrder)D.userViewOrder={};
        var arr=ordSecs.map(function(s){return s.id;});
        var tmp=arr[i+1];arr[i+1]=arr[i];arr[i]=tmp;
        D.userViewOrder[u]=arr;await saveMain();renderSetVista(sb);toast('✓ Ordre actualitzat');
      });
      row.appendChild(upBtn);row.appendChild(dnBtn);uDiv.appendChild(row);
    });
    var resetBtn=mk('button','btn btn-xs');resetBtn.textContent='↺ Reset';resetBtn.style.marginTop='6px';
    resetBtn.addEventListener('click',async function(){
      saveUndo();if(!D.userViewOrder)D.userViewOrder={};
      D.userViewOrder[u]=null;await saveMain();renderSetVista(sb);toast('✓ Reset');
    });
    uDiv.appendChild(resetBtn);
    wrap.appendChild(uDiv);
  });
}

// ══ APPLY PER-USER VIEW ORDER ══
function getVisibleSections(){
  var secs;
  if(isAdmin()){secs=D.sections;}
  else{
    var allowed=D.userSections&&D.userSections[currentUser];
    if(!allowed)secs=D.sections.filter(function(s){return s.type!=='trash';});
    else secs=D.sections.filter(function(s){return allowed.includes(s.id);});
  }
  // Apply user view order
  var uvo=D.userViewOrder&&D.userViewOrder[currentUser];
  if(uvo&&uvo.length){
    var ordered=[];var rest=secs.slice();
    uvo.forEach(function(id){var idx=rest.findIndex(function(s){return s.id===id;});if(idx>=0){ordered.push(rest[idx]);rest.splice(idx,1);}});
    secs=ordered.concat(rest);
  }
  return secs.filter(function(s){return s.type!=='trash'||isAdmin();});
}

// ══ INIT ══
(function init(){
  // Modal close on overlay click
  document.querySelectorAll('.modal-overlay').forEach(function(o){
    o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});
  });
  // Scroll topbar
  window.addEventListener('scroll',function(){
    var tb=G('topbar');if(tb)tb.classList.toggle('scrolled',window.scrollY>60);
  },{passive:true});
  // Fade observer
  var fadeObs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');fadeObs.unobserve(e.target);}});
  },{threshold:.08,rootMargin:'0px 0px -50px 0px'});
  window.obsFade=function(el){el.querySelectorAll('.fade-in').forEach(function(e){fadeObs.observe(e);});};
})();
</script>
