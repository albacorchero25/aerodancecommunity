<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERODANCE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020406;--bg2:#060c0e;--bg3:#0d1a1c;--bg4:#122022;
  --cyan:#00c8d4;--cyan2:#00e5f0;--cyan3:rgba(0,200,212,0.07);
  --text:#f0ede8;--muted:#506060;
  --border:rgba(0,200,212,0.07);--border2:rgba(0,200,212,0.15);
  --red:#e05252;--green:#52c97a;--amber:#d4a044;--purple:#a78bfa;
  --gold:#c9a84c;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-title:Georgia,serif;
  --r:8px;--r2:16px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.edit-only{display:none!important}
body.edit-mode .edit-only{display:flex!important}
body.edit-mode .edit-only-block{display:block!important}
.edit-only-block{display:none!important}
.sec-dots-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,200,212,.1);border:1px solid var(--border2);color:var(--cyan);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:20;transition:background .2s;letter-spacing:1px;font-weight:700;line-height:1;user-select:none}
body.edit-mode .sec-dots-btn{display:flex!important}
.sec-dots-btn:hover{background:rgba(0,200,212,.22)}
.dots-menu{position:absolute;top:52px;right:16px;z-index:50;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:6px;min-width:210px;box-shadow:0 10px 36px rgba(0,0,0,.8);display:none;flex-direction:column;gap:1px}
.dots-menu.open{display:flex}
.dots-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:12px;color:var(--text);letter-spacing:.04em;transition:background .15s;white-space:nowrap}
.dots-item:hover{background:var(--cyan3);color:var(--cyan)}
.dots-item.danger{color:var(--red)}
.dots-item.danger:hover{background:rgba(224,82,82,.08);color:var(--red)}
.dots-sep{height:1px;background:var(--border);margin:3px 0}
#login-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,90,108,.5) 0%,rgba(0,24,32,.3) 42%,rgba(2,4,6,1) 70%)}
.login-orb{position:absolute;border-radius:50%;pointer-events:none}
.login-orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(0,155,180,.12) 0%,transparent 65%);top:-12%;left:-8%;animation:orb1 14s ease-in-out infinite}
.login-orb-2{width:480px;height:480px;background:radial-gradient(circle,rgba(0,95,115,.16) 0%,transparent 65%);bottom:-14%;right:-6%;animation:orb2 18s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.08)}}
@keyframes orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
.login-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.login-logo-wrap{min-height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.login-wordmark{font-family:var(--font-title);font-size:clamp(34px,7vw,70px);letter-spacing:.22em;color:#fff;font-weight:400;text-transform:uppercase;line-height:1}
.login-subtitle{font-size:clamp(13px,2.3vw,20px);letter-spacing:.42em;color:var(--cyan);font-style:italic;font-weight:300;margin-top:8px}
.login-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.14);text-transform:uppercase;margin-top:12px}
.login-box{width:286px;display:flex;flex-direction:column;gap:12px;margin-top:40px}
.login-lbl{font-size:9px;letter-spacing:.2em;color:rgba(0,200,212,.5);text-transform:uppercase;margin-bottom:4px}
.login-inp{background:rgba(0,14,18,.7);border:1px solid rgba(0,200,212,.13);border-radius:6px;color:var(--text);font-family:var(--font-sans);font-size:14px;padding:11px 14px;outline:none;transition:border-color .25s;width:100%}
.login-inp:focus{border-color:rgba(0,200,212,.38)}
.login-btn{background:transparent;border:1px solid rgba(0,200,212,.33);border-radius:6px;color:var(--cyan);font-size:11px;letter-spacing:.2em;padding:13px;cursor:pointer;transition:all .25s;font-family:var(--font-sans);text-transform:uppercase;margin-top:4px}
.login-btn:hover{background:var(--cyan);color:#000}
.login-err{font-size:11px;color:var(--red);text-align:center;min-height:16px}
#app{display:none;flex-direction:column;min-height:100vh}
#app.visible{display:flex}
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;display:flex;align-items:center;padding:0 20px;gap:8px;transition:background .4s,border-color .4s}
.topbar.scrolled{background:rgba(2,4,6,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.top-logo-img{max-height:28px;max-width:110px;object-fit:contain}
.top-wordmark{font-family:var(--font-title);font-size:13px;letter-spacing:.28em;color:#fff;text-transform:uppercase;font-weight:400}
.top-nav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;padding:0 8px}
.top-nav::-webkit-scrollbar{display:none}
.top-nav-btn{background:transparent;border:none;color:var(--muted);font-size:10px;letter-spacing:.1em;padding:5px 11px;border-radius:4px;cursor:pointer;white-space:nowrap;font-family:var(--font-sans);transition:all .2s;text-transform:uppercase}
.top-nav-btn:hover{color:var(--cyan)}
.top-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.top-welcome{font-size:11px;color:var(--muted);letter-spacing:.05em}
.top-badge{font-size:9px;background:var(--cyan3);color:var(--cyan);padding:2px 6px;border-radius:10px;letter-spacing:.1em;border:1px solid var(--border2)}
.tbtn{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;transition:all .2s;font-family:var(--font-sans);letter-spacing:.08em;text-transform:uppercase}
.tbtn:hover{color:var(--cyan);border-color:var(--border2)}
#btn-settings{transition:all .25s}
#btn-settings.active{background:rgba(0,200,212,.15);color:var(--cyan);border-color:var(--border2)}
.tbtn-undo{color:var(--amber);border-color:rgba(212,160,68,.2);display:none}
.page-glow{position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
.page-glow-1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,140,165,.08) 0%,transparent 65%);top:4%;left:-10%;animation:orb1 16s ease-in-out infinite}
.page-glow-2{width:600px;height:600px;background:radial-gradient(circle,rgba(0,80,100,.1) 0%,transparent 65%);bottom:8%;right:-8%;animation:orb2 20s ease-in-out infinite}
#phase-bar{position:fixed;top:52px;left:0;right:0;z-index:190;background:rgba(2,4,6,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:44px;display:flex;align-items:center;gap:0;overflow:hidden}
.phase-item{display:flex;align-items:center;flex:1;min-width:0;position:relative;cursor:pointer;transition:all .2s}
.phase-item:last-child .phase-arrow{display:none}
.phase-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;transition:all .3s}
.phase-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;transition:color .3s}
.phase-arrow{flex:1;height:1px;background:rgba(255,255,255,.07);margin:0 8px;min-width:8px;position:relative}
.phase-arrow::after{content:'▶';position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:7px;color:rgba(255,255,255,.12)}
.phase-item.past .phase-dot{background:var(--muted);border-color:var(--muted)}
.phase-item.current .phase-dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,200,212,.6)}
.phase-item.current .phase-label{color:var(--cyan);font-weight:600}
.phase-item.current .phase-arrow{background:rgba(0,200,212,.3)}
.phase-item.future .phase-dot{background:transparent;border-color:rgba(255,255,255,.15)}
.fade-in{opacity:0;transform:translateY(26px);transition:opacity .85s ease,transform .85s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
.hub-sec{padding:82px 0;border-top:1px solid var(--border);position:relative}
.hub-sec:first-child{border-top:none}
.sec-inner{max-width:1240px;margin:0 auto;padding:0 50px}
.sec-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:38px;gap:16px;flex-wrap:wrap}
.sec-title{font-family:var(--font-title);font-size:clamp(21px,3.3vw,38px);font-weight:400;letter-spacing:.08em;color:#fff;line-height:1.1}
.sec-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6;max-width:440px;letter-spacing:.03em}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;flex-shrink:0}
.hero-sec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:80px 50px 60px}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,95,112,.52) 0%,rgba(0,28,36,.32) 40%,rgba(2,4,6,1) 70%)}
.hero-grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none}
.hero-orb-1{width:min(60vw,600px);height:min(60vw,600px);background:radial-gradient(circle,rgba(0,180,210,.15) 0%,transparent 65%);top:-12%;left:-6%;animation:orb1 13s ease-in-out infinite}
.hero-orb-2{width:min(50vw,500px);height:min(50vw,500px);background:radial-gradient(circle,rgba(0,100,125,.2) 0%,transparent 65%);bottom:-18%;right:-9%;animation:orb2 17s ease-in-out infinite}
.hero-content{position:relative;z-index:1;text-align:center;max-width:840px}
.hero-logo-img{max-height:95px;max-width:360px;object-fit:contain;margin-bottom:14px}
.hero-title{font-family:var(--font-title);font-size:clamp(48px,10vw,115px);letter-spacing:.13em;color:#fff;font-weight:400;text-transform:uppercase;line-height:.95;display:block}
.hero-sub{font-size:clamp(14px,2.7vw,25px);letter-spacing:.44em;color:var(--cyan);font-style:italic;display:block;margin-top:10px}
.hero-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.17);text-transform:uppercase;display:block;margin-top:18px}
.hero-welcome{font-size:12px;letter-spacing:.13em;color:rgba(0,200,212,.6);display:block;margin-top:28px;font-style:italic}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;opacity:.33;transition:opacity .25s;z-index:1}
.hero-scroll:hover{opacity:.8}
.hero-scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--cyan),transparent)}
.hero-scroll-txt{font-size:8px;letter-spacing:.26em;color:var(--cyan);text-transform:uppercase}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.stat-card{background:var(--bg2);padding:20px 16px}
.stat-lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat-val{font-family:var(--font-title);font-size:28px;color:#fff;font-weight:400;line-height:1}
.pillar-badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.p-espectacle{background:rgba(201,168,76,.15);color:var(--gold)}
.p-comunitat{background:rgba(0,200,212,.12);color:var(--cyan)}
.p-historia{background:rgba(167,139,250,.14);color:var(--purple)}
.p-competicio{background:rgba(82,201,122,.14);color:var(--green)}
.p-participacio{background:rgba(224,82,82,.13);color:var(--red)}
.board-scroll{display:flex;gap:13px;overflow-x:auto;padding-bottom:13px}
.stage-col{display:flex;flex-direction:column;min-width:236px;flex:0 0 236px}
.stage-hd{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 2px 9px;border-bottom:1px solid var(--sc,var(--border));margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.stage-n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000}
.post-cards{display:flex;flex-direction:column;gap:6px}
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .2s}
.post-card:hover{border-color:var(--border2);background:var(--bg3)}
.pc-title{font-size:12px;color:var(--text);line-height:1.4;margin-bottom:6px;letter-spacing:.02em}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.chip-m{background:rgba(255,255,255,.04);color:var(--muted)}
.add-stage{border:1px dashed var(--border);border-radius:var(--r);background:transparent;color:var(--muted);font-size:10px;padding:7px;cursor:pointer;transition:all .2s;margin-top:5px;width:100%;letter-spacing:.08em}
.add-stage:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-wrap{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.cal-hd{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.cal-nav{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 11px;cursor:pointer;font-size:10px;transition:all .2s}
.cal-nav:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-lbl{font-family:var(--font-title);font-size:16px;letter-spacing:.12em;flex:1;color:#fff}
.cal-gw{padding:12px 15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dn{text-align:center;font-size:8px;color:var(--muted);padding:3px 0 7px;text-transform:uppercase;letter-spacing:.14em}
.cal-cell{min-height:68px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px;cursor:pointer;transition:border-color .2s}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.today{border-color:rgba(0,200,212,.35)}
.cal-cell.other{opacity:.15}
.cal-num{font-size:9px;color:var(--muted);margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--cyan)}
.cal-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.cal-leg{padding:10px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:9px;background:var(--bg2);align-items:center}
.leg-it{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);letter-spacing:.06em}
.leg-sw{width:7px;height:7px;border-radius:2px}
.list-it{display:flex;align-items:flex-start;gap:11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 15px;margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.list-it:hover{border-color:var(--border2)}
.list-it.done{opacity:.33}
.list-chk{width:15px;height:15px;border-radius:4px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:8px;cursor:pointer;transition:all .2s}
.list-it.done .list-chk{background:var(--green);border-color:var(--green);color:#000}
.li-info{flex:1;min-width:0}
.li-title{font-size:13px;color:var(--text);margin-bottom:3px;letter-spacing:.02em}
.list-it.done .li-title{text-decoration:line-through;color:var(--muted)}
.li-sub{font-size:11px;color:var(--muted);line-height:1.4;letter-spacing:.03em}
.dl-badge{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.07em}
.br{background:rgba(224,82,82,.12);color:var(--red)}
.ba{background:rgba(212,160,68,.15);color:var(--amber)}
.bc{background:rgba(0,200,212,.1);color:var(--cyan)}
.dl-days{font-family:var(--font-title);font-size:15px;min-width:44px;text-align:right;flex-shrink:0}
.sponsor-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.sponsor-filter-chip{font-size:9px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);color:var(--muted);background:transparent;transition:all .2s;letter-spacing:.08em;text-transform:uppercase}
.sponsor-filter-chip:hover,.sponsor-filter-chip.on{background:var(--cyan3);color:var(--cyan);border-color:var(--border2)}
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sponsor-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;transition:border-color .2s;cursor:pointer}
.sponsor-card:hover{border-color:var(--border2)}
.sponsor-cat{font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.sc-principal{color:var(--gold)}
.sc-amic{color:var(--cyan)}
.sc-impulsor{color:var(--purple)}
.sponsor-name{font-size:14px;color:var(--text);font-weight:500;margin-bottom:3px;letter-spacing:.03em}
.sponsor-role{font-size:11px;color:var(--muted);margin-bottom:10px;letter-spacing:.04em}
.sponsor-status{font-size:9px;padding:2px 8px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ss-contactat{background:rgba(212,160,68,.15);color:var(--amber)}
.ss-interessat{background:rgba(0,200,212,.12);color:var(--cyan)}
.ss-confirmat{background:rgba(82,201,122,.14);color:var(--green)}
.ss-rebutjat{background:rgba(224,82,82,.12);color:var(--red)}
.sponsor-amount{font-family:var(--font-title);font-size:18px;color:var(--gold);margin-top:6px}
.themes-s{position:relative;padding:0 0 20px}
.themes-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(to bottom,transparent,rgba(0,200,212,.11) 15%,rgba(0,200,212,.11) 85%,transparent);transform:translateX(-50%);pointer-events:none}
.theme-row{display:flex;align-items:center;margin-bottom:34px;position:relative}
.theme-row:nth-child(odd){justify-content:flex-start;padding-left:3%}
.theme-row:nth-child(even){justify-content:flex-end;padding-right:3%}
.theme-node{position:relative;width:min(44vw,420px);flex-shrink:0}
.theme-link{display:block;text-decoration:none}
.theme-card{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9;background:var(--bg3)}
.theme-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,130,155,.3) 0%,rgba(0,25,36,.55) 55%,rgba(2,4,6,.97) 100%);z-index:1;transition:opacity .5s}
.theme-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(.35) blur(1.5px);transition:transform .7s cubic-bezier(.4,0,.2,1),filter .7s ease;z-index:0}
.theme-yr-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:min(9vw,88px);color:rgba(0,200,212,.055);letter-spacing:.05em;pointer-events:none;user-select:none;z-index:2}
.theme-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,8,12,.35) 55%,rgba(0,20,26,.06) 100%);z-index:3}
.theme-info{position:absolute;bottom:0;left:0;right:0;padding:18px 20px;z-index:4}
.t-year{font-size:8px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase;margin-bottom:4px;transition:color .3s}
.t-name{font-family:var(--font-title);font-size:clamp(16px,2.7vw,28px);color:#fff;font-weight:400;letter-spacing:.08em;line-height:1.2;transition:letter-spacing .4s}

}

async function doLogin(){

// ══ PHASE BAR ══
function buildPhaseBar(){
  var bar=G('phase-bar');bar.innerHTML='';
  var phases=D.phases||DEFAULT_PHASES;
  var curMonth=today.getMonth();
  phases.forEach(function(ph,i){
    var item=mk('div','phase-item');
    var sm=ph.startMonth,em=ph.endMonth;
    var isCurrent=false;
    if(sm<=em){isCurrent=curMonth>=sm&&curMonth<=em;}
    else{isCurrent=curMonth>=sm||curMonth<=em;}
    var isPast=!isCurrent&&((sm<em&&curMonth>em)||(sm>em&&curMonth>em&&curMonth<sm));
    item.classList.add(isCurrent?'current':(isPast?'past':'future'));
    var dot=mk('div','phase-dot');
    var lbl=mk('div','phase-label');lbl.textContent=ph.name+' · '+ph.months;
    lbl.title=ph.desc||'';
    item.appendChild(dot);item.appendChild(lbl);
    if(i<phases.length-1){var arrow=mk('div','phase-arrow');item.appendChild(arrow);}
    bar.appendChild(item);
  });
}

// ══ BUILD PAGE ══
function getVisibleSections(){
  if(isAdmin())return D.sections;
  var allowed=D.userSections&&D.userSections[currentUser];
  if(!allowed)return D.sections.filter(function(s){return s.type!=='trash';});
  return D.sections.filter(function(s){return allowed.includes(s.id);});
}
function buildPage(){
  applyLogo();applyFont();buildTopNav();
  var main=G('main-scroll');main.innerHTML='';
  getVisibleSections().forEach(function(sec){
    var el=mk('div','hub-sec');el.id='sec-'+sec.id;el.style.position='relative';
    main.appendChild(el);renderSection(el,sec);
  });
  obsFade(main);
}
function buildTopNav(){
  var nav=G('top-nav');nav.innerHTML='';
  getVisibleSections().filter(function(s){return s.type!=='hero';}).forEach(function(sec){
    var btn=mk('button','top-nav-btn');btn.textContent=sec.name;
    btn.addEventListener('click',function(){var el=G('sec-'+sec.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
    nav.appendChild(btn);
  });
}
function renderSection(el,sec){
  el.innerHTML='';
  if(sec.type==='hero')renderHero(el,sec);
  else if(sec.type==='stats')renderStats(el,sec);
  else if(sec.type==='pipeline')renderPipeline(el,sec);
  else if(sec.type==='calendar')renderCal(el,sec);
  else if(sec.type==='deadlines')renderDeadlines(el,sec);
  else if(sec.type==='tasks')renderTasks(el,sec);
  else if(sec.type==='document')renderDoc(el,sec);
  else if(sec.type==='gallery')renderGallery(el,sec);
  else if(sec.type==='themes')renderThemes(el,sec);
  else if(sec.type==='sponsors')renderSponsors(el,sec);
  else if(sec.type==='trash')renderTrash(el,sec);
  if(isAdmin()&&sec.type!=='hero'&&sec.type!=='stats'){
    var dotsBtn=mk('button','sec-dots-btn');dotsBtn.innerHTML='···';
    var dotsMenu=mk('div','dots-menu');dotsMenu.id='dots-'+sec.id;
    buildDotsMenu(dotsMenu,sec,el);
    dotsBtn.addEventListener('click',function(e){
      e.stopPropagation();
      var already=dotsMenu.classList.contains('open');
      document.querySelectorAll('.dots-menu.open').forEach(function(m){m.classList.remove('open');});
      if(!already)dotsMenu.classList.add('open');
    });
    el.appendChild(dotsBtn);el.appendChild(dotsMenu);
  }
  obsFade(el);
}
function refreshSec(secId){var sec=D.sections.find(function(s){return s.id===secId;});var el=G('sec-'+secId);if(sec&&el){renderSection(el,sec);buildStats_update();obsFade(el);}}

// ══ DOTS MENU ══
function buildDotsMenu(menu,sec,el){
  menu.innerHTML='';
  function item(label,fn,danger){var it=mk('div','dots-item'+(danger?' danger':''));it.textContent=label;it.addEventListener('click',function(){menu.classList.remove('open');fn();});menu.appendChild(it);}
  function sep(){menu.appendChild(mk('div','dots-sep'));}
  if(sec.type==='pipeline'){item('+ Nou post',function(){openRecModal(sec,null,null);});item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});}
  if(sec.type==='tasks'){item('+ Nova tasca',function(){openRecModal(sec,null,null);});item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});}
  if(sec.type==='deadlines'){item('+ Nova data clau',function(){openRecModal(sec,null,null);});item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});}
  if(sec.type==='themes')item('+ Nova temàtica',function(){openRecModal(sec,null,null);});
  if(sec.type==='document'){item('+ Afegir link',function(){addDocLink(sec,el);});item('+ Afegir text',function(){addDocText(sec,el);});}
  if(sec.type==='gallery'){item('+ Afegir imatge',function(){openRecModal(sec,null,null);});item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});}
  if(sec.type==='calendar'){item('+ Nou post',function(){var pls=D.sections.find(function(s){return s.type==='pipeline';});if(pls)openRecModal(pls,null,'Idea');});item('+ Nova data clau',function(){var dls=D.sections.find(function(s){return s.type==='deadlines';});if(dls)openRecModal(dls,null,null);});}
  if(sec.type==='sponsors'){item('+ Nou patrocinador',function(){openRecModal(sec,null,null);});item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});}
  if(sec.type==='trash')item('🗑 Buidar paperera',function(){D.trash=[];saveMain();refreshSec(sec.id);toast('Paperera buidada');});

function buildStats_update(){

  var pc=pl?(pl.records||[]).filter(function(r){return r._status&&r._status!=='Publicat';}).length:0;

  var cd=new Date(D.cfg.countdownDate);cd.setHours(0,0,0,0);var cdays=Math.ceil((cd-today)/864e5);
  var dl=D.sections.find(function(s){return s.type==='deadlines';});
  var urg=dl?(dl.records||[]).filter(function(r){var x=daysUntil(r.date);return x>=0&&x<=30;}).length:0;
  var sp=D.sections.find(function(s){return s.type==='sponsors';});
  var sconf=sp?(sp.records||[]).filter(function(r){return r.status==='Confirmat';}).length:0;
  var lastKpi=D.kpiHistory&&D.kpiHistory.length?D.kpiHistory[D.kpiHistory.length-1]:null;
  row.innerHTML=[
    {l:'Pipeline',v:pc},{l:'Llestos',v:rc},{l:'Tasques pend.',v:tc},
    {l:esc(D.cfg.countdownLabel),v:cdays>0?cdays+'d':'🎉'},
    {l:'Urgent 30d',v:urg,s:'color:var(--amber)'},{l:'Patrocinadors conf.',v:sconf,s:'color:var(--gold)'},
    {l:'Seguidors IG',v:lastKpi?lastKpi.seguidors:'—'},{l:'Alcance 30d',v:lastKpi?lastKpi.alcance:'—'},

}

      var pcards=col.querySelector('#pcards-'+si);

        var card=mk('div','post-card');
        var pf=sec.fields.find(function(f){return f.id==='pillar';});
        var pillarName=r.pillar||'';
        var pillarCls='';
        PILLARS.forEach(function(p){if(p.name===pillarName||p.name.toLowerCase()===pillarName.toLowerCase())pillarCls=p.cls;});
        card.innerHTML='<div class="pc-title">'+esc(r.title||'(sense títol)')+'</div>'+

// ══ CALENDAR ══
function renderCal(el,sec){
  var inner=mkHdr(sec,'');el.appendChild(inner);
  function buildCal(){
    var old=inner.querySelector('.cal-wrap');if(old)old.remove();
    var wrap=mk('div','cal-wrap fade-in');
    var hd=mk('div','cal-hd');
    var prev=mk('button','cal-nav');prev.textContent='◀';
    var next=mk('button','cal-nav');next.textContent='▶';
    var lbl=mk('div','cal-lbl');lbl.textContent=CAL_M[calM]+' '+calY;
    hd.appendChild(prev);hd.appendChild(lbl);hd.appendChild(next);
    wrap.appendChild(hd);
    prev.addEventListener('click',function(){calM--;if(calM<0){calM=11;calY--;}lbl.textContent=CAL_M[calM]+' '+calY;buildGrid();});
    next.addEventListener('click',function(){calM++;if(calM>11){calM=0;calY++;}lbl.textContent=CAL_M[calM]+' '+calY;buildGrid();});
    var gw=mk('div','cal-gw');
    var grid=mk('div','cal-grid');
    CAL_D.forEach(function(d){var dn=mk('div','cal-dn');dn.textContent=d;grid.appendChild(dn);});
    gw.appendChild(grid);wrap.appendChild(gw);
    // legend
    var leg=mk('div','cal-leg');
    D.categories.forEach(function(c){var li=mk('div','leg-it');li.innerHTML='<div class="leg-sw" style="background:'+c.color+'"></div>'+esc(c.name);leg.appendChild(li);});
    wrap.appendChild(leg);
    function buildGrid(){
      var existing=grid.querySelectorAll('.cal-cell');existing.forEach(function(c){c.remove();});
      var fd=new Date(calY,calM,1);
      var dow=(fd.getDay()+6)%7;
      var dm=new Date(calY,calM+1,0).getDate();
      for(var i=0;i<dow;i++){var c=mk('div','cal-cell other');grid.appendChild(c);}
      var pl=D.sections.find(function(s){return s.type==='pipeline';});
      var dl=D.sections.find(function(s){return s.type==='deadlines';});
      for(var d=1;d<=dm;d++){
        var ds=calY+'-'+(calM+1<10?'0':'')+(calM+1)+'-'+(d<10?'0':'')+d;
        var cell=mk('div','cal-cell');
        if(ds===todayStr)cell.classList.add('today');
        var num=mk('div','cal-num');num.textContent=d;cell.appendChild(num);
        if(pl)(pl.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
          var ev=mk('div','cal-ev');ev.style.background='rgba(0,200,212,.15)';ev.style.color='var(--cyan)';ev.textContent=r.title||'Post';ev.title=r.title||'';
          ev.addEventListener('click',function(e){e.stopPropagation();openRecModal(pl,r,null);});cell.appendChild(ev);
        });
        if(dl)(dl.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
          var cat=D.categories.find(function(c){return c.name===r.cat;});
          var ev=mk('div','cal-ev');ev.style.background='rgba(212,160,68,.15)';ev.style.color='var(--amber)';if(cat)ev.style.background=cat.color+'22';ev.textContent=r.title||'Deadline';ev.title=r.title||'';
          ev.addEventListener('click',function(e){e.stopPropagation();openRecModal(dl,r,null);});cell.appendChild(ev);
        });
        if(isAdmin())cell.addEventListener('click',function(){var pls=D.sections.find(function(s){return s.type==='pipeline';});if(pls)openRecModal(pls,null,'Idea');});
        grid.appendChild(cell);
      }
    }
    buildGrid();inner.appendChild(wrap);obsFade(inner);
  }
  buildCal();
}

      var total=(pl&&pl.records)?pl.records.length:1;
      PILLARS.forEach(function(p){
        var cnt=pl?(pl.records||[]).filter(function(r){return r.pillar&&r.pillar.toLowerCase()===p.name.toLowerCase();}).length:0;
        var pst=mk('div','pillar-stat');

          '<div class="pillar-stat-count">'+cnt+'</div>'+
          '<div style="font-size:10px;color:var(--muted)">'+esc(p.desc)+'</div>'+
          '<div class="pillar-stat-bar"><div class="pillar-stat-fill" style="width:'+(total?Math.round(cnt/total*100):0)+'%;background:'+p.color+'"></div></div>';
        prow.appendChild(pst);

      if(b.label){var h3=mk('div','ed-sub-h');h3.textContent=b.label.toUpperCase();wrap.appendChild(h3);}

function renderSponsors(el,sec){
  var inner=mkHdr(sec,isAdmin()?'<button class="btn btn-p btn-sm" id="add-sp-'+sec.id+'">+ Patrocinador</button>':'');
  el.appendChild(inner);
  var frow=mk('div','sponsor-filter-row fade-in');
  var cats=['Tots','Patrocinador Principal','Patrocinador Amic','Col·laborador Impulsor'];
  var curFilter='Tots';
  cats.forEach(function(c){var chip=mk('div','sponsor-filter-chip'+(c==='Tots'?' on':''));chip.textContent=c;chip.addEventListener('click',function(){curFilter=c;frow.querySelectorAll('.sponsor-filter-chip').forEach(function(x){x.classList.toggle('on',x.textContent===c);});buildGrid();});frow.appendChild(chip);});
  inner.appendChild(frow);
  var grid=mk('div','sponsor-grid fade-in');inner.appendChild(grid);
  function buildGrid(){
    grid.innerHTML='';
    var recs=(sec.records||[]).filter(function(r){return curFilter==='Tots'||r.category===curFilter;});
    recs.forEach(function(r){
      var card=mk('div','sponsor-card');
      var catCls=r.category==='Patrocinador Principal'?'sc-principal':r.category==='Patrocinador Amic'?'sc-amic':'sc-impulsor';
      var statCls='ss-'+(r.status?r.status.toLowerCase().replace(/[àáâ]/g,'a').replace(/[èé]/g,'e').replace(/[ìí]/g,'i').replace(/[òó]/g,'o').replace(/[ùú]/g,'u'):'contactat');
      card.innerHTML='<div class="sponsor-cat '+catCls+'">'+esc(r.category||'')+'</div>'+
        '<div class="sponsor-name">'+esc(r.name)+'</div>'+
        (r.contact?'<div class="sponsor-role">'+esc(r.contact)+'</div>':'')+
        '<span class="sponsor-status '+statCls+'">'+esc(r.status||'')+'</span>'+
        (r.amount?'<div class="sponsor-amount">'+r.amount+' €</div>':'');
      card.addEventListener('click',function(){openRecModal(sec,r,null);});
      grid.appendChild(card);
    });
  }
  buildGrid();
  var addBtn=inner.querySelector('#add-sp-'+sec.id);
  if(addBtn)addBtn.addEventListener('click',function(){openRecModal(sec,null,null);});
}

// ══ TRASH ══
function renderTrash(el,sec){
  var inner=mkHdr(sec,'');el.appendChild(inner);
  var wrap=mk('div','fade-in');
  if(!D.trash||!D.trash.length){wrap.innerHTML='<div style="font-size:12px;color:var(--muted);text-align:center;padding:30px">La paperera és buida</div>';}
  else D.trash.forEach(function(item){
    var it=mk('div','trash-it');
    it.innerHTML='<span style="flex:1;font-size:12px;color:var(--muted)">'+esc(item.title||item.name||'Element')+'</span>';
    if(isAdmin()){var rb=mk('button','btn btn-xs');rb.textContent='Restaurar';rb.addEventListener('click',async function(){saveUndo();var src=D.sections.find(function(s){return s.id===item._secId;});if(src){if(!src.records)src.records=[];src.records.push(item);}D.trash=D.trash.filter(function(x){return x.id!==item.id;});await saveMain();refreshSec(sec.id);if(src)refreshSec(src.id);toast('Restaurat');});it.appendChild(rb);}
    wrap.appendChild(it);
  });
  inner.appendChild(wrap);
}

// ══ REC MODAL ══
function openRecModal(sec,rec,defaultStage){
  var isNew=!rec;if(isNew){rec={id:uid(),_status:defaultStage||(sec.stages&&sec.stages[0])||'',_done:false};}
  st('rec-title',isNew?'Nou '+sec.name:rec.title||rec.name||'Element');
  var body=G('rec-body');body.innerHTML='';var foot=G('rec-foot');foot.innerHTML='';
  (sec.fields||[]).forEach(function(f){
    var wrap=mk('div','field');var lbl=mk('div','flbl');lbl.textContent=f.name;wrap.appendChild(lbl);
    if(f.type==='text'||f.type==='url'||f.type==='number'){
      var inp=mk('input','finp');inp.type=f.type==='number'?'number':'text';inp.id='rf-'+f.id;inp.value=rec[f.id]||'';
      if(!isAdmin())inp.readOnly=true;wrap.appendChild(inp);
    } else if(f.type==='textarea'){
      var ta=mk('textarea','finp finp-ta');ta.id='rf-'+f.id;ta.value=rec[f.id]||'';
      if(!isAdmin())ta.readOnly=true;wrap.appendChild(ta);
    } else if(f.type==='date'){
      var inp2=mk('input','finp');inp2.type='date';inp2.id='rf-'+f.id;inp2.value=rec[f.id]||'';
      if(!isAdmin())inp2.readOnly=true;wrap.appendChild(inp2);
    } else if(f.type==='time'){
      var inp3=mk('input','finp');inp3.type='time';inp3.id='rf-'+f.id;inp3.value=rec[f.id]||'';
      if(!isAdmin())inp3.readOnly=true;wrap.appendChild(inp3);
    } else if(f.type==='select'){
      var sel=mk('select','finp');sel.id='rf-'+f.id;
      sel.innerHTML='<option value="">—</option>';
      (f.options||[]).forEach(function(o){sel.innerHTML+='<option value="'+eq(o)+'"'+(rec[f.id]===o?' selected':'')+'>'+esc(o)+'</option>';});
      if(!isAdmin())sel.disabled=true;wrap.appendChild(sel);
    } else if(f.type==='people'){
      var pDiv=mk('div','pchecks');pDiv.id='rf-'+f.id;
      D.people.forEach(function(p){
        var cur=rec[f.id]||[];var on=Array.isArray(cur)?cur.includes(p.id):false;
        var pc=mk('div','pcheck'+(on?' on':''));pc.dataset.pid=p.id;
        pc.innerHTML='<div class="pcheck-dot" style="background:'+p.color+'"></div>'+esc(p.name);
        if(isAdmin())pc.addEventListener('click',function(){this.classList.toggle('on');});
        pDiv.appendChild(pc);
      });
      wrap.appendChild(pDiv);
    } else if(f.type==='image'){
      var imgDiv=mk('div','');imgDiv.id='rf-'+f.id;
      if(rec[f.id])imgDiv.innerHTML='<img src="'+eq(rec[f.id])+'" style="max-width:100%;border-radius:var(--r);max-height:180px">';
      if(isAdmin()){var ia=mk('div','img-area');ia.textContent='Introdueix URL de la imatge';ia.style.marginTop='6px';ia.addEventListener('click',function(){var url=prompt('URL de la imatge:',rec[f.id]||'');if(url!==null){rec[f.id]=url;imgDiv.innerHTML='<img src="'+url+'" style="max-width:100%;border-radius:var(--r);max-height:180px">'+(url?'':'');ia.textContent=url?'Canviar imatge':'Introdueix URL de la imatge';}});imgDiv.appendChild(ia);}
      wrap.appendChild(imgDiv);
    } else if(f.type==='checklist'){
      var clDiv=mk('div','');clDiv.id='rf-'+f.id;
      var items=Array.isArray(rec[f.id])?rec[f.id]:(f.options||[]).map(function(o){return {label:o,done:false};});
      items.forEach(function(item,idx){
        var row=mk('div','list-it'+(item.done?' done':''));row.style.marginBottom='3px';row.style.padding='7px 11px';
        var chk=mk('div','list-chk');chk.textContent=item.done?'✓':'';
        var lbl2=mk('div','li-title');lbl2.textContent=item.label;
        row.appendChild(chk);row.appendChild(lbl2);
        chk.addEventListener('click',function(){items[idx].done=!items[idx].done;rec[f.id]=items;chk.textContent=items[idx].done?'✓':'';row.classList.toggle('done',items[idx].done);});
        clDiv.appendChild(row);
      });
      if(!rec[f.id])rec[f.id]=items;
      wrap.appendChild(clDiv);
    }
    body.appendChild(wrap);
  });
  if(sec.stages&&isAdmin()){
    var sw=mk('div','field');var sl=mk('div','flbl');sl.textContent='Estat';sw.appendChild(sl);
    var ss=mk('select','finp');ss.id='rf-_status';
    sec.stages.forEach(function(s){ss.innerHTML+='<option value="'+eq(s)+'"'+(rec._status===s?' selected':'')+'>'+esc(s)+'</option>';});
    ss.innerHTML+='<option value="Publicat"'+(rec._status==='Publicat'?' selected':'')+'>Publicat</option>';
    sw.appendChild(ss);body.appendChild(sw);
  }
  om('rec-modal');
  if(isAdmin()){
    var saveBtn=mk('button','btn btn-p btn-sm');saveBtn.textContent=isNew?'Crear':'Guardar';
    saveBtn.addEventListener('click',async function(){
      saveUndo();
      (sec.fields||[]).forEach(function(f){
        if(f.type==='people'){
          var pDiv=G('rf-'+f.id);if(!pDiv)return;
          rec[f.id]=Array.from(pDiv.querySelectorAll('.pcheck.on')).map(function(pc){return +pc.dataset.pid;});
        } else if(f.type==='image'||f.type==='checklist'){
          // already set inline
        } else {var el2=G('rf-'+f.id);if(el2)rec[f.id]=el2.value;}
      });
      if(G('rf-_status'))rec._status=G('rf-_status').value;
      if(!sec.records)sec.records=[];
      if(isNew)sec.records.push(rec);
      cm('rec-modal');await saveMain();refreshSec(sec.id);buildStats_update();toast(isNew?'✓ Creat':'✓ Guardat');
    });
    foot.appendChild(saveBtn);
    if(!isNew){
      var delBtn=mk('button','btn btn-d btn-sm');delBtn.textContent='Eliminar';
      delBtn.addEventListener('click',async function(){
        saveUndo();sec.records=sec.records.filter(function(r2){return r2.id!==rec.id;});
        var trash=Object.assign({},rec,{_secId:sec.id});D.trash.push(trash);
        cm('rec-modal');await saveMain();refreshSec(sec.id);buildStats_update();toast('Mogut a paperera');
      });
      foot.appendChild(delBtn);
    }
  }
  var closeBtn=mk('button','btn btn-sm');closeBtn.textContent='Tancar';closeBtn.addEventListener('click',function(){cm('rec-modal');});foot.appendChild(closeBtn);
}

// ══ GEN MODAL ══
function genModal(title,bodyHTML,onSave,onDelete){
  st('gen-lbl',title);
  G('gen-body').innerHTML=bodyHTML;
  G('gen-foot').innerHTML='';
  var sf=mk('button','btn btn-p btn-sm');sf.textContent='Guardar';sf.addEventListener('click',onSave);
  G('gen-foot').appendChild(sf);
  if(onDelete){var df=mk('button','btn btn-d btn-sm');df.textContent='Eliminar';df.addEventListener('click',onDelete);G('gen-foot').appendChild(df);}
  var cf=mk('button','btn btn-sm');cf.textContent='Cancel·lar';cf.setAttribute('data-close','gen-modal');G('gen-foot').appendChild(cf);
  om('gen-modal');
}

// ══ SETTINGS ══
function renderSettings(){
  var tabs=['General','Persones','Categories','Seccions','Usuaris'];
  var stabs=G('stabs');stabs.innerHTML='';
  var sbody=G('sbody');sbody.innerHTML='';
  var curTab=0;
  function showTab(i){
    curTab=i;stabs.querySelectorAll('.stab').forEach(function(t,j){t.classList.toggle('active',j===i);});
    sbody.innerHTML='';
    if(i===0)renderSettingsGeneral();
    else if(i===1)renderSettingsPeople();
    else if(i===2)renderSettingsCats();
    else if(i===3)renderSettingsSections();
    else if(i===4)renderSettingsUsers();
  }
  tabs.forEach(function(t,i){var btn=mk('button','stab'+(i===0?' active':''));btn.textContent=t;btn.addEventListener('click',function(){showTab(i);});stabs.appendChild(btn);});
  showTab(0);
}
function renderSettingsGeneral(){
  var b=G('sbody');
  b.innerHTML='<div class="s-sec"><div class="s-h">Configuració general</div>'+
    '<div class="field" style="margin-bottom:8px"><div class="flbl">Títol compte enrere</div><input type="text" id="cfg-cl" class="finp" value="'+eq(D.cfg.countdownLabel||'')+'"></div>'+
    '<div class="field" style="margin-bottom:8px"><div class="flbl">Data compte enrere</div><input type="date" id="cfg-cd" class="finp" value="'+eq(D.cfg.countdownDate||'')+'"></div>'+
    '<div class="field" style="margin-bottom:8px"><div class="flbl">Subtítol hero</div><input type="text" id="cfg-hs" class="finp" value="'+eq(D.cfg.heroSubtitle||'')+'"></div>'+
    '<div class="field" style="margin-bottom:8px"><div class="flbl">URL Logo</div><input type="text" id="cfg-lu" class="finp" value="'+eq(D.cfg.logoUrl||'')+'"></div>'+
    '<button class="btn btn-p btn-sm" id="cfg-save" style="margin-top:8px">Guardar</button></div>';
  G('cfg-save').addEventListener('click',async function(){saveUndo();D.cfg.countdownLabel=gv('cfg-cl');D.cfg.countdownDate=gv('cfg-cd');D.cfg.heroSubtitle=gv('cfg-hs');D.cfg.logoUrl=gv('cfg-lu');await saveMain();buildPage();buildStats_update();toast('✓ Configuració guardada');});
  // New section
  var ns=mk('div','s-sec');ns.style.marginTop='16px';ns.innerHTML='<div class="s-h">Nova secció</div>';
  var nb=mk('button','btn btn-sm');nb.textContent='+ Afegir secció';nb.addEventListener('click',function(){openNewSectionModal();});ns.appendChild(nb);b.appendChild(ns);
}
function renderSettingsPeople(){
  var b=G('sbody');b.innerHTML='<div class="s-sec"><div class="s-h">Equip</div><div id="people-list"></div><button class="btn btn-sm" id="add-person" style="margin-top:8px">+ Afegir</button></div>';
  function renderPL(){
    var pl=G('people-list');pl.innerHTML='';
    D.people.forEach(function(p,i){
      var row=mk('div','irow');row.innerHTML='<div class="av" style="background:'+p.color+'">'+esc(p.name.charAt(0))+'</div><div class="im"><div class="iname">'+esc(p.name)+'</div><div class="isub">'+esc(p.role)+'</div></div>';
      var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){saveUndo();D.people.splice(i,1);await saveMain();renderPL();toast('Eliminat');});row.appendChild(db);pl.appendChild(row);
    });
  }
  renderPL();
  G('add-person').addEventListener('click',function(){
    genModal('Nova persona','<div class="field"><div class="flbl">Nom</div><input type="text" id="gm-n" class="finp"></div><div class="field"><div class="flbl">Rol</div><input type="text" id="gm-r" class="finp"></div><div class="field"><div class="flbl">Color</div><input type="color" id="gm-c" class="finp finp-color" value="#00c8d4"></div>',
      async function(){var n=gv('gm-n').trim();if(!n)return;saveUndo();D.people.push({id:uid(),name:n,role:gv('gm-r'),color:gv('gm-c')});cm('gen-modal');await saveMain();renderSettingsPeople();toast('✓ Afegit');});
  });
}
function renderSettingsCats(){
  var b=G('sbody');b.innerHTML='<div class="s-sec"><div class="s-h">Categories</div><div id="cat-list"></div><button class="btn btn-sm" id="add-cat" style="margin-top:8px">+ Afegir</button></div>';
  function renderCL(){
    var cl=G('cat-list');cl.innerHTML='';
    D.categories.forEach(function(c,i){
      var row=mk('div','irow');row.innerHTML='<div style="width:12px;height:12px;border-radius:3px;background:'+c.color+';flex-shrink:0"></div><div class="im"><div class="iname">'+esc(c.name)+'</div></div>';
      var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){saveUndo();D.categories.splice(i,1);await saveMain();renderCL();toast('Eliminat');});row.appendChild(db);cl.appendChild(row);
    });
  }
  renderCL();
  G('add-cat').addEventListener('click',function(){
    genModal('Nova categoria','<div class="field"><div class="flbl">Nom</div><input type="text" id="gm-n" class="finp"></div><div class="field"><div class="flbl">Color</div><input type="color" id="gm-c" class="finp finp-color" value="#00c8d4"></div>',
      async function(){var n=gv('gm-n').trim();if(!n)return;saveUndo();D.categories.push({id:uid(),name:n,color:gv('gm-c')});cm('gen-modal');await saveMain();renderSettingsCats();toast('✓ Afegit');});
  });
}
function renderSettingsSections(){
  var b=G('sbody');b.innerHTML='<div class="s-sec"><div class="s-h">Seccions visibles (usuaris)</div><div id="sec-vis-list"></div></div>';
  var svl=G('sec-vis-list');
  var unames=Object.keys(D.users).filter(function(u){return u!=='admin';});
  unames.forEach(function(u){
    var uDiv=mk('div','');uDiv.style.marginBottom='12px';
    var uh=mk('div','s-h');uh.textContent=getUserName(u);uDiv.appendChild(uh);
    D.sections.filter(function(s){return s.type!=='trash';}).forEach(function(s){
      var allowed=D.userSections[u];var isOn=!allowed||allowed.includes(s.id);
      var row=mk('div','irow');row.style.cursor='pointer';
      var sw=mk('div','csw');sw.style.background=isOn?'var(--cyan)':'transparent';
      row.innerHTML='<div class="im"><div class="iname">'+esc(s.name)+'</div></div>';row.appendChild(sw);
      row.addEventListener('click',async function(){
        if(!D.userSections[u])D.userSections[u]=D.sections.filter(function(x){return x.type!=='trash';}).map(function(x){return x.id;});
        var idx=D.userSections[u].indexOf(s.id);
        if(idx>=0)D.userSections[u].splice(idx,1);else D.userSections[u].push(s.id);
        sw.style.background=D.userSections[u].includes(s.id)?'var(--cyan)':'transparent';
        await saveMain();toast('✓ Guardat');
      });
      uDiv.appendChild(row);
    });
    svl.appendChild(uDiv);
  });
}
function renderSettingsUsers(){
  var b=G('sbody');b.innerHTML='<div class="s-sec"><div class="s-h">Usuaris</div><div id="usr-list"></div><button class="btn btn-sm" id="add-usr" style="margin-top:8px">+ Afegir usuari</button></div>';
  function renderUL(){
    var ul=G('usr-list');ul.innerHTML='';
    Object.keys(D.users).forEach(function(u){
      var uobj=D.users[u];var name=uobj&&uobj.name?uobj.name:u;
      var row=mk('div','irow');row.innerHTML='<div class="im"><div class="iname">'+esc(name)+'</div><div class="isub">@'+esc(u)+'</div></div>';
      if(u!=='admin'){var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){if(!confirm('Eliminar usuari @'+u+'?'))return;saveUndo();delete D.users[u];await saveUsers();renderUL();toast('Eliminat');});row.appendChild(db);}
      ul.appendChild(row);
    });
  }
  renderUL();
  G('add-usr').addEventListener('click',function(){
    genModal('Nou usuari','<div class="field"><div class="flbl">Nom usuari (login)</div><input type="text" id="gm-u" class="finp"></div><div class="field"><div class="flbl">Nom visible</div><input type="text" id="gm-n" class="finp"></div><div class="field"><div class="flbl">Contrasenya</div><input type="password" id="gm-p" class="finp"></div>',
      async function(){var u=gv('gm-u').trim().toLowerCase();var n=gv('gm-n').trim();var p=gv('gm-p');if(!u||!p){toast('Completa tots els camps');return;}saveUndo();D.users[u]={pass:p,name:n||u};cm('gen-modal');await saveUsers();renderSettingsUsers();toast('✓ Usuari creat');});
  });
}
function openNewSectionModal(){
  var pg=G('ptype-grid');pg.innerHTML='';var selType=null;
  PAGE_TYPES.forEach(function(pt){
    var card=mk('div','ptype-card');card.innerHTML='<div class="ptype-icon">'+pt.icon+'</div><div class="ptype-name">'+pt.name+'</div><div class="ptype-desc">'+pt.desc+'</div>';
    card.addEventListener('click',function(){pg.querySelectorAll('.ptype-card').forEach(function(c){c.classList.remove('sel');});card.classList.add('sel');selType=pt.type;sv('np-name',pt.name);});
    pg.appendChild(card);
  });
  om('ptype-modal');
  G('np-create').onclick=async function(){
    if(!selType){toast('Selecciona un tipus');return;}
    var name=gv('np-name').trim();if(!name){toast('Afegeix un nom');return;}
    saveUndo();
    var sec={id:'s_'+uid(),type:selType,name:name,desc:gv('np-desc'),fields:JSON.parse(JSON.stringify(DEF_FIELDS[selType]||[])),records:[],stages:selType==='pipeline'?['Idea','Esborrany','Llest']:undefined,blocks:selType==='document'?[]:undefined};
    D.sections.splice(D.sections.length-1,0,sec);
    cm('ptype-modal');await saveMain();buildPage();toast('✓ Secció creada');
  };
}
function openFieldNew(sec,cb){
  st('fm-title','Nou camp');sv('fm-name','');sv('fm-type','text');sv('fm-opts','');G('fm-opts-wrap').style.display='none';
  G('fm-type').onchange=function(){G('fm-opts-wrap').style.display=(this.value==='select'||this.value==='multiselect'||this.value==='checklist')?'block':'none';};
  om('field-modal');
  G('fm-save').onclick=async function(){var n=gv('fm-name').trim();if(!n)return;saveUndo();var opts=gv('fm-opts').split('\n').map(function(s){return s.trim();}).filter(Boolean);sec.fields.push({id:'f'+uid(),name:n,type:gv('fm-type'),options:opts.length?opts:undefined,sys:false});cm('field-modal');await saveMain();if(cb)cb();toast('✓ Camp afegit');};
}
function openFieldEdit(f,sec,cb){
  st('fm-title','Editar camp');sv('fm-name',f.name);sv('fm-type',f.type);sv('fm-opts',(f.options||[]).join('\n'));
  G('fm-opts-wrap').style.display=(f.type==='select'||f.type==='multiselect'||f.type==='checklist')?'block':'none';
  G('fm-type').onchange=function(){G('fm-opts-wrap').style.display=(this.value==='select'||this.value==='multiselect'||this.value==='checklist')?'block':'none';};
  om('field-modal');
  G('fm-save').onclick=async function(){saveUndo();f.name=gv('fm-name')||f.name;f.type=gv('fm-type');var opts=gv('fm-opts').split('\n').map(function(s){return s.trim();}).filter(Boolean);f.options=opts.length?opts:f.options;cm('field-modal');await saveMain();if(cb)cb();toast('✓ Actualitzat');};
}
