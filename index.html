<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERODANCE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020406;--bg2:#060c0e;--bg3:#0d1a1c;--bg4:#122022;
  --cyan:#00c8d4;--cyan2:#00e5f0;--cyan3:rgba(0,200,212,0.07);
  --text:#f0ede8;--muted:#506060;
  --border:rgba(0,200,212,0.07);--border2:rgba(0,200,212,0.15);
  --red:#e05252;--green:#52c97a;--amber:#d4a044;--purple:#a78bfa;
  --gold:#c9a84c;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-title:Georgia,serif;
  --r:8px;--r2:16px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* EDIT MODE */
.edit-only{display:none!important}
body.edit-mode .edit-only{display:flex!important}
body.edit-mode .edit-only-block{display:block!important}
.edit-only-block{display:none!important}

/* DOTS MENU — only shown in edit mode */
.sec-dots-btn{
  position:absolute;top:16px;right:16px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,200,212,.1);border:1px solid var(--border2);
  color:var(--cyan);font-size:16px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  z-index:20;transition:background .2s;letter-spacing:1px;font-weight:700;line-height:1;
  user-select:none;
}
body.edit-mode .sec-dots-btn{display:flex!important}
.sec-dots-btn:hover{background:rgba(0,200,212,.22)}
.dots-menu{
  position:absolute;top:52px;right:16px;z-index:50;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r2);padding:6px;min-width:210px;
  box-shadow:0 10px 36px rgba(0,0,0,.8);
  display:none;flex-direction:column;gap:1px;
}
.dots-menu.open{display:flex}
.dots-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:var(--r);cursor:pointer;font-size:12px;
  color:var(--text);letter-spacing:.04em;transition:background .15s;white-space:nowrap;
}
.dots-item:hover{background:var(--cyan3);color:var(--cyan)}
.dots-item.danger{color:var(--red)}
.dots-item.danger:hover{background:rgba(224,82,82,.08);color:var(--red)}
.dots-sep{height:1px;background:var(--border);margin:3px 0}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,90,108,.5) 0%,rgba(0,24,32,.3) 42%,rgba(2,4,6,1) 70%)}
.login-orb{position:absolute;border-radius:50%;pointer-events:none}
.login-orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(0,155,180,.12) 0%,transparent 65%);top:-12%;left:-8%;animation:orb1 14s ease-in-out infinite}
.login-orb-2{width:480px;height:480px;background:radial-gradient(circle,rgba(0,95,115,.16) 0%,transparent 65%);bottom:-14%;right:-6%;animation:orb2 18s ease-in-out infinite}
@keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.08)}}
@keyframes orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,50px)}}
.login-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.login-logo-wrap{min-height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.login-logo-img{max-height:85px;max-width:300px;object-fit:contain}
.login-wordmark{font-family:var(--font-title);font-size:clamp(34px,7vw,70px);letter-spacing:.22em;color:#fff;font-weight:400;text-transform:uppercase;line-height:1}
.login-subtitle{font-size:clamp(13px,2.3vw,20px);letter-spacing:.42em;color:var(--cyan);font-style:italic;font-weight:300;margin-top:8px}
.login-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.14);text-transform:uppercase;margin-top:12px}
.login-box{width:286px;display:flex;flex-direction:column;gap:12px;margin-top:40px}
.login-lbl{font-size:9px;letter-spacing:.2em;color:rgba(0,200,212,.5);text-transform:uppercase;margin-bottom:4px}
.login-inp{background:rgba(0,14,18,.7);border:1px solid rgba(0,200,212,.13);border-radius:6px;color:var(--text);font-family:var(--font-sans);font-size:14px;padding:11px 14px;outline:none;transition:border-color .25s;width:100%}
.login-inp:focus{border-color:rgba(0,200,212,.38)}
.login-btn{background:transparent;border:1px solid rgba(0,200,212,.33);border-radius:6px;color:var(--cyan);font-size:11px;letter-spacing:.2em;padding:13px;cursor:pointer;transition:all .25s;font-family:var(--font-sans);text-transform:uppercase;margin-top:4px}
.login-btn:hover{background:var(--cyan);color:#000}
.login-err{font-size:11px;color:var(--red);text-align:center;min-height:16px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
#app.visible{display:flex}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;display:flex;align-items:center;padding:0 28px;gap:10px;transition:background .4s,border-color .4s}
.topbar.scrolled{background:rgba(2,4,6,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.top-logo-img{max-height:28px;max-width:110px;object-fit:contain}
.top-wordmark{font-family:var(--font-title);font-size:13px;letter-spacing:.28em;color:#fff;text-transform:uppercase;font-weight:400}
.top-nav{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;padding:0 12px}
.top-nav::-webkit-scrollbar{display:none}
.top-nav-btn{background:transparent;border:none;color:var(--muted);font-size:10px;letter-spacing:.1em;padding:5px 11px;border-radius:4px;cursor:pointer;white-space:nowrap;font-family:var(--font-sans);transition:all .2s;text-transform:uppercase}
.top-nav-btn:hover{color:var(--cyan)}
.top-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.top-welcome{font-size:11px;color:var(--muted);letter-spacing:.05em}
.top-badge{font-size:9px;background:var(--cyan3);color:var(--cyan);padding:2px 6px;border-radius:10px;letter-spacing:.1em;border:1px solid var(--border2)}
.tbtn{font-size:10px;color:var(--muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;transition:all .2s;font-family:var(--font-sans);letter-spacing:.08em;text-transform:uppercase}
.tbtn:hover{color:var(--cyan);border-color:var(--border2)}
#btn-settings{transition:all .25s}
#btn-settings.active{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700}
.tbtn-undo{color:var(--amber);border-color:rgba(212,160,68,.2);display:none}

/* GLOBAL GLOWS */
.page-glow{position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
.page-glow-1{width:700px;height:700px;background:radial-gradient(circle,rgba(0,140,165,.08) 0%,transparent 65%);top:4%;left:-10%;animation:orb1 16s ease-in-out infinite}
.page-glow-2{width:600px;height:600px;background:radial-gradient(circle,rgba(0,80,100,.1) 0%,transparent 65%);bottom:8%;right:-8%;animation:orb2 20s ease-in-out infinite}

/* FADE IN */
.fade-in{opacity:0;transform:translateY(26px);transition:opacity .85s ease,transform .85s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}

/* SECTIONS */
.hub-sec{padding:82px 0;border-top:1px solid var(--border);position:relative}
.hub-sec:first-child{border-top:none}
.sec-inner{max-width:1240px;margin:0 auto;padding:0 50px}
.sec-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:38px;gap:16px;flex-wrap:wrap}
.sec-title{font-family:var(--font-title);font-size:clamp(21px,3.3vw,38px);font-weight:400;letter-spacing:.08em;color:#fff;line-height:1.1}
.sec-desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6;max-width:440px;letter-spacing:.03em}
.sec-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;flex-shrink:0}

/* HERO */
.hero-sec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:80px 50px 60px}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(0,95,112,.52) 0%,rgba(0,28,36,.32) 40%,rgba(2,4,6,1) 70%)}
.hero-grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none}
.hero-orb-1{width:min(60vw,600px);height:min(60vw,600px);background:radial-gradient(circle,rgba(0,180,210,.15) 0%,transparent 65%);top:-12%;left:-6%;animation:orb1 13s ease-in-out infinite}
.hero-orb-2{width:min(50vw,500px);height:min(50vw,500px);background:radial-gradient(circle,rgba(0,100,125,.2) 0%,transparent 65%);bottom:-18%;right:-9%;animation:orb2 17s ease-in-out infinite}
.hero-content{position:relative;z-index:1;text-align:center;max-width:840px}
.hero-logo-img{max-height:95px;max-width:360px;object-fit:contain;margin-bottom:14px}
.hero-title{font-family:var(--font-title);font-size:clamp(48px,10vw,115px);letter-spacing:.13em;color:#fff;font-weight:400;text-transform:uppercase;line-height:.95;display:block}
.hero-sub{font-size:clamp(14px,2.7vw,25px);letter-spacing:.44em;color:var(--cyan);font-style:italic;display:block;margin-top:10px}
.hero-tagline{font-size:9px;letter-spacing:.36em;color:rgba(255,255,255,.17);text-transform:uppercase;display:block;margin-top:18px}
.hero-welcome{font-size:12px;letter-spacing:.13em;color:rgba(0,200,212,.6);display:block;margin-top:28px;font-style:italic}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;opacity:.33;transition:opacity .25s;z-index:1}
.hero-scroll:hover{opacity:.8}
.hero-scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--cyan),transparent)}
.hero-scroll-txt{font-size:8px;letter-spacing:.26em;color:var(--cyan);text-transform:uppercase}

/* STATS — KPI CARDS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.stat-card{background:var(--bg2);padding:20px 16px;position:relative}
.stat-lbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat-val{font-family:var(--font-title);font-size:28px;color:#fff;font-weight:400;line-height:1}
.stat-trend{font-size:10px;margin-top:4px;letter-spacing:.04em}
.stat-trend.up{color:var(--green)}
.stat-trend.down{color:var(--red)}

/* PILLAR BADGE */
.pillar-badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.p-espectacle{background:rgba(201,168,76,.15);color:var(--gold)}
.p-comunitat{background:rgba(0,200,212,.12);color:var(--cyan)}
.p-historia{background:rgba(167,139,250,.14);color:var(--purple)}
.p-competicio{background:rgba(82,201,122,.14);color:var(--green)}
.p-participacio{background:rgba(224,82,82,.13);color:var(--red)}

/* PIPELINE */
.board-scroll{display:flex;gap:13px;overflow-x:auto;padding-bottom:13px}
.stage-col{display:flex;flex-direction:column;min-width:236px;flex:0 0 236px}
.stage-hd{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 2px 9px;border-bottom:1px solid var(--sc,var(--border));margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.stage-n{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000}
.post-cards{display:flex;flex-direction:column;gap:6px}
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .2s}
.post-card:hover{border-color:var(--border2);background:var(--bg3)}
.pc-title{font-size:12px;color:var(--text);line-height:1.4;margin-bottom:6px;letter-spacing:.02em}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.04em}
.chip-m{background:rgba(255,255,255,.04);color:var(--muted)}
.add-stage{border:1px dashed var(--border);border-radius:var(--r);background:transparent;color:var(--muted);font-size:10px;padding:7px;cursor:pointer;transition:all .2s;margin-top:5px;width:100%;letter-spacing:.08em}
.add-stage:hover{border-color:var(--cyan);color:var(--cyan)}

/* PHASE TAG */
.phase-tag{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.ph-siembra{background:rgba(82,201,122,.12);color:var(--green)}
.ph-construccio{background:rgba(212,160,68,.14);color:var(--amber)}
.ph-activacio{background:rgba(0,200,212,.12);color:var(--cyan)}
.ph-carnaval{background:rgba(167,139,250,.14);color:var(--purple)}

/* CALENDAR */
.cal-wrap{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.cal-hd{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.cal-nav{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 11px;cursor:pointer;font-size:10px;transition:all .2s}
.cal-nav:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-lbl{font-family:var(--font-title);font-size:16px;letter-spacing:.12em;flex:1;color:#fff}
.cal-gw{padding:12px 15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dn{text-align:center;font-size:8px;color:var(--muted);padding:3px 0 7px;text-transform:uppercase;letter-spacing:.14em}
.cal-cell{min-height:68px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px;cursor:pointer;transition:border-color .2s}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.today{border-color:rgba(0,200,212,.35)}
.cal-cell.other{opacity:.15}
.cal-num{font-size:9px;color:var(--muted);margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--cyan)}
.cal-ev{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.cal-leg{padding:10px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:9px;background:var(--bg2);align-items:center}
.leg-it{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);letter-spacing:.06em}
.leg-sw{width:7px;height:7px;border-radius:2px}

/* LIST */
.list-it{display:flex;align-items:flex-start;gap:11px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 15px;margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.list-it:hover{border-color:var(--border2)}
.list-it.done{opacity:.33}
.list-chk{width:15px;height:15px;border-radius:4px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:8px;cursor:pointer;transition:all .2s}
.list-it.done .list-chk{background:var(--green);border-color:var(--green);color:#000}
.li-info{flex:1;min-width:0}
.li-title{font-size:13px;color:var(--text);margin-bottom:3px;letter-spacing:.02em}
.list-it.done .li-title{text-decoration:line-through;color:var(--muted)}
.li-sub{font-size:11px;color:var(--muted);line-height:1.4;letter-spacing:.03em}
.dl-badge{font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.07em}
.br{background:rgba(224,82,82,.12);color:var(--red)}
.ba{background:rgba(212,160,68,.15);color:var(--amber)}
.bc{background:rgba(0,200,212,.1);color:var(--cyan)}
.dl-days{font-family:var(--font-title);font-size:15px;min-width:44px;text-align:right;flex-shrink:0}

/* SPONSORS */
.sponsor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sponsor-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;transition:border-color .2s;cursor:pointer}
.sponsor-card:hover{border-color:var(--border2)}
.sponsor-name{font-size:14px;color:var(--text);font-weight:500;margin-bottom:3px;letter-spacing:.03em}
.sponsor-role{font-size:11px;color:var(--muted);margin-bottom:10px;letter-spacing:.04em}
.sponsor-status{font-size:9px;padding:2px 8px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ss-contactat{background:rgba(212,160,68,.15);color:var(--amber)}
.ss-interessat{background:rgba(0,200,212,.12);color:var(--cyan)}
.ss-confirmat{background:rgba(82,201,122,.14);color:var(--green)}
.ss-rebutjat{background:rgba(224,82,82,.12);color:var(--red)}
.sponsor-amount{font-family:var(--font-title);font-size:18px;color:var(--gold);font-weight:400;letter-spacing:.05em;margin-top:6px}

/* THEMES */
.themes-s{position:relative;padding:0 0 20px}
.themes-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(to bottom,transparent,rgba(0,200,212,.11) 15%,rgba(0,200,212,.11) 85%,transparent);transform:translateX(-50%);pointer-events:none}
.theme-row{display:flex;align-items:center;margin-bottom:34px;position:relative}
.theme-row:nth-child(odd){justify-content:flex-start;padding-left:3%}
.theme-row:nth-child(even){justify-content:flex-end;padding-right:3%}
.theme-node{position:relative;width:min(44vw,420px);flex-shrink:0}
.theme-link{display:block;text-decoration:none}
.theme-card{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9;background:var(--bg3)}
.theme-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,130,155,.3) 0%,rgba(0,25,36,.55) 55%,rgba(2,4,6,.97) 100%);z-index:1;transition:opacity .5s}
.theme-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(.35) blur(1.5px);transition:transform .7s cubic-bezier(.4,0,.2,1),filter .7s ease;z-index:0}
.theme-yr-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:min(9vw,88px);color:rgba(0,200,212,.055);letter-spacing:.05em;pointer-events:none;user-select:none;z-index:2}
.theme-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,8,12,.35) 55%,rgba(0,20,26,.06) 100%);z-index:3}
.theme-info{position:absolute;bottom:0;left:0;right:0;padding:18px 20px;z-index:4}
.t-year{font-size:8px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase;margin-bottom:4px;transition:color .3s}
.t-name{font-family:var(--font-title);font-size:clamp(16px,2.7vw,28px);color:#fff;font-weight:400;letter-spacing:.08em;line-height:1.2;transition:letter-spacing .4s}
.t-desc{font-size:11px;color:rgba(255,255,255,.38);margin-top:6px;line-height:1.6;letter-spacing:.04em;max-height:0;overflow:hidden;transition:max-height .5s ease,opacity .5s;opacity:0}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);position:absolute;top:50%;right:-5.5%;transform:translateY(-50%);z-index:5;box-shadow:0 0 12px rgba(0,200,212,.45);pointer-events:none}
.theme-row:nth-child(even) .theme-dot{left:-5.5%;right:auto}
.theme-link:hover .theme-img{transform:scale(1.06);filter:brightness(.5) saturate(.8) blur(0)}
.theme-link:hover .theme-glow{opacity:.6}
.theme-link:hover .t-desc{max-height:90px;opacity:1}
.theme-link:hover .t-year{color:var(--cyan2)}
.theme-link:hover .t-name{letter-spacing:.12em}

/* DOCUMENT */
.ed-block-link{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--lc,var(--cyan));border-radius:var(--r);padding:11px 15px;margin-bottom:7px;text-decoration:none;transition:all .2s}
.ed-block-link:hover{background:var(--bg3);border-color:var(--border2)}
.ed-link-icon{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ed-link-name{font-size:13px;color:var(--text);letter-spacing:.03em}
.ed-link-url{font-size:10px;color:var(--muted)}
.ed-text-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;letter-spacing:.03em}
.ed-sub-h{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin:18px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--border);opacity:.7}
.ed-img-block img{max-width:100%;border-radius:var(--r);border:1px solid var(--border)}

/* GALLERY */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.gal-card{border-radius:var(--r2);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:4/3;background:var(--bg3)}
.gal-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s,filter .5s;filter:brightness(.65)}
.gal-card:hover img{transform:scale(1.05);filter:brightness(.85)}
.gal-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted)}
.gal-cap{position:absolute;bottom:0;left:0;right:0;padding:9px 11px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);font-size:10px;color:rgba(255,255,255,.65)}

/* TRASH */
.trash-it{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:5px}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:600;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-sm{max-width:400px}
.modal-lg{max-width:760px}
.mhd{padding:15px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1}
.mtitle{font-family:var(--font-title);font-size:16px;letter-spacing:.08em;color:#fff;font-weight:400}
.mclose{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 7px;transition:color .2s}
.mclose:hover{color:var(--text)}
.mbody{padding:17px 20px;display:flex;flex-direction:column;gap:12px}
.mfoot{padding:11px 20px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg2)}

/* FORMS */
.field{display:flex;flex-direction:column;gap:5px}
.flbl{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.finp{background:rgba(0,16,20,.85);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:9px 11px;outline:none;transition:border-color .2s;width:100%;letter-spacing:.03em}
.finp:focus{border-color:rgba(0,200,212,.38)}
.finp-ta{resize:vertical;min-height:70px;line-height:1.6}
.finp-color{height:34px;padding:3px 5px;cursor:pointer}
select.finp option{background:var(--bg4)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pchecks{display:flex;flex-wrap:wrap;gap:5px}
.pcheck{display:flex;align-items:center;gap:5px;background:rgba(0,16,20,.6);border:1px solid var(--border2);border-radius:5px;padding:5px 9px;cursor:pointer;font-size:11px;color:var(--muted);user-select:none;transition:all .2s}
.pcheck.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan3)}
.pcheck-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* SETTINGS DRAWER */
#settings-panel{position:fixed;top:52px;right:0;bottom:0;z-index:300;width:min(340px,92vw);background:var(--bg2);border-left:1px solid var(--border2);display:none;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.5)}
#settings-panel.open{display:flex}
.sdw-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sdw-title{font-family:var(--font-title);font-size:14px;letter-spacing:.1em;color:var(--cyan)}
.stabs{display:flex;gap:1px;padding:8px 18px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-wrap:wrap;flex-shrink:0}
.stab{padding:6px 11px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:transparent;font-family:var(--font-sans);white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
.stab:hover{color:var(--text)}
.stab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.sbody{flex:1;overflow-y:auto;padding:16px 18px}
.s-sec{margin-bottom:22px}
.s-h{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px;opacity:.8}
.irow{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;margin-bottom:4px}
.irow:hover{border-color:var(--border2)}
.im{flex:1;min-width:0}
.iname{font-size:12px;color:var(--text);letter-spacing:.03em}
.isub{font-size:10px;color:var(--muted)}
.csw{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.07)}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}

/* BTNS */
.btn{font-family:var(--font-sans);font-size:10px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.1em;text-transform:uppercase}
.btn:hover{background:rgba(255,255,255,.03)}
.btn-p{background:var(--cyan);border-color:var(--cyan);color:#000;font-weight:600}
.btn-p:hover{background:var(--cyan2);color:#000}
.btn-d{border-color:rgba(224,82,82,.25);color:var(--red)}
.btn-d:hover{background:rgba(224,82,82,.07)}
.btn-sm{font-size:9px;padding:5px 11px}
.btn-xs{font-size:9px;padding:3px 8px}

/* PAGE TYPE GRID */
.ptype-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptype-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px;cursor:pointer;transition:all .2s;text-align:center}
.ptype-card:hover,.ptype-card.sel{border-color:var(--cyan);background:var(--cyan3)}
.ptype-icon{font-size:22px;margin-bottom:6px}
.ptype-name{font-size:10px;font-weight:600;color:var(--text);margin-bottom:2px;letter-spacing:.1em;text-transform:uppercase}
.ptype-desc{font-size:9px;color:var(--muted);line-height:1.4}

/* IMG UPLOAD */
.img-area{border:1px dashed var(--border2);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:border-color .2s;color:var(--muted);font-size:11px;letter-spacing:.07em}
.img-area:hover{border-color:var(--cyan)}

/* FIELD BUILDER */
.fb-row{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;margin-bottom:4px}
.fb-badge{font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.04);color:var(--muted);letter-spacing:.1em}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;z-index:700;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:9px 15px;font-size:11px;letter-spacing:.07em;display:none;align-items:center;gap:7px;box-shadow:0 8px 28px rgba(0,0,0,.7)}
.toast.show{display:flex}
.sep{height:1px;background:var(--border);margin:10px 0}
</style>

// ══ UNDO ══
var undoSnap=null;
function saveUndo(){undoSnap=JSON.stringify({sections:D.sections,categories:D.categories,people:D.people,hashtags:D.hashtags,cfg:D.cfg,legendExtra:D.legendExtra,trash:D.trash,userSections:D.userSections,users:D.users,kpiHistory:D.kpiHistory});G('btn-undo').style.display='inline-flex';}
function doUndo(){if(!undoSnap)return;var s=JSON.parse(undoSnap);Object.assign(D,s);undoSnap=null;G('btn-undo').style.display='none';saveMain();buildPage();toast('↩ Desfet');}

// ══ SAVE / LOAD ══
async function saveMain(){await dbSet('aero_main',{sections:D.sections,categories:D.categories,people:D.people,hashtags:D.hashtags,cfg:D.cfg,legendExtra:D.legendExtra,trash:D.trash,userSections:D.userSections,kpiHistory:D.kpiHistory});}
async function saveUsers(){await dbSet('aero_users',D.users);}
async function loadAll(){
  var main=await dbGet('aero_main');var users=await dbGet('aero_users');
  D=JSON.parse(JSON.stringify(DEFAULTS));
  if(main){['sections','categories','people','hashtags','cfg','legendExtra','trash','userSections','kpiHistory'].forEach(function(k){if(main[k]!==undefined)D[k]=main[k];});}
  D.users=JSON.parse(JSON.stringify(DEFAULTS.users));
  if(users){Object.keys(users).forEach(function(u){var v=users[u];D.users[u]=typeof v==='object'?v:{pass:v,name:u};});}
}

G('cpwd-save').addEventListener('click',async function(){
  var old=gv('cpwd-old'),nw=gv('cpwd-new'),conf=gv('cpwd-c');
  var uobj=D.users[currentUser];var oldPass=uobj?(uobj.pass||uobj):'';
  if(oldPass!==old){st('cpwd-err','Contrasenya actual incorrecta');return;}
  if(nw.length<4){st('cpwd-err','Mínim 4 caràcters');return;}
  if(nw!==conf){st('cpwd-err','No coincideixen');return;}
  if(typeof D.users[currentUser]==='object')D.users[currentUser].pass=nw;else D.users[currentUser]=nw;
  await saveUsers();cm('chpwd-modal');toast('✓ Contrasenya canviada');
});

async function doLogin(){
  var u=gv('l-user').trim(),p=gv('l-pass');
  st('l-err','Verificant...');await loadAll();
  var uobj=D.users[u];var pass=uobj?(typeof uobj==='object'?uobj.pass:uobj):'';
  if(pass&&pass===p){
    currentUser=u;G('login-screen').style.display='none';G('app').classList.add('visible');
    var dn=uobj&&uobj.name?uobj.name:u;
    st('top-welcome','Benvinguda, '+dn);
    G('top-badge').style.display=isAdmin()?'inline':'none';
    st('l-err','');applyLogo();applyFont();buildPage();
  }else{st('l-err','Usuari o contrasenya incorrectes');setTimeout(function(){st('l-err','');},2500);}
}
function doLogout(){currentUser=null;setEditMode(false);G('login-screen').style.display='flex';G('app').classList.remove('visible');}
function getUserName(u){var uobj=D.users[u];return uobj&&uobj.name?uobj.name:u;}

// ══ LOGO & FONT ══
function applyLogo(){
  var logo=D.cfg.logoUrl||'';
  var lw=G('login-logo-wrap');
  if(logo)lw.innerHTML='<img class="login-logo-img" src="'+logo+'" alt="ADC">';
  else lw.innerHTML='<div class="login-wordmark">AERODANCE</div>';
  var tw=G('top-wordmark');
  if(logo&&tw&&tw.parentNode)tw.parentNode.innerHTML='<img class="top-logo-img" src="'+logo+'" alt="ADC">';
  else if(tw)tw.textContent='AERODANCE';
  var ls=G('login-subtitle');if(ls)ls.textContent=D.cfg.heroSubtitle||'Berlin After Dark';
}
function applyFont(){
  var f=D.cfg.fontTitle||'Georgia,serif';
  if(D.cfg.customFontName&&D.cfg.customFontUrl){
    if(!document.getElementById('custom-font-style')){var s=document.createElement('style');s.id='custom-font-style';s.textContent='@font-face{font-family:"'+D.cfg.customFontName+'";src:url("'+D.cfg.customFontUrl+'");}';document.head.appendChild(s);}
    f='"'+D.cfg.customFontName+'",'+f;
  }
  document.documentElement.style.setProperty('--font-title',f);
}

// ══ BUILD PAGE ══
function getVisibleSections(){
  if(isAdmin())return D.sections;
  var allowed=D.userSections&&D.userSections[currentUser];
  if(!allowed)return D.sections.filter(function(s){return s.type!=='trash';});
  return D.sections.filter(function(s){return allowed.includes(s.id);});
}
function buildPage(){
  applyLogo();applyFont();buildTopNav();
  var main=G('main-scroll');main.innerHTML='';
  getVisibleSections().forEach(function(sec){
    var el=mk('div','hub-sec');el.id='sec-'+sec.id;el.style.position='relative';
    main.appendChild(el);renderSection(el,sec);
  });
  obsFade(main);
}
function buildTopNav(){
  var nav=G('top-nav');nav.innerHTML='';
  getVisibleSections().filter(function(s){return s.type!=='hero';}).forEach(function(sec){
    var btn=mk('button','top-nav-btn');btn.textContent=sec.name;
    btn.addEventListener('click',function(){var el=G('sec-'+sec.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
    nav.appendChild(btn);
  });
}

function renderSection(el,sec){
  el.innerHTML='';
  if(sec.type==='hero')renderHero(el,sec);
  else if(sec.type==='stats')renderStats(el,sec);
  else if(sec.type==='pipeline')renderPipeline(el,sec);
  else if(sec.type==='calendar')renderCal(el,sec);
  else if(sec.type==='deadlines')renderDeadlines(el,sec);
  else if(sec.type==='tasks')renderTasks(el,sec);
  else if(sec.type==='document')renderDoc(el,sec);
  else if(sec.type==='gallery')renderGallery(el,sec);
  else if(sec.type==='themes')renderThemes(el,sec);
  else if(sec.type==='sponsors')renderSponsors(el,sec);
  else if(sec.type==='trash')renderTrash(el,sec);
  // DOTS BUTTON — admin only, visible ONLY in edit mode
  if(isAdmin()&&sec.type!=='hero'&&sec.type!=='stats'){
    var dotsBtn=mk('button','sec-dots-btn');dotsBtn.innerHTML='···';dotsBtn.title='Opcions';
    var dotsMenu=mk('div','dots-menu');dotsMenu.id='dots-'+sec.id;
    buildDotsMenu(dotsMenu,sec,el);
    dotsBtn.addEventListener('click',function(e){
      e.stopPropagation();
      // Toggle: close others, open this or close if already open
      var alreadyOpen=dotsMenu.classList.contains('open');
      document.querySelectorAll('.dots-menu.open').forEach(function(m){m.classList.remove('open');});
      if(!alreadyOpen)dotsMenu.classList.add('open');
    });
    el.appendChild(dotsBtn);
    el.appendChild(dotsMenu);
  }
  obsFade(el);
}
function refreshSec(secId){var sec=D.sections.find(function(s){return s.id===secId;});var el=G('sec-'+secId);if(sec&&el){renderSection(el,sec);buildStats_update();obsFade(el);}}

// ══ DOTS MENU ══

  }

    item('+ Nova data clau',function(){openRecModal(sec,null,null);});
    item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});
  }

    item('+ Nova temàtica',function(){openRecModal(sec,null,null);});
  }
  if(sec.type==='document'){
    item('+ Afegir link',function(){addDocLink(sec,el);});
    item('+ Afegir text',function(){addDocText(sec,el);});
    item('+ Afegir imatge',function(){addDocImg(sec,el);});
  }
  if(sec.type==='gallery'){
    item('+ Afegir imatge',function(){openRecModal(sec,null,null);});
    item('⚙ Gestionar camps',function(){openFieldsMgr(sec);});

    item('+ Nou post',function(){var pls=D.sections.find(function(s){return s.type==='pipeline';});if(pls)openRecModal(pls,null,'Idea');});

  }
  if(sec.type==='sponsors'){
    item('+ Nou patrocinador',function(){openRecModal(sec,null,null);});

  }
  if(sec.type==='trash'){
    item('🗑 Buidar paperera',function(){D.trash=[];saveMain();refreshSec(sec.id);toast('Paperera buidada');});
  }
  if(!sec.fixed){
    sep();
    item('✏️ Renombrar secció',function(){
      genModal('Renombrar',
        '<div class="field"><div class="flbl">Nom</div><input type="text" id="gm-n" class="finp" value="'+eq(sec.name)+'"></div>'+
        '<div class="field"><div class="flbl">Descripció</div><input type="text" id="gm-d" class="finp" value="'+eq(sec.desc||'')+'"></div>',
        async function(){saveUndo();sec.name=gv('gm-n')||sec.name;sec.desc=gv('gm-d');cm('gen-modal');await saveMain();buildTopNav();refreshSec(sec.id);toast('✓ Guardat');}
      );

    item('× Eliminar secció',async function(){if(!confirm('Eliminar "'+sec.name+'"?'))return;saveUndo();D.sections=D.sections.filter(function(s){return s.id!==sec.id;});await saveMain();buildPage();toast('Secció eliminada');},true);

function openFieldsMgr(sec){
  genModal('Camps de "'+esc(sec.name)+'"','<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Camps del formulari</div>',function(){cm('gen-modal');});
  setTimeout(function(){
    var body=G('gen-body');if(!body)return;body.innerHTML='';
    (sec.fields||[]).forEach(function(f,i){
      var row=mk('div','fb-row');row.innerHTML='<span style="font-size:12px;color:var(--text);flex:1">'+esc(f.name)+'</span><span class="fb-badge">'+esc(f.type)+'</span>';
      if(!f.sys){
        var eb=mk('button','btn btn-xs');eb.textContent='✏️';
        var db=mk('button','btn btn-xs btn-d');db.textContent='×';
        eb.addEventListener('click',function(){openFieldEdit(f,sec,function(){openFieldsMgr(sec);});});
        db.addEventListener('click',async function(){saveUndo();sec.fields.splice(i,1);await saveMain();openFieldsMgr(sec);toast('Eliminat');});
        row.appendChild(eb);row.appendChild(db);
      }else row.innerHTML+='<span style="font-size:9px;color:var(--muted)">sistema</span>';
      body.appendChild(row);
    });
    var ab=mk('button','btn btn-sm');ab.textContent='+ Nou camp';ab.style.marginTop='10px';
    ab.addEventListener('click',function(){openFieldNew(sec,function(){openFieldsMgr(sec);});});body.appendChild(ab);
    var foot=G('gen-foot');if(foot)foot.innerHTML='<button class="btn btn-sm" onclick="document.getElementById(\'gen-modal\').classList.remove(\'open\')">Tancar</button>';
  },30);
}

// ══ STATS / KPIs ══
function renderStats(el,sec){
  el.innerHTML='<div class="sec-inner"><div class="stats-row fade-in" id="stats-row"></div></div>';
  buildStats_update();
  // KPI history button (admin)
  if(isAdmin()){
    var extra=mk('div','sec-inner');extra.style.cssText='padding-top:10px;display:flex;gap:8px;align-items:center';
    var kpiBtn=mk('button','btn btn-sm');kpiBtn.textContent='📊 Registrar KPIs mensuals';
    kpiBtn.addEventListener('click',openKpiModal);
    extra.appendChild(kpiBtn);
    var kpiList=D.kpiHistory&&D.kpiHistory.length?'<span style="font-size:10px;color:var(--muted);letter-spacing:.04em">'+D.kpiHistory.length+' registres guardats</span>':'';
    if(kpiList){var span=mk('div','');span.innerHTML=kpiList;extra.appendChild(span);}
    el.querySelector('.sec-inner').after(extra);
  }
}
function buildStats_update(){
  var row=G('stats-row');if(!row)return;autoPublish();
  var pl=D.sections.find(function(s){return s.type==='pipeline';});
  var pc=pl?(pl.records||[]).filter(function(r){return r._status&&r._status!=='Publicat';}).length:0;
  var rc=pl?(pl.records||[]).filter(function(r){return r._status==='Llest';}).length:0;
  var ts=D.sections.find(function(s){return s.type==='tasks';});
  var tc=ts?(ts.records||[]).filter(function(r){return !r._done;}).length:0;
  var cd=new Date(D.cfg.countdownDate);cd.setHours(0,0,0,0);var cdays=Math.ceil((cd-today)/864e5);
  var dl=D.sections.find(function(s){return s.type==='deadlines';});
  var urg=dl?(dl.records||[]).filter(function(r){var x=daysUntil(r.date);return x>=0&&x<=30;}).length:0;
  var sp=D.sections.find(function(s){return s.type==='sponsors';});
  var sconf=sp?(sp.records||[]).filter(function(r){return r.status==='Confirmat';}).length:0;
  // Latest KPI
  var lastKpi=D.kpiHistory&&D.kpiHistory.length?D.kpiHistory[D.kpiHistory.length-1]:null;
  var seguidors=lastKpi?lastKpi.seguidors:'—';
  var reach=lastKpi?lastKpi.alcance:'—';
  var cards=[
    {l:'Pipeline',v:pc},{l:'Llestos',v:rc},{l:'Tasques pend.',v:tc},
    {l:esc(D.cfg.countdownLabel),v:cdays>0?cdays+'d':'🎉'},
    {l:'Urgent 30d',v:urg,s:'color:var(--amber)'},
    {l:'Patrocinadors conf.',v:sconf,s:'color:var(--gold)'},
    {l:'Seguidors IG',v:seguidors},{l:'Alcance 30d',v:reach},
  ];
  row.innerHTML=cards.map(function(s){return '<div class="stat-card"><div class="stat-lbl">'+s.l+'</div><div class="stat-val" style="'+(s.s||'')+'">'+s.v+'</div></div>';}).join('');
}
function autoPublish(){var pl=D.sections.find(function(s){return s.type==='pipeline';});if(!pl)return;(pl.records||[]).forEach(function(r){if(r._status!=='Publicat'&&r.date&&r.date<todayStr)r._status='Publicat';});}

function openKpiModal(){
  var last=D.kpiHistory&&D.kpiHistory.length?D.kpiHistory[D.kpiHistory.length-1]:{};
  genModal('Registrar KPIs mensuals',
    '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">Afegeix les dades actuals del compte d\'Instagram per fer seguiment del creixement.</div>'+
    '<div class="frow">'+
    '<div class="field"><div class="flbl">Seguidors totals</div><input type="number" id="kpi-seg" class="finp" value="'+(last.seguidors||'')+'"></div>'+
    '<div class="field"><div class="flbl">Reproduccions 30d</div><input type="number" id="kpi-rep" class="finp" value="'+(last.reproduccions||'')+'"></div>'+
    '</div><div class="frow">'+
    '<div class="field"><div class="flbl">Interaccions 30d</div><input type="number" id="kpi-int" class="finp" value="'+(last.interaccions||'')+'"></div>'+
    '<div class="field"><div class="flbl">Alcance (comptes)</div><input type="number" id="kpi-alc" class="finp" value="'+(last.alcance||'')+'"></div>'+
    '</div>'+
    '<div class="field"><div class="flbl">Nous seguidors (net)</div><input type="number" id="kpi-nous" class="finp" value="'+(last.nous||'')+'"></div>'+
    '<div class="field"><div class="flbl">Nota / observació</div><textarea id="kpi-nota" class="finp finp-ta" style="min-height:52px">'+(last.nota||'')+'</textarea></div>',
    async function(){
      saveUndo();
      if(!D.kpiHistory)D.kpiHistory=[];
      D.kpiHistory.push({
        date:todayStr,seguidors:+gv('kpi-seg')||0,reproduccions:+gv('kpi-rep')||0,
        interaccions:+gv('kpi-int')||0,alcance:+gv('kpi-alc')||0,nous:+gv('kpi-nous')||0,nota:gv('kpi-nota')
      });
      cm('gen-modal');await saveMain();buildStats_update();toast('✓ KPIs registrats');
    }
  );
}

// ══ SECTION HEADER ══
function mkHdr(sec,actionsHTML){
  var inner=mk('div','sec-inner');
  var hdr=mk('div','sec-header fade-in');
  var tw=mk('div','');
  tw.innerHTML='<div class="sec-title">'+esc(sec.name)+'</div>'+(sec.desc?'<div class="sec-desc">'+esc(sec.desc)+'</div>':'');
  hdr.appendChild(tw);
  if(actionsHTML){var acts=mk('div','sec-actions');acts.innerHTML=actionsHTML;hdr.appendChild(acts);}
  inner.appendChild(hdr);return inner;
}

// ══ PIPELINE ══
function renderPipeline(el,sec){
  autoPublish();
  var nf=sec.fields.find(function(f){return f.id==='net';});
  var netOpts='<option value="all">Totes les xarxes</option>';
  if(nf&&nf.options)nf.options.forEach(function(o){netOpts+='<option value="'+eq(o)+'">'+esc(o)+'</option>';});
  var inner=mkHdr(sec,
    '<select id="fnet-'+sec.id+'" style="background:rgba(0,16,20,.85);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:10px;padding:5px 9px;outline:none">'+netOpts+'</select>'+
    '<button class="btn btn-p btn-sm" id="newpost-'+sec.id+'">+ Post</button>'
  );
  el.appendChild(inner);
  var bw=mk('div','sec-inner fade-in');bw.style.paddingTop='0';
  var board=mk('div','board-scroll');
  var SCOL={Idea:'#7b5cf0',Esborrany:'#506060',Llest:'var(--amber)'};
  var NCOLS=['#ff7aaa','#00e5c4','#5a9cf0','#52c97a','#f0b844','#a78bfa'];
  var PCLS={Espectacle:'p-espectacle',Comunitat:'p-comunitat','Història & Legat':'p-historia',Competició:'p-competicio',Participació:'p-participacio'};
  (sec.stages||['Idea','Esborrany','Llest']).forEach(function(stage){
    var recs=(sec.records||[]).filter(function(r){return r._status===stage;});
    var fv=G('fnet-'+sec.id)?G('fnet-'+sec.id).value:'all';
    if(fv!=='all')recs=recs.filter(function(r){return r.net===fv;});
    var sc=SCOL[stage]||'var(--border2)';
    var col=mk('div','stage-col');
    col.innerHTML='<div class="stage-hd" style="--sc:'+sc+'"><span>'+esc(stage.toUpperCase())+'</span><span class="stage-n" style="background:'+sc+'">'+recs.length+'</span></div>';
    var cards=mk('div','post-cards');
    recs.forEach(function(r){
      var ni=nf?nf.options.indexOf(r.net||''):-1;var nc=ni>=0?NCOLS[ni%NCOLS.length]:'var(--muted)';
      var mgrs=(r.managers||[]).map(function(pid){var p=D.people.find(function(x){return x.id===pid;});return p?'<span class="chip" style="background:'+p.color+'22;color:'+p.color+'">'+esc(p.name)+'</span>':'';}).join('');
      var pillarBadge=r.pillar&&PCLS[r.pillar]?'<span class="pillar-badge '+PCLS[r.pillar]+'">'+esc(r.pillar)+'</span>':'';
      var c=mk('div','post-card');
      c.innerHTML='<div class="pc-title">'+esc(r.title||'Sense títol')+'</div><div class="chips">'+
        (r.net?'<span class="chip" style="background:'+nc+'22;color:'+nc+'">'+esc(r.net)+'</span>':'')+
        (r.fmt?'<span class="chip chip-m">'+esc(r.fmt)+'</span>':'')+
        pillarBadge+mgrs+'</div>';
      c.addEventListener('click',function(){openRecModal(sec,r,null);});cards.appendChild(c);
    });
    col.appendChild(cards);
    var ab=mk('button','add-stage');ab.textContent='+ '+stage;ab.addEventListener('click',function(){openRecModal(sec,null,stage);});col.appendChild(ab);
    board.appendChild(col);
  });
  bw.appendChild(board);el.appendChild(bw);
  var fnetEl=G('fnet-'+sec.id);if(fnetEl)fnetEl.addEventListener('change',function(){renderPipeline(el,sec);});
  var npBtn=G('newpost-'+sec.id);if(npBtn)npBtn.addEventListener('click',function(){openRecModal(sec,null,null);});
}

// ══ CALENDAR ══
function renderCal(el,sec){
  autoPublish();
  var inner=mkHdr(sec,'<button class="btn btn-p btn-sm" id="cal-np">+ Post</button><button class="btn btn-sm" id="cal-nd">+ Data clau</button>');
  el.appendChild(inner);
  var cw=mk('div','sec-inner fade-in');cw.style.paddingTop='0';
  var calWrap=mk('div','cal-wrap');
  var ch=mk('div','cal-hd');
  var pv=mk('button','cal-nav');pv.textContent='←';
  var lbl=mk('div','cal-lbl');lbl.textContent=CAL_M[calM]+' '+calY;
  var nx=mk('button','cal-nav');nx.textContent='→';
  ch.appendChild(pv);ch.appendChild(lbl);ch.appendChild(nx);
  pv.addEventListener('click',function(){calM--;if(calM<0){calM=11;calY--;}renderCal(el,sec);});
  nx.addEventListener('click',function(){calM++;if(calM>11){calM=0;calY++;}renderCal(el,sec);});
  calWrap.appendChild(ch);
  var gw=mk('div','cal-gw');var grid=mk('div','cal-grid');
  CAL_D.forEach(function(d){var h=mk('div','cal-dn');h.textContent=d;grid.appendChild(h);});
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  var start=first.getDay();if(start===0)start=7;start--;
  var pl=D.sections.find(function(s){return s.type==='pipeline';});
  var dl=D.sections.find(function(s){return s.type==='deadlines';});
  function mkCell(date,other){
    var ds=date.toISOString().split('T')[0];var isT=ds===todayStr;
    var cell=mk('div','cal-cell'+(other?' other':'')+(isT?' today':''));
    var num=mk('div','cal-num');num.textContent=date.getDate();cell.appendChild(num);
    if(dl)(dl.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
      var cat=D.categories.find(function(c){return c.name===r.cat;});var col=cat?cat.color:'#00c8d4';
      var ev=mk('div','cal-ev');ev.style.cssText='background:'+col+'22;color:'+col;ev.textContent=r.title||'';
      ev.addEventListener('click',function(e){e.stopPropagation();if(dl)openRecModal(dl,r,null);});cell.appendChild(ev);
    });
    if(pl)(pl.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
      var col=r._status==='Publicat'?'#52c97a':'#a78bfa';
      var ev=mk('div','cal-ev');ev.style.cssText='background:'+col+'22;color:'+col;ev.textContent=(r._status==='Publicat'?'✓ ':'')+r.title;
      ev.addEventListener('click',function(e){e.stopPropagation();if(pl)openRecModal(pl,r,null);});cell.appendChild(ev);
    });
    cell.addEventListener('click',function(){if(pl){openRecModal(pl,null,'Idea');setTimeout(function(){var di=G('rf-date');if(di)di.value=ds;},60);}});
    return cell;
  }
  for(var i=0;i<start;i++)grid.appendChild(mkCell(new Date(calY,calM,1-start+i),true));
  for(var dd=1;dd<=last.getDate();dd++)grid.appendChild(mkCell(new Date(calY,calM,dd),false));
  var rem=42-(start+last.getDate());
  for(var d2=1;d2<=rem;d2++)grid.appendChild(mkCell(new Date(calY,calM+1,d2),true));
  gw.appendChild(grid);calWrap.appendChild(gw);
  var leg=mk('div','cal-leg');
  D.categories.forEach(function(c){var it=mk('div','leg-it');it.innerHTML='<div class="leg-sw" style="background:'+c.color+'"></div>'+esc(c.name);leg.appendChild(it);});
  (D.legendExtra||[]).forEach(function(li){var it=mk('div','leg-it');it.innerHTML='<div class="leg-sw" style="background:'+li.color+'"></div>'+esc(li.label);leg.appendChild(it);});
  calWrap.appendChild(leg);cw.appendChild(calWrap);el.appendChild(cw);
  var cnp=G('cal-np');var cnd=G('cal-nd');
  var pls=D.sections.find(function(s){return s.type==='pipeline';});
  var dls=D.sections.find(function(s){return s.type==='deadlines';});
  if(cnp)cnp.addEventListener('click',function(){if(pls)openRecModal(pls,null,'Idea');});
  if(cnd)cnd.addEventListener('click',function(){if(dls)openRecModal(dls,null,null);});
}
function editLegend(){
  var html='<div style="font-size:11px;color:var(--muted);margin-bottom:12px">Edita o elimina les etiquetes de la llegenda.</div>';
  (D.legendExtra||[]).forEach(function(li,i){html+='<div style="display:flex;gap:8px;margin-bottom:7px;align-items:center"><input type="text" id="ll-'+i+'" class="finp" value="'+eq(li.label)+'" style="flex:1"><input type="color" id="lc-'+i+'" class="finp finp-color" value="'+li.color+'" style="width:38px"><button class="btn btn-xs btn-d" data-rm-leg="'+i+'">×</button></div>';});
  html+='<button class="btn btn-sm" id="leg-add-btn" style="margin-top:4px">+ Afegir element</button>';
  genModal('Editar llegenda',html,async function(){saveUndo();(D.legendExtra||[]).forEach(function(li,i){li.label=gv('ll-'+i)||li.label;li.color=gv('lc-'+i)||li.color;});cm('gen-modal');await saveMain();var cs=D.sections.find(function(s){return s.type==='calendar';});if(cs)refreshSec(cs.id);toast('✓ Actualitzada');});
  setTimeout(function(){
    document.querySelectorAll('[data-rm-leg]').forEach(function(btn){btn.addEventListener('click',async function(){saveUndo();D.legendExtra.splice(+btn.dataset.rmLeg,1);await saveMain();var cs=D.sections.find(function(s){return s.type==='calendar';});if(cs)refreshSec(cs.id);editLegend();toast('Eliminat');});});
    var addBtn=G('leg-add-btn');if(addBtn)addBtn.addEventListener('click',async function(){saveUndo();D.legendExtra.push({id:uid(),label:'Nou element',color:'#888'});await saveMain();editLegend();});
  },40);
}

// ══ DEADLINES ══
function renderDeadlines(el,sec){
  var inner=mkHdr(sec,'<button class="btn btn-p btn-sm" id="newdl-'+sec.id+'">+ Nova data</button>');el.appendChild(inner);
  G('newdl-'+sec.id).addEventListener('click',function(){openRecModal(sec,null,null);});
  var sorted=(sec.records||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var groups=[
    {t:'Màxima prioritat',items:sorted.filter(function(r){var x=daysUntil(r.date);return x>=0&&x<=60&&r.priority==='MÀXIMA';})},
    {t:'Pròximes (60 dies)',items:sorted.filter(function(r){var x=daysUntil(r.date);return x>=0&&x<=60&&r.priority!=='MÀXIMA';})},
    {t:'Futures',items:sorted.filter(function(r){return daysUntil(r.date)>60;})},
    {t:'Passades',items:sorted.filter(function(r){return daysUntil(r.date)<0;})},
  ];
  var body=mk('div','sec-inner fade-in');body.style.paddingTop='0';
  groups.forEach(function(g){
    if(!g.items.length)return;
    var s=mk('div','');s.style.marginBottom='18px';
    var isMax=g.t==='Màxima prioritat';
    s.innerHTML='<div style="font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:'+(isMax?'var(--red)':'var(--muted)')+';margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--border)">'+esc(g.t)+'</div>';
    g.items.forEach(function(r){
      var days=daysUntil(r.date);var cat=D.categories.find(function(c){return c.name===r.cat;});var color=cat?cat.color:'#00c8d4';
      var badge='',cc=color;
      if(days<0)badge='<span class="dl-badge br">Passada</span>';
      else if(days===0){badge='<span class="dl-badge br">AVUI</span>';cc='var(--red)';}
      else if(days<=7){badge='<span class="dl-badge br">'+days+'d</span>';cc='var(--red)';}
      else if(days<=30){badge='<span class="dl-badge ba">'+days+'d</span>';cc='var(--amber)';}
      else badge='<span class="dl-badge bc">'+days+'d</span>';
      if(r.priority==='MÀXIMA')badge='<span class="dl-badge br">⚡ MÀXIMA</span> '+badge;
      var df=new Date(r.date).toLocaleDateString('ca-ES',{day:'numeric',month:'long',year:'numeric'});
      var item=mk('div','list-it');
      item.innerHTML='<div style="width:5px;height:5px;border-radius:50%;background:'+color+';flex-shrink:0;margin-top:6px"></div>'+
        '<div class="li-info"><div class="li-title">'+esc(r.title||'')+'  '+badge+'</div>'+
        '<div class="li-sub">'+df+(r.cat?' · '+esc(r.cat):'')+(r.notes?' · '+esc((r.notes||'').substring(0,60)):'')+'</div></div>'+
        '<div class="dl-days" style="color:'+cc+'">'+(days<0?'✓':days===0?'Avui':days+'d')+'</div>';
      item.addEventListener('click',function(){openRecModal(sec,r,null);});s.appendChild(item);
    });
    body.appendChild(s);
  });
  el.appendChild(body);
}

// ══ TASKS ══
function renderTasks(el,sec){
  var inner=mkHdr(sec,'<button class="btn btn-p btn-sm" id="newtask-'+sec.id+'">+ Nova tasca</button>');el.appendChild(inner);
  G('newtask-'+sec.id).addEventListener('click',function(){openRecModal(sec,null,null);});
  var body=mk('div','sec-inner fade-in');body.style.paddingTop='0';
  var fr=mk('div','');fr.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center';
  var allC=mk('span','chip');allC.style.cssText='background:var(--cyan3);color:var(--cyan);cursor:pointer;padding:3px 10px;font-size:9px';allC.textContent='Totes';allC.dataset.fv='all';fr.appendChild(allC);
  D.categories.forEach(function(c){var ch=mk('span','chip');ch.style.cssText='background:'+c.color+'22;color:'+c.color+';cursor:pointer;padding:3px 10px;font-size:9px';ch.textContent=c.name;ch.dataset.fv=c.name;fr.appendChild(ch);});
  (sec.views||[]).forEach(function(v){var ch=mk('span','chip');ch.style.cssText='background:var(--bg3);color:var(--text);cursor:pointer;padding:3px 10px;border:1px solid var(--border2);font-size:9px';ch.textContent=v.name;ch.dataset.fv='view:'+v.id;fr.appendChild(ch);});
  body.appendChild(fr);
  var listEl=mk('div','');listEl.id='tlist-'+sec.id;body.appendChild(listEl);
  el.appendChild(body);
  drawTasks(sec,'all',listEl,el);
  fr.querySelectorAll('[data-fv]').forEach(function(ch){ch.addEventListener('click',function(){drawTasks(sec,ch.dataset.fv,listEl,el);});});
}
function drawTasks(sec,filter,listEl,el){
  listEl.innerHTML='';
  var recs=sec.records||[];
  if(filter!=='all'){if(filter.startsWith('view:')){var vid=filter.replace('view:','');var v=(sec.views||[]).find(function(x){return x.id==vid;});if(v&&v.filter)recs=recs.filter(function(r){return r.cat===v.filter;});}else recs=recs.filter(function(r){return r.cat===filter;});}
  var pending=recs.filter(function(r){return !r._done;});var done=recs.filter(function(r){return r._done;});
  function renderGroup(items,title){
    if(!items.length)return;var s=mk('div','');s.style.marginBottom='14px';
    if(title)s.innerHTML='<div style="font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">'+esc(title)+'</div>';
    items.forEach(function(r){
      var item=mk('div','list-it'+(r._done?' done':''));
      var chk=mk('div','list-chk');chk.textContent=r._done?'✓':'';
      chk.addEventListener('click',async function(e){e.stopPropagation();saveUndo();r._done=!r._done;await saveMain();drawTasks(sec,filter,listEl,el);buildStats_update();toast(r._done?'✓ Completada':'Reoberta');});
      var catObj=D.categories.find(function(c){return c.name===r.cat;});var catColor=catObj?catObj.color:'var(--muted)';
      var info=mk('div','li-info');
      info.innerHTML='<div class="li-title">'+esc(r.title||'')+'</div><div class="li-sub">'+(r.cat?'<span style="color:'+catColor+'">'+esc(r.cat)+'</span>':'')+(r.status&&!r._done?' · '+esc(r.status):'')+(r.notes?' · '+esc((r.notes||'').substring(0,60)):'')+'</div>';
      item.appendChild(chk);item.appendChild(info);
      item.addEventListener('click',function(){openRecModal(sec,r,null);});s.appendChild(item);
    });
    listEl.appendChild(s);
  }
  renderGroup(pending,'Pendents');if(done.length)renderGroup(done,'Completades');
  if(!recs.length)listEl.innerHTML='<div style="color:var(--muted);font-size:12px">Cap tasca.</div>';
}

// ══ SPONSORS ══
function renderSponsors(el,sec){
  var inner=mkHdr(sec,'<button class="btn btn-p btn-sm" id="new-sp-'+sec.id+'">+ Nou patrocinador</button>');el.appendChild(inner);
  G('new-sp-'+sec.id).addEventListener('click',function(){openRecModal(sec,null,null);});
  var body=mk('div','sec-inner fade-in');body.style.paddingTop='0';
  // Summary row
  var recs=sec.records||[];
  var total=recs.filter(function(r){return r.status==='Confirmat';}).reduce(function(a,r){return a+(+r.amount||0);},0);
  var confirmed=recs.filter(function(r){return r.status==='Confirmat';}).length;
  var interested=recs.filter(function(r){return r.status==='Interessat';}).length;
  if(recs.length){
    var sumRow=mk('div','');sumRow.style.cssText='display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap';
    [{l:'Total confirmats',v:confirmed,c:'var(--green)'},{l:'Interessats',v:interested,c:'var(--cyan)'},{l:'Pressupost confirmat',v:total+'€',c:'var(--gold)'}].forEach(function(s){
      var card=mk('div','');card.style.cssText='background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;min-width:130px';
      card.innerHTML='<div style="font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">'+s.l+'</div><div style="font-family:var(--font-title);font-size:22px;color:'+s.c+'">'+s.v+'</div>';
      sumRow.appendChild(card);
    });
    body.appendChild(sumRow);
  }
  var grid=mk('div','sponsor-grid');
  recs.forEach(function(r){
    var stateObj=SPONSOR_STATES.find(function(x){return x.id===r.status.toLowerCase();});
    var stCls=stateObj?stateObj.cls:'ss-contactat';
    var card=mk('div','sponsor-card');
    card.innerHTML='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">'+
      '<div><div class="sponsor-name">'+esc(r.name||'')+'</div>'+
      (r.level?'<div class="sponsor-role">'+esc(r.level)+'</div>':'')+
      '</div>'+
      '<span class="sponsor-status '+stCls+'">'+esc(r.status||'')+'</span></div>'+
      (r.amount?'<div class="sponsor-amount">'+r.amount+'€</div>':'')+
      (r.notes?'<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;letter-spacing:.03em">'+esc((r.notes||'').substring(0,100))+'</div>':'');
    card.addEventListener('click',function(){openRecModal(sec,r,null);});grid.appendChild(card);
  });
  if(!recs.length)grid.innerHTML='<div style="color:var(--muted);font-size:12px">Cap patrocinador encara. Afegeix el primer!</div>';
  body.appendChild(grid);el.appendChild(body);
}

// ══ DOCUMENT ══
function renderDoc(el,sec){
  var inner=mkHdr(sec,'');el.appendChild(inner);
  var body=mk('div','sec-inner fade-in');body.style.paddingTop='0';
  (sec.blocks||[]).forEach(function(block){renderDocBlock(body,block,sec,el);});
  el.appendChild(body);
}
function renderDocBlock(container,block,sec,el){
  var typeColors={drive:'#52c97a',instagram:'#ff7aaa',dossier:'#d4a044',other:'#a78bfa'};
  if(block.type==='links'){
    var lh=mk('div','ed-sub-h');lh.textContent='Dossieres & Recursos';container.appendChild(lh);
    (block.content||[]).forEach(function(l){
      var col=typeColors[l.ltype]||'#888';
      var card=mk('a','ed-block-link');card.href=l.url||'#';card.target='_blank';card.style.setProperty('--lc',col);
      card.innerHTML='<div class="ed-link-icon" style="background:'+col+'22">'+esc(l.icon||'📁')+'</div>'+
        '<div style="flex:1;min-width:0"><div class="ed-link-name">'+esc(l.name)+'</div><div class="ed-link-url">'+esc(l.url||'')+'</div></div>';
      if(isAdmin()){var eb=mk('button','btn btn-xs edit-only');eb.textContent='✏️';eb.addEventListener('click',function(e){e.preventDefault();editDocLink(sec,block,l,el);});card.appendChild(eb);}
      container.appendChild(card);
    });
  }else if(block.type==='text'){
    if(block.label){var lbl=mk('div','ed-sub-h');lbl.textContent=block.label;container.appendChild(lbl);}
    var tb=mk('div','ed-text-block');tb.textContent=block.content||'';
    if(isAdmin()){var etb=mk('button','btn btn-xs edit-only');etb.style.cssText='float:right;margin:0 0 5px 7px';etb.textContent='✏️';etb.addEventListener('click',function(){editDocText(sec,block,el);});tb.prepend(etb);}
    container.appendChild(tb);
  }else if(block.type==='image'){
    var ib=mk('div','');
    if(block.content){var im=mk('img','');im.src=block.content;im.style.cssText='max-width:100%;border-radius:var(--r);border:1px solid var(--border)';ib.appendChild(im);}
    if(block.caption){var cap=mk('div','');cap.style.cssText='font-size:10px;color:var(--muted);margin-top:5px';cap.textContent=block.caption;ib.appendChild(cap);}
    if(isAdmin()){var eib=mk('button','btn btn-xs edit-only');eib.style.marginTop='6px';eib.textContent='✏️ Editar';eib.addEventListener('click',function(){editDocImg(sec,block,el);});ib.appendChild(eib);}
    container.appendChild(ib);
  }
}
function addDocLink(sec,el){genModal('Nou link','<div class="field"><div class="flbl">Nom</div><input type="text" id="gm-n" class="finp"></div><div class="field"><div class="flbl">URL</div><input type="text" id="gm-u" class="finp" placeholder="https://..."></div><div class="frow"><div class="field"><div class="flbl">Icona</div><input type="text" id="gm-ic" class="finp" value="📁"></div><div class="field"><div class="flbl">Tipus</div><select id="gm-lt" class="finp"><option value="drive">Drive</option><option value="instagram">Instagram</option><option value="dossier">Dossier</option><option value="other">Altre</option></select></div></div>',async function(){var n=gv('gm-n').trim();if(!n)return;saveUndo();if(!sec.blocks)sec.blocks=[];var lb=sec.blocks.find(function(b){return b.type==='links';});if(!lb){lb={id:uid(),type:'links',content:[]};sec.blocks.unshift(lb);}lb.content.push({id:uid(),name:n,url:gv('gm-u'),icon:gv('gm-ic')||'📁',ltype:gv('gm-lt')});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Afegit');});}
function editDocLink(sec,block,link,el){genModal('Editar link','<div class="field"><div class="flbl">Nom</div><input type="text" id="gm-n" class="finp" value="'+eq(link.name)+'"></div><div class="field"><div class="flbl">URL</div><input type="text" id="gm-u" class="finp" value="'+eq(link.url||'')+'"></div><div class="frow"><div class="field"><div class="flbl">Icona</div><input type="text" id="gm-ic" class="finp" value="'+eq(link.icon||'📁')+'"></div><div class="field"><div class="flbl">Tipus</div><select id="gm-lt" class="finp"><option value="drive">Drive</option><option value="instagram">Instagram</option><option value="dossier">Dossier</option><option value="other">Altre</option></select></div></div>',async function(){saveUndo();link.name=gv('gm-n');link.url=gv('gm-u');link.icon=gv('gm-ic')||'📁';link.ltype=gv('gm-lt');cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Guardat');},async function(){saveUndo();block.content=block.content.filter(function(l){return l.id!==link.id;});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('Eliminat');});setTimeout(function(){sv('gm-lt',link.ltype||'drive');},50);}
function addDocText(sec,el){genModal('Nou text','<div class="field"><div class="flbl">Etiqueta (opcional)</div><input type="text" id="gm-lbl" class="finp" placeholder="Ex: Tipografia, Música..."></div><div class="field"><div class="flbl">Contingut</div><textarea id="gm-txt" class="finp finp-ta" style="min-height:100px"></textarea></div>',async function(){var txt=gv('gm-txt').trim();if(!txt)return;saveUndo();if(!sec.blocks)sec.blocks=[];sec.blocks.push({id:uid(),type:'text',label:gv('gm-lbl'),content:txt});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Afegit');});}
function editDocText(sec,block,el){genModal('Editar text','<div class="field"><div class="flbl">Etiqueta</div><input type="text" id="gm-lbl" class="finp" value="'+eq(block.label||'')+'"></div><div class="field"><div class="flbl">Contingut</div><textarea id="gm-txt" class="finp finp-ta" style="min-height:100px">'+esc(block.content||'')+'</textarea></div>',async function(){saveUndo();block.label=gv('gm-lbl');block.content=gv('gm-txt');cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Guardat');},async function(){saveUndo();sec.blocks=sec.blocks.filter(function(b){return b.id!==block.id;});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('Eliminat');});}
function addDocImg(sec,el){genModal('Afegir imatge','<div class="field"><div class="flbl">Peu de foto</div><input type="text" id="gm-cap" class="finp"></div><div class="img-area" id="gm-ia">📎 Clica per seleccionar imatge<input type="file" id="gm-if" accept="image/*" style="display:none"></div>',async function(){var b64=G('gm-ia').dataset.b64||'';if(!b64){toast('⚠️ Selecciona una imatge');return;}saveUndo();if(!sec.blocks)sec.blocks=[];sec.blocks.push({id:uid(),type:'image',content:b64,caption:gv('gm-cap')});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Afegit');});setTimeout(function(){var a=G('gm-ia'),inp=G('gm-if');if(!a||!inp)return;a.addEventListener('click',function(){inp.click();});inp.addEventListener('change',function(){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){a.dataset.b64=ev.target.result;a.innerHTML='<img src="'+ev.target.result+'" style="max-width:100%;max-height:140px;border-radius:var(--r)">';};r.readAsDataURL(f);});},80);}
function editDocImg(sec,block,el){genModal('Editar imatge','<div class="field"><div class="flbl">Peu de foto</div><input type="text" id="gm-cap" class="finp" value="'+eq(block.caption||'')+'"></div>',async function(){saveUndo();block.caption=gv('gm-cap');cm('gen-modal');await saveMain();refreshSec(sec.id);toast('✓ Guardat');},async function(){saveUndo();sec.blocks=sec.blocks.filter(function(b){return b.id!==block.id;});cm('gen-modal');await saveMain();refreshSec(sec.id);toast('Eliminat');});}

// ══ THEMES ══
function renderThemes(el,sec){
  var inner=mkHdr(sec,'');el.appendChild(inner);
  var body=mk('div','sec-inner');body.style.cssText='padding-top:0;position:relative';
  var line=mk('div','themes-line');body.appendChild(line);
  var sorted=(sec.records||[]).slice().sort(function(a,b){return +(a.year||0)-(+(b.year||0));});
  sorted.forEach(function(r){
    var row=mk('div','theme-row fade-in');
    var node=mk('div','theme-node');
    var linkEl=r.link?mk('a','theme-link'):mk('div','theme-link');
    if(r.link){linkEl.href=r.link;linkEl.target='_blank';linkEl.rel='noopener';}else{linkEl.style.cursor='default';}
    var card=mk('div','theme-card');
    var glow=mk('div','theme-glow');card.appendChild(glow);
    if(r.image){var img=mk('img','theme-img');img.src=r.image;img.alt=r.name||'';card.appendChild(img);}
    var yw=mk('div','theme-yr-bg');yw.textContent=r.year||'';card.appendChild(yw);
    var ov=mk('div','theme-overlay');card.appendChild(ov);
    var info=mk('div','theme-info');
    var firstItem=r.items?r.items.split('\n').filter(Boolean)[0]:'';
    info.innerHTML='<div class="t-year">'+esc(r.year||'')+'</div><div class="t-name">'+esc(r.name||'')+'</div><div class="t-desc">'+esc(r.desc||firstItem||'')+'</div>';
    card.appendChild(info);linkEl.appendChild(card);
    if(isAdmin()){
      var eb=mk('button','btn btn-xs edit-only');eb.style.cssText='margin-top:8px;display:none';eb.textContent='✏️ Editar';
      eb.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openRecModal(sec,r,null);});
      node.appendChild(eb);
    }
    var dot=mk('div','theme-dot');
    node.insertBefore(linkEl,node.firstChild);node.appendChild(dot);
    row.appendChild(node);body.appendChild(row);
  });
  if(!sorted.length){var emp=mk('div','');emp.style.cssText='color:var(--muted);font-size:12px;padding:20px 0';emp.textContent='Cap temàtica.';body.appendChild(emp);}
  el.appendChild(body);
}

// ══ TRASH ══
function sendToTrash(type,item){var cutoff=new Date(Date.now()-864e5).toISOString();D.trash=(D.trash||[]).filter(function(x){return x.deletedAt>cutoff;});D.trash.push({id:uid(),type:type,item:JSON.parse(JSON.stringify(item)),deletedAt:new Date().toISOString()});}
function renderTrash(el,sec){
  var inner=mkHdr(sec,'');el.appendChild(inner);
  var cutoff=new Date(Date.now()-864e5).toISOString();D.trash=(D.trash||[]).filter(function(x){return x.deletedAt>cutoff;});
  var body=mk('div','sec-inner fade-in');body.style.paddingTop='0';
  if(!D.trash.length){var emp=mk('div','');emp.style.cssText='color:var(--muted);font-size:12px';emp.textContent='La paperera és buida.';body.appendChild(emp);}
  else D.trash.slice().reverse().forEach(function(ti){
    var item=mk('div','trash-it');
    var typeLabel={pipeline:'Post',tasks:'Tasca',deadlines:'Data clau',sponsors:'Patrocinador'}[ti.type]||ti.type;
    item.innerHTML='<div style="flex:1;min-width:0"><div style="font-size:12px;color:var(--muted)">'+esc(ti.item.title||ti.item.name||'Element')+'</div><div style="font-size:10px;color:var(--muted);opacity:.45">'+typeLabel+' · '+new Date(ti.deletedAt).toLocaleString('ca-ES')+'</div></div>';
    var rb=mk('button','btn btn-xs');rb.textContent='↩ Restaurar';
    rb.addEventListener('click',async function(){saveUndo();var pg=D.sections.find(function(s){return s.type===ti.type;});if(pg){if(!pg.records)pg.records=[];pg.records.push(ti.item);}D.trash=D.trash.filter(function(x){return x.id!==ti.id;});await saveMain();refreshSec(sec.id);buildStats_update();toast('↩ Restaurat');});
    var db=mk('button','btn btn-xs btn-d');db.textContent='×';db.addEventListener('click',async function(){D.trash=D.trash.filter(function(x){return x.id!==ti.id;});await saveMain();refreshSec(sec.id);toast('Eliminat');});
    item.appendChild(rb);item.appendChild(db);body.appendChild(item);
  });
  el.appendChild(body);
}

// ══ RECORD MODAL ══
function openRecModal(sec,rec,defStatus){
  st('rec-title',rec?(sec.type==='pipeline'?'Editar post':(sec.type==='sponsors'?'Editar patrocinador':'Editar element')):(sec.type==='pipeline'?'Nou post':(sec.type==='sponsors'?'Nou patrocinador':'Nou element')));
  var body=G('rec-body');body.innerHTML='';var foot=G('rec-foot');foot.innerHTML='';
  (sec.fields||[]).forEach(function(field){
    var val=rec?rec[field.id]:'';
    var wrap=mk('div','field');wrap.innerHTML='<div class="flbl">'+esc(field.name)+'</div>';
    if(field.type==='text'||field.type==='number'||field.type==='url'){
      var inp=mk('input','finp');inp.type=field.type==='number'?'number':(field.type==='url'?'url':'text');inp.id='rf-'+field.id;if(val)inp.value=val;if(field.type==='url')inp.placeholder='https://...';wrap.appendChild(inp);
    }else if(field.type==='textarea'){
      var ta=mk('textarea','finp finp-ta');ta.id='rf-'+field.id;if(val)ta.value=val;wrap.appendChild(ta);
    }else if(field.type==='date'){
      var di=mk('input','finp');di.type='date';di.id='rf-'+field.id;di.value=val||todayStr;wrap.appendChild(di);
    }else if(field.type==='time'){
      var ti=mk('input','finp');ti.type='time';ti.id='rf-'+field.id;ti.value=val||'19:00';wrap.appendChild(ti);
    }else if(field.type==='checkbox'){
      var cb=mk('input','');cb.type='checkbox';cb.id='rf-'+field.id;cb.style.cssText='width:17px;height:17px;cursor:pointer;accent-color:var(--cyan)';if(val)cb.checked=true;
      var lbl2=mk('label','');lbl2.htmlFor='rf-'+field.id;lbl2.style.cssText='font-size:13px;cursor:pointer;margin-left:7px';lbl2.textContent=field.name;
      var cbr=mk('div','');cbr.style.cssText='display:flex;align-items:center';cbr.appendChild(cb);cbr.appendChild(lbl2);wrap.innerHTML='';wrap.appendChild(cbr);
    }else if(field.type==='select'){
      var sl=mk('select','finp');sl.id='rf-'+field.id;
      var opts=field.id==='cat'?D.categories.map(function(c){return c.name;}):(field.options||[]);
      opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;sl.appendChild(op);});
      if(val)sl.value=val;wrap.appendChild(sl);
    }else if(field.type==='multiselect'){
      var mw=mk('div','pchecks');mw.id='rf-'+field.id;
      var sel2=val?val.split(',').map(function(s){return s.trim();}).filter(Boolean):[];
      (field.options||[]).forEach(function(o){var sp=mk('span','pcheck'+(sel2.includes(o)?' on':''));sp.dataset.val=o;sp.innerHTML='<span class="pcheck-dot" style="background:var(--cyan)"></span>'+esc(o);sp.addEventListener('click',function(){sp.classList.toggle('on');});mw.appendChild(sp);});
      wrap.appendChild(mw);
    }else if(field.type==='people'){
      var pw=mk('div','pchecks');pw.id='rf-'+field.id;
      var selP=Array.isArray(val)?val:(val?[val]:[]);
      D.people.forEach(function(p){var sp=mk('span','pcheck'+(selP.includes(p.id)?' on':''));sp.dataset.id=p.id;sp.innerHTML='<span class="pcheck-dot" style="background:'+p.color+'"></span>'+esc(p.name);sp.addEventListener('click',function(){sp.classList.toggle('on');});pw.appendChild(sp);});
      wrap.appendChild(pw);
    }else if(field.type==='image'){
      var imgW=mk('div','');imgW.id='rf-'+field.id;
      if(val){var prev=mk('img','');prev.src=val;prev.style.cssText='max-width:100%;max-height:170px;border-radius:var(--r);margin-bottom:7px;display:block';imgW.appendChild(prev);}
      var ua=mk('div','img-area');ua.textContent='📎 Clica per seleccionar imatge';
      var fi=mk('input','');fi.type='file';fi.accept='image/*';fi.style.display='none';
      fi.addEventListener('change',function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){imgW.innerHTML='';var p2=mk('img','');p2.src=ev.target.result;p2.dataset.b64=ev.target.result;p2.style.cssText='max-width:100%;max-height:170px;border-radius:var(--r);margin-bottom:7px;display:block';imgW.appendChild(p2);var rm=mk('button','btn btn-xs btn-d');rm.style.marginBottom='7px';rm.textContent='× Treure';rm.addEventListener('click',function(){imgW.innerHTML='';imgW.dataset.cleared='1';});imgW.appendChild(rm);};r.readAsDataURL(f);});
      ua.appendChild(fi);ua.addEventListener('click',function(){fi.click();});imgW.appendChild(ua);wrap.appendChild(imgW);
    }else if(field.type==='checklist'){
      var clw=mk('div','');clw.id='rf-'+field.id;var clState=val||{};
      (field.options||[]).forEach(function(item){
        var row=mk('div','');row.style.cssText='display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px;border-radius:5px';
        var cb2=mk('div','');cb2.style.cssText='width:13px;height:13px;border-radius:3px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0';
        var txt=mk('span','');txt.style.cssText='font-size:12px';txt.textContent=item;
        if(clState[item]){cb2.style.background='var(--cyan)';cb2.style.borderColor='var(--cyan)';cb2.style.color='#000';cb2.textContent='✓';txt.style.color='var(--muted)';txt.style.textDecoration='line-through';}
        row.addEventListener('click',function(){var done=cb2.textContent==='✓';if(done){cb2.style.background='transparent';cb2.style.borderColor='var(--border2)';cb2.style.color='';cb2.textContent='';txt.style.color='';txt.style.textDecoration='';}else{cb2.style.background='var(--cyan)';cb2.style.borderColor='var(--cyan)';cb2.style.color='#000';cb2.textContent='✓';txt.style.color='var(--muted)';txt.style.textDecoration='line-through';}});
        row.appendChild(cb2);row.appendChild(txt);clw.appendChild(row);
      });
      wrap.appendChild(clw);
    }
    body.appendChild(wrap);
  });
  if(sec.type==='pipeline'){var sw=mk('div','field');sw.innerHTML='<div class="flbl">Estat</div>';var ss=mk('select','finp');ss.id='rf-_status';(sec.stages||['Idea','Esborrany','Llest']).forEach(function(s){var op=document.createElement('option');op.value=s;op.textContent=s;ss.appendChild(op);});ss.value=rec?rec._status:(defStatus||'Idea');sw.appendChild(ss);body.appendChild(sw);}
  if(rec){var db=mk('button','btn btn-d btn-sm');db.style.marginRight='auto';db.textContent='🗑 Eliminar';db.addEventListener('click',async function(){saveUndo();sendToTrash(sec.type,rec);sec.records=sec.records.filter(function(r){return r.id!==rec.id;});cm('rec-modal');await saveMain();refreshSec(sec.id);buildStats_update();toast('Mogut a la paperera');});foot.appendChild(db);}
  var cancBtn=mk('button','btn btn-sm');cancBtn.textContent='Cancel·lar';cancBtn.addEventListener('click',function(){cm('rec-modal');});foot.appendChild(cancBtn);
  var saveBtn=mk('button','btn btn-p btn-sm');saveBtn.textContent='Guardar';
  saveBtn.addEventListener('click',async function(){
    saveUndo();var data=rec?Object.assign({},rec):{id:uid()};
    (sec.fields||[]).forEach(function(field){
