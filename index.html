<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerodance · Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#111;--bg4:#181818;
  --cyan:#00c8d4;--cyan3:rgba(0,200,212,0.1);
  --text:#f5f2ee;--muted:#888;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --red:#e05252;--green:#52c97a;--amber:#d4a044;--purple:#a78bfa;
  --font-serif:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:8px;--r2:14px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
.login-glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#006f7a 0%,#003a42 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.login-wordmark{font-family:var(--font-serif);font-size:clamp(28px,5vw,48px);letter-spacing:.3em;color:var(--cyan);font-weight:300;position:relative;z-index:1;margin-bottom:6px}
.login-sub{font-size:10px;letter-spacing:.3em;color:rgba(0,200,212,.4);margin-bottom:36px;position:relative;z-index:1;text-transform:uppercase}
.login-box{width:290px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.login-label{font-size:10px;letter-spacing:.15em;color:rgba(0,200,212,.7);text-transform:uppercase;margin-bottom:4px}
.login-input{background:rgba(0,0,0,.6);border:1px solid rgba(0,200,212,.22);border-radius:6px;color:var(--text);font-family:var(--font-sans);font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s;width:100%}
.login-input:focus{border-color:var(--cyan)}
.login-btn{background:transparent;border:1px solid var(--cyan);border-radius:6px;color:var(--cyan);font-size:13px;letter-spacing:.1em;padding:12px;cursor:pointer;transition:all .2s;font-family:var(--font-sans)}
.login-btn:hover{background:var(--cyan);color:#000}
.login-err{font-size:12px;color:var(--red);text-align:center;min-height:16px}

/* APP SHELL */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}
#app.visible{display:flex}
.topnav{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;flex-shrink:0;gap:6px}
.nav-wordmark{font-family:var(--font-serif);font-size:17px;letter-spacing:.22em;color:var(--cyan);font-weight:300;flex-shrink:0;margin-right:6px}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:6px 12px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:transparent;font-family:var(--font-sans);white-space:nowrap;flex-shrink:0}
.nav-tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-tab.active{color:var(--cyan);background:var(--cyan3)}
.nav-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.nav-user{font-size:11px;color:var(--muted)}
.nav-badge{font-size:9px;background:var(--cyan3);color:var(--cyan);padding:2px 6px;border-radius:10px}
.btn-undo{font-size:11px;color:var(--amber);cursor:pointer;padding:4px 8px;border:1px solid rgba(212,160,68,.3);border-radius:5px;background:transparent;display:none}
.btn-nav{font-size:11px;color:var(--muted);cursor:pointer;padding:4px 9px;border:1px solid var(--border2);border-radius:5px;background:transparent;transition:all .15s}
.btn-nav:hover{color:var(--text)}

.stats-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2);overflow-x:auto;scrollbar-width:none}
.stat-item{padding:6px 16px;display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--border);flex-shrink:0}
.stat-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat-val{font-family:var(--font-serif);font-size:17px;color:var(--text);font-weight:300}

.content{flex:1;overflow:hidden;display:flex}
.page{display:none;flex:1;overflow:hidden;flex-direction:column}
.page.active{display:flex}

/* PAGE HEADER */
.page-header{padding:14px 22px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.page-title{font-family:var(--font-serif);font-size:21px;font-weight:300;letter-spacing:.08em}
.page-desc{font-size:12px;color:var(--muted);margin-top:2px}
.page-body{flex:1;overflow-y:auto;padding:16px 22px}

/* PIPELINE */
.board{display:flex;gap:11px;padding:13px 22px;overflow-x:auto;flex:1}
.stage-col{display:flex;flex-direction:column;min-width:200px;max-width:215px;flex:0 0 200px}
.stage-head{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 3px 7px;border-bottom:2px solid var(--sc,var(--border2));margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.stage-count{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#000}
.post-cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.post-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;cursor:pointer;transition:all .15s}
.post-item:hover{border-color:var(--border2);transform:translateY(-1px)}
.post-item-title{font-size:11px;color:var(--text);line-height:1.35;margin-bottom:5px}
.post-chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500}
.chip-muted{background:rgba(255,255,255,.05);color:var(--muted)}
.add-col-btn{border:1px dashed var(--border2);border-radius:var(--r);background:transparent;color:var(--muted);font-size:11px;padding:6px;cursor:pointer;transition:all .15s;margin-top:4px;width:100%}
.add-col-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* CALENDAR */
.cal-toolbar{padding:12px 22px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.cal-nav-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:5px 11px;cursor:pointer;font-size:12px;transition:all .15s}
.cal-nav-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-month-label{font-family:var(--font-serif);font-size:18px;font-weight:300;letter-spacing:.1em;min-width:160px}
.cal-body{flex:1;overflow:auto;padding:8px 16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-name{text-align:center;font-size:10px;color:var(--muted);padding:4px 0 6px;text-transform:uppercase}
.cal-cell{min-height:78px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:5px;cursor:pointer;transition:border-color .15s}
.cal-cell:hover{border-color:var(--border2)}
.cal-cell.today{border-color:var(--cyan)}
.cal-cell.other-month{opacity:.22}
.cal-num{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:2px}
.cal-cell.today .cal-num{color:var(--cyan);font-weight:600}
.cal-event{font-size:10px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3;cursor:pointer}
.legend-row{display:flex;flex-wrap:wrap;gap:7px;padding:7px 22px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2);align-items:center}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0}

/* LIST PAGE (tasks, deadlines, generic) */
.list-item{display:flex;align-items:flex-start;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.list-item:hover{border-color:var(--border2)}
.list-item.done{opacity:.5}
.list-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:10px;cursor:pointer;transition:all .15s}
.list-item.done .list-check{background:var(--green);border-color:var(--green);color:#000}
.list-info{flex:1;min-width:0}
.list-title{font-size:13px;color:var(--text);margin-bottom:2px}
.list-item.done .list-title{text-decoration:line-through;color:var(--muted)}
.list-sub{font-size:11px;color:var(--muted);line-height:1.4}
.list-countdown{font-family:var(--font-serif);font-size:16px;min-width:50px;text-align:right;flex-shrink:0}
.dl-badge{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500}
.badge-red{background:rgba(224,82,82,.15);color:var(--red)}
.badge-amber{background:rgba(212,160,68,.2);color:var(--amber)}
.badge-cyan{background:rgba(0,200,212,.12);color:var(--cyan)}

/* EDITORIAL / DOC */
.ed-body{flex:1;overflow-y:auto;padding:20px 24px}
.ed-section-title{font-family:var(--font-serif);font-size:21px;font-weight:300;letter-spacing:.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.ed-h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;margin-top:18px}
.link-card{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--lc,var(--cyan));border-radius:var(--r);padding:10px 13px;margin-bottom:6px;text-decoration:none;transition:opacity .15s}
.link-card:hover{opacity:.8}
.link-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.link-name{font-size:13px;color:var(--text)}
.link-url{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ed-text-block{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:8px;font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.ed-img-block{margin-bottom:8px}
.ed-img-block img{max-width:100%;border-radius:var(--r);border:1px solid var(--border)}

/* TRASH */
.trash-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;margin-bottom:5px}
.trash-info{flex:1;min-width:0}
.trash-name{font-size:13px;color:var(--muted)}
.trash-meta{font-size:11px;color:var(--muted);opacity:.6}

/* SETTINGS */
.settings-wrap{display:flex;overflow:hidden;width:100%;flex:1}
.settings-sidebar{width:180px;flex-shrink:0;border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
.settings-sidebar-item{padding:8px 16px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .12s;border-left:2px solid transparent}
.settings-sidebar-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.settings-sidebar-item.active{color:var(--cyan);border-left-color:var(--cyan);background:var(--cyan3)}
.settings-sidebar-group{padding:12px 16px 4px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.settings-body{flex:1;overflow-y:auto;padding:18px 22px}
.s-section{margin-bottom:22px}
.s-section h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
.item-row{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;margin-bottom:5px}
.item-main{flex:1;min-width:0}
.item-name{font-size:13px;color:var(--text)}
.item-sub{font-size:11px;color:var(--muted)}
.cswatch{width:15px;height:15px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}
.person-av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--border2);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--cyan)}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:19px}

/* PAGE TYPE CARDS */
.page-type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.page-type-card{background:var(--bg3);border:2px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;transition:all .15s;text-align:center}
.page-type-card:hover{border-color:var(--cyan);background:var(--cyan3)}
.page-type-card.selected{border-color:var(--cyan);background:var(--cyan3)}
.page-type-icon{font-size:28px;margin-bottom:8px}
.page-type-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.page-type-desc{font-size:11px;color:var(--muted);line-height:1.4}

/* FIELD BUILDER */
.field-builder-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;margin-bottom:5px}
.field-type-badge{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted);flex-shrink:0}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-sm{max-width:420px}
.modal-lg{max-width:720px}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.modal-head{padding:15px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-title{font-family:var(--font-serif);font-size:18px;font-weight:300;letter-spacing:.08em}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 7px}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:11px 20px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;flex-shrink:0;position:sticky;bottom:0;background:var(--bg2)}

/* FORMS */
.field{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan)}
.field select option{background:var(--bg4)}
.field textarea{resize:vertical;min-height:68px;line-height:1.5}
.field input[type=color]{height:34px;padding:3px 5px;cursor:pointer}
.field input[type=checkbox]{width:auto;cursor:pointer}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.people-checks{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.pcheck{display:flex;align-items:center;gap:5px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:5px 9px;cursor:pointer;transition:all .15s;font-size:12px;color:var(--muted);user-select:none}
.pcheck.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,200,212,.07)}
.pcheck-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.checklist{display:flex;flex-direction:column;gap:4px}
.check-row{display:flex;align-items:center;gap:7px;cursor:pointer;padding:4px 5px;border-radius:6px;transition:background .12s}
.check-row:hover{background:var(--bg4)}
.cbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px}
.check-row.done .cbox{background:var(--cyan);border-color:var(--cyan);color:#000}
.check-row.done .check-text{color:var(--muted);text-decoration:line-through}
.check-text{font-size:12px;color:var(--text)}

/* IMAGE UPLOAD AREA */
.img-upload-area{border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}
.img-upload-area:hover{border-color:var(--cyan)}
.img-upload-area input{display:none}

/* BUTTONS */
.btn{font-family:var(--font-sans);font-size:12px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.04)}
.btn-primary{background:var(--cyan);border-color:var(--cyan);color:#000;font-weight:500}
.btn-primary:hover{background:#00e0ed;border-color:#00e0ed;color:#000}
.btn-danger{border-color:rgba(224,82,82,.4);color:var(--red)}
.btn-danger:hover{background:rgba(224,82,82,.1)}
.btn-sm{font-size:11px;padding:5px 11px}
.btn-xs{font-size:10px;padding:3px 8px}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;z-index:500;background:var(--bg3);border:1px solid var(--cyan);border-radius:var(--r);padding:9px 15px;font-size:13px;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{display:flex}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.sep{height:1px;background:var(--border);margin:10px 0}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-glow"></div>
  <div class="login-wordmark">AERODANCE</div>
  <div class="login-sub">Comparsa · Carnaval de Tarragona</div>
  <div class="login-box">
    <div><div class="login-label">Usuari</div><input class="login-input" type="text" id="l-user" placeholder="admin"></div>
    <div><div class="login-label">Contrasenya</div><input class="login-input" type="password" id="l-pass" placeholder="••••••••"></div>
    <button class="login-btn" id="btn-login">Accedir</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<div id="app">
  <div class="topnav">
    <div class="nav-wordmark">AERODANCE</div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div class="nav-right">
      <button class="btn-undo" id="btn-undo">↩ Desfer</button>
      <span class="nav-user" id="nav-username"></span>
      <span class="nav-badge" id="nav-badge" style="display:none">ADMIN</span>
      <button class="btn-nav" id="btn-chpwd">Contrasenya</button>
      <button class="btn-nav" id="btn-logout">Sortir</button>
    </div>
  </div>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="content" id="main-content"></div>
</div>

<!-- DYNAMIC RECORD MODAL -->
<div class="modal-overlay" id="record-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="rec-modal-title">Nou element</div>
      <button class="modal-close" data-close="record-modal">×</button>
    </div>
    <div class="modal-body" id="rec-modal-body"></div>
    <div class="modal-foot" id="rec-modal-foot"></div>
  </div>
</div>

<!-- GENERIC MODAL -->
<div class="modal-overlay" id="gen-modal">
  <div class="modal modal-sm" id="gen-modal-inner">
    <div class="modal-head"><div class="modal-title" id="gen-lbl">Editar</div><button class="modal-close" data-close="gen-modal">×</button></div>
    <div class="modal-body" id="gen-body"></div>
    <div class="modal-foot" id="gen-foot"></div>
  </div>
</div>

<!-- PAGE TYPE PICKER MODAL -->
<div class="modal-overlay" id="pagetype-modal">
  <div class="modal modal-lg">
    <div class="modal-head"><div class="modal-title">Nova pàgina — Tria el tipus</div><button class="modal-close" data-close="pagetype-modal">×</button></div>
    <div class="modal-body">
      <div class="page-type-grid" id="pagetype-grid"></div>
      <div class="sep"></div>

      if(nf&&nf.options){var ni=nf.options.indexOf(netVal);if(ni>=0)netColor=netColors[ni%netColors.length];}

var recModalCtx={page:null,record:null,defStatus:null};

function openRecordModal(page,record,defStatus){
  recModalCtx={page:page,record:record,defStatus:defStatus};
  var title=record?(page.type==='pipeline'?'Editar post':'Editar element'):(page.type==='pipeline'?'Nou post':'Nou element');
  stxt('rec-modal-title',title);
  var body=gid('rec-modal-body');body.innerHTML='';
  var foot=gid('rec-modal-foot');foot.innerHTML='';

  // Build fields
  var fields=page.fields||[];
  fields.forEach(function(field){
    var val=record?record[field.id]:'';
    var wrap=mkEl('div','field');
    wrap.innerHTML='<div class="field-label">'+escH(field.name)+'</div>';

    if(field.type==='text'||field.type==='color'||field.type==='number'){
      var inp=mkEl('input','');inp.type=field.type==='color'?'color':(field.type==='number'?'number':'text');
      inp.id='rf-'+field.id;inp.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%';
      if(val)inp.value=val;wrap.appendChild(inp);
    }else if(field.type==='textarea'){
      var ta=mkEl('textarea','');ta.id='rf-'+field.id;ta.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%;min-height:68px;resize:vertical;line-height:1.5';
      if(val)ta.value=val;wrap.appendChild(ta);
    }else if(field.type==='date'){
      var di=mkEl('input','');di.type='date';di.id='rf-'+field.id;di.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%';
      di.value=val||todayStr;wrap.appendChild(di);
    }else if(field.type==='time'){
      var ti2=mkEl('input','');ti2.type='time';ti2.id='rf-'+field.id;ti2.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%';
      ti2.value=val||'19:00';wrap.appendChild(ti2);
    }else if(field.type==='select'){
      var sl=mkEl('select','');sl.id='rf-'+field.id;sl.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%';
      // For category fields, use D.categories
      var opts=field.options||[];
      if(field.id==='cat'&&page.type!=='pipeline'){D.categories.forEach(function(c){opts=[].concat(D.categories.map(function(x){return x.name;}));});}
      opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;sl.appendChild(op);});
      if(val)sl.value=val;wrap.appendChild(sl);
    }else if(field.type==='multiselect'){
      var msWrap=mkEl('div','');msWrap.id='rf-'+field.id;msWrap.style.cssText='display:flex;flex-wrap:wrap;gap:5px';
      var selected=val?val.split(',').map(function(s){return s.trim();}).filter(Boolean):[];
      (field.options||[]).forEach(function(o){
        var sp=mkEl('span','pcheck'+(selected.includes(o)?' on':''));sp.dataset.val=o;
        sp.innerHTML='<span class="pcheck-dot" style="background:var(--cyan)"></span>'+escH(o);
        sp.addEventListener('click',function(){sp.classList.toggle('on');});
        msWrap.appendChild(sp);
      });
      wrap.appendChild(msWrap);
    }else if(field.type==='checkbox'){
      var cb2=mkEl('input','');cb2.type='checkbox';cb2.id='rf-'+field.id;cb2.style.cssText='width:18px;height:18px;cursor:pointer;accent-color:var(--cyan)';
      if(val)cb2.checked=true;
      var lbl=mkEl('label','');lbl.htmlFor='rf-'+field.id;lbl.style.cssText='font-size:13px;cursor:pointer;margin-left:6px';lbl.textContent=field.name;
      var cbRow=mkEl('div','');cbRow.style.cssText='display:flex;align-items:center;gap:6px';cbRow.appendChild(cb2);cbRow.appendChild(lbl);
      wrap.innerHTML='';wrap.appendChild(cbRow);
    }else if(field.type==='people'){
      var pWrap=mkEl('div','people-checks');pWrap.id='rf-'+field.id;
      var selPeople=Array.isArray(val)?val:(val?[val]:[]);
      D.people.forEach(function(p){
        var sp=mkEl('span','pcheck'+(selPeople.includes(p.id)?' on':''));sp.dataset.id=p.id;
        sp.innerHTML='<span class="pcheck-dot" style="background:'+p.color+'"></span>'+escH(p.name);
        sp.addEventListener('click',function(){sp.classList.toggle('on');});
        pWrap.appendChild(sp);
      });
      wrap.appendChild(pWrap);
    }else if(field.type==='image'){
      var imgVal=val||'';
      var imgWrap=mkEl('div','');imgWrap.id='rf-'+field.id;
      if(imgVal){var preview=mkEl('img','');preview.src=imgVal;preview.style.cssText='max-width:100%;max-height:200px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:8px;display:block';imgWrap.appendChild(preview);}
      var upArea=mkEl('div','img-upload-area');
      upArea.innerHTML='<div style="font-size:12px;color:var(--muted)">📎 Clica per seleccionar imatge</div>';
      var fileInp=mkEl('input','');fileInp.type='file';fileInp.accept='image/*';
      fileInp.addEventListener('change',function(){
        var file=fileInp.files[0];if(!file)return;
        var reader=new FileReader();
        reader.onload=function(ev){
          imgWrap.innerHTML='';
          var prev2=mkEl('img','');prev2.src=ev.target.result;prev2.style.cssText='max-width:100%;max-height:200px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:8px;display:block';prev2.dataset.b64=ev.target.result;
          imgWrap.appendChild(prev2);
          var rmBtn=mkEl('button','btn btn-xs btn-danger');rmBtn.textContent='× Treure imatge';
          rmBtn.addEventListener('click',function(){imgWrap.innerHTML='<div style="font-size:12px;color:var(--muted);padding:10px 0">Cap imatge</div>';imgWrap.dataset.cleared='1';});
          imgWrap.appendChild(rmBtn);
        };
        reader.readAsDataURL(file);
      });
      upArea.appendChild(fileInp);
      upArea.addEventListener('click',function(){fileInp.click();});
      imgWrap.appendChild(upArea);
      wrap.appendChild(imgWrap);
    }else if(field.type==='checklist'){
      var clWrap=mkEl('div','checklist');clWrap.id='rf-'+field.id;
      var clState=val||{};
      (field.options||[]).forEach(function(item,i){
        var row=mkEl('div','check-row'+(clState[item]?' done':''));
        row.innerHTML='<div class="cbox">'+( clState[item]?'✓':'')+'</div><div class="check-text">'+escH(item)+'</div>';
        row.addEventListener('click',function(){row.classList.toggle('done');row.querySelector('.cbox').textContent=row.classList.contains('done')?'✓':'';});
        clWrap.appendChild(row);
      });
      wrap.appendChild(clWrap);
    }
    body.appendChild(wrap);
  });

  // Status field for pipeline
  if(page.type==='pipeline'){
    var stWrap=mkEl('div','field');
    stWrap.innerHTML='<div class="field-label">Estat</div>';
    var stSel=mkEl('select','');stSel.id='rf-_status';stSel.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font-sans);font-size:13px;padding:8px 11px;outline:none;width:100%';
    (page.stages||['Idea','Esborrany','Llest']).forEach(function(s){var op=document.createElement('option');op.value=s;op.textContent=s;stSel.appendChild(op);});
    stSel.value=record?record._status:(defStatus||'Idea');
    stWrap.appendChild(stSel);body.appendChild(stWrap);
  }

  // Footer
  if(record){
    var delBtn=mkEl('button','btn btn-danger btn-sm');delBtn.style.marginRight='auto';delBtn.textContent='🗑 Eliminar';
    delBtn.addEventListener('click',async function(){
      saveUndo();
      sendToTrash(page.type,record);
      page.records=page.records.filter(function(r){return r.id!==record.id;});
      closeModal('record-modal');await saveMain();refreshCurrent();showToast('Mogut a la paperera');
    });
    foot.appendChild(delBtn);
  }
  var cancelBtn=mkEl('button','btn btn-sm');cancelBtn.textContent='Cancel·lar';cancelBtn.addEventListener('click',function(){closeModal('record-modal');});foot.appendChild(cancelBtn);
  var saveBtn=mkEl('button','btn btn-primary btn-sm');saveBtn.textContent='Guardar';
  saveBtn.addEventListener('click',async function(){
    saveUndo();
    var data=record?Object.assign({},record):{id:uid()};
    // Collect fields
    fields.forEach(function(field){
      if(field.type==='people'){
        var pw=gid('rf-'+field.id);
        data[field.id]=pw?Array.from(pw.querySelectorAll('.pcheck.on')).map(function(s){return +s.dataset.id;}):[];
      }else if(field.type==='multiselect'){
        var mw=gid('rf-'+field.id);
        data[field.id]=mw?Array.from(mw.querySelectorAll('.pcheck.on')).map(function(s){return s.dataset.val;}).join(', '):'';
      }else if(field.type==='checkbox'){
        var cb3=gid('rf-'+field.id);data[field.id]=cb3?cb3.checked:false;
      }else if(field.type==='image'){
        var iw=gid('rf-'+field.id);
        if(iw&&iw.dataset.cleared)data[field.id]='';
        else{var img2=iw?iw.querySelector('img[data-b64]'):null;if(img2)data[field.id]=img2.dataset.b64;else if(record)data[field.id]=record[field.id]||'';}
      }else if(field.type==='checklist'){
        var clw=gid('rf-'+field.id);var clr={};
        if(clw)(field.options||[]).forEach(function(item,i){var row=clw.children[i];clr[item]=row?row.classList.contains('done'):false;});
        data[field.id]=clr;
      }else{
        var e2=gid('rf-'+field.id);data[field.id]=e2?e2.value:'';
      }
    });
    // title fallback
    data._title=data.title||data._title||'';
    if(page.type==='pipeline')data._status=gval('rf-_status')||defStatus||'Idea';
    if(!page.records)page.records=[];
    if(record){var idx=page.records.findIndex(function(r){return r.id===record.id;});if(idx>=0)page.records[idx]=data;}
    else page.records.push(data);
    closeModal('record-modal');await saveMain();refreshCurrent();showToast('✓ Guardat');
  });
  foot.appendChild(saveBtn);
  openModal('record-modal');
}

function renderDeadlinesPage(el,page){
  var hdr=mkEl('div','page-header');
  hdr.innerHTML='<div><div class="page-title">'+escH(page.name)+'</div>'+(page.desc?'<div class="page-desc">'+escH(page.desc)+'</div>':'')+'</div>';
  var btn=mkEl('button','btn btn-primary btn-sm');btn.textContent='+ Nova data';btn.style.marginLeft='auto';
  btn.addEventListener('click',function(){openRecordModal(page,null,null);});
  hdr.appendChild(btn);el.appendChild(hdr);
  var body=mkEl('div','page-body');
  var recs=(page.records||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var past=recs.filter(function(r){return daysUntil(r.date)<0;});
  var soon=recs.filter(function(r){var x=daysUntil(r.date);return x>=0&&x<=60;});
  var fut=recs.filter(function(r){return daysUntil(r.date)>60;});
  function renderGroup(items,title){
    if(!items.length)return;
    var s=mkEl('div','');s.style.marginBottom='18px';
    s.innerHTML='<div class="dl-section-title" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border)">'+escH(title)+'</div>';
    items.forEach(function(r){
      var days=daysUntil(r.date);
      var cat=D.categories.find(function(c){return c.name===r.cat;});
      var color=cat?cat.color:'#00c8d4';
      var badge='',cc=color;
      if(days<0)badge='<span class="dl-badge badge-red">Passada</span>';
      else if(days===0){badge='<span class="dl-badge badge-red">AVUI</span>';cc='var(--red)';}
      else if(days<=7){badge='<span class="dl-badge badge-red">'+days+'d</span>';cc='var(--red)';}
      else if(days<=30){badge='<span class="dl-badge badge-amber">'+days+'d</span>';cc='var(--amber)';}
      else badge='<span class="dl-badge badge-cyan">'+days+'d</span>';
      var df=new Date(r.date).toLocaleDateString('ca-ES',{day:'numeric',month:'long',year:'numeric'});
      var item=mkEl('div','list-item');
      item.innerHTML='<div style="width:9px;height:9px;border-radius:50%;background:'+color+';flex-shrink:0;margin-top:5px"></div>'+
        '<div class="list-info"><div class="list-title">'+escH(r.title||r._title||'')+'  '+badge+'</div>'+
        '<div class="list-sub">'+df+(r.cat?' · '+escH(r.cat):'')+(r.notes?' · '+escH(r.notes.substring(0,60)):'')+'</div></div>'+
        '<div class="list-countdown" style="color:'+cc+'">'+(days<0?'✓':days===0?'Avui':days+'d')+'</div>';
      item.addEventListener('click',function(){openRecordModal(page,r,null);});
      s.appendChild(item);
    });
    body.appendChild(s);
  }
  renderGroup(soon,'Pròximes (60 dies)');renderGroup(fut,'Futures');renderGroup(past,'Passades');
  el.appendChild(body);
}

function renderListPage(el,page){
  var hdr=mkEl('div','page-header');
  hdr.innerHTML='<div><div class="page-title">'+escH(page.name)+'</div>'+(page.desc?'<div class="page-desc">'+escH(page.desc)+'</div>':'')+'</div>';
  var btn=mkEl('button','btn btn-primary btn-sm');btn.textContent='+ Nou element';btn.style.marginLeft='auto';
  btn.addEventListener('click',function(){openRecordModal(page,null,null);});
  if(isAdmin()){var cfgBtn=mkEl('button','btn btn-sm');cfgBtn.textContent='⚙️';cfgBtn.addEventListener('click',function(){goPageId('__settings__');activeStab='pages';renderPageContent('__settings__');});hdr.appendChild(cfgBtn);}
  hdr.appendChild(btn);el.appendChild(hdr);
  var body=mkEl('div','page-body');
  // Category filter
  var catField=page.fields.find(function(f){return f.id==='cat';});
  var cats=catField?catField.options||[]:[];
  if(page.id==='__tasks__')cats=D.categories.map(function(c){return c.name;});
  if(cats.length>1){
    var fr=mkEl('div','');fr.style.cssText='display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px';
    var allChip=mkEl('span','chip');allChip.style.cssText='background:var(--cyan3);color:var(--cyan);cursor:pointer;padding:3px 10px';allChip.textContent='Totes';allChip.dataset.fcat='all';
    fr.appendChild(allChip);
    cats.forEach(function(c){var cat=D.categories.find(function(x){return x.name===c;});var col=cat?cat.color:'#888';var ch=mkEl('span','chip');ch.style.cssText='background:'+col+'22;color:'+col+';cursor:pointer;padding:3px 10px';ch.textContent=c;ch.dataset.fcat=c;fr.appendChild(ch);});
    body.appendChild(fr);
    fr.querySelectorAll('[data-fcat]').forEach(function(ch){ch.addEventListener('click',function(){drawList(body,page,ch.dataset.fcat);});});
  }
  var listEl=mkEl('div','');listEl.id='list-content-'+page.id;body.appendChild(listEl);

}
function drawList(body,page,filterCat){
  var listEl=gid('list-content-'+page.id);if(!listEl){listEl=body.querySelector('[id^="list-content"]');}if(!listEl)return;
  listEl.innerHTML='';
  var recs=page.records||[];
  if(filterCat!=='all')recs=recs.filter(function(r){return r.cat===filterCat;});
  var pending=recs.filter(function(r){return !r._done;});
  var done=recs.filter(function(r){return r._done;});
  function renderGroup(items,title){
    if(!items.length)return;
    var s=mkEl('div','');s.style.marginBottom='16px';
    if(title)s.innerHTML='<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--border)">'+escH(title)+'</div>';
    items.forEach(function(r){
      var item=mkEl('div','list-item'+(r._done?' done':''));
      var hasDone=page.fields.some(function(f){return f.id==='status';});
      var chk=mkEl('div','list-check');chk.textContent=r._done?'✓':'';
      chk.addEventListener('click',async function(e){e.stopPropagation();saveUndo();r._done=!r._done;if(r._done&&page.fields.find(function(f){return f.id==='status';}))r.status='Fet';await saveMain();renderListPage(listEl.closest('.page'),page);buildStats();showToast(r._done?'✓ Completada':'Reoberta');});
      var catObj=D.categories.find(function(c){return c.name===r.cat;});
      var catColor=catObj?catObj.color:'#888';
      var info=mkEl('div','list-info');
      info.innerHTML='<div class="list-title">'+escH(r.title||r._title||'Sense títol')+'</div>'+
        '<div class="list-sub">'+(r.cat?'<span style="color:'+catColor+'">'+escH(r.cat)+'</span>':'')+
        (r.status&&!r._done?' · '+escH(r.status):'')+
        (r.notes?' · '+escH((r.notes||'').substring(0,60)):'')+'</div>';
      item.appendChild(chk);item.appendChild(info);
      item.addEventListener('click',function(){openRecordModal(page,r,null);});
      s.appendChild(item);
    });
    listEl.appendChild(s);
  }
  renderGroup(pending,'Pendents');
  if(done.length)renderGroup(done,'Completades');
  if(!recs.length)listEl.innerHTML='<div style="color:var(--muted);font-size:13px;padding:16px 0">Cap element.</div>';
}

// CALENDAR PAGE
// ══════════════════════════════════════════
function renderCalendarPage(el,page){
  autoPublish();
  var CAL_MONTHS=['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];
  var CAL_DAYS=['dl','dt','dc','dj','dv','ds','dg'];
  var wrap=mkEl('div','');wrap.style.cssText='display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden';
  var toolbar=mkEl('div','cal-toolbar');
  var prevBtn=mkEl('button','cal-nav-btn');prevBtn.textContent='← Ant.';
  var lbl=mkEl('div','cal-month-label');lbl.textContent=CAL_MONTHS[calMonth]+' '+calYear;
  var nextBtn=mkEl('button','cal-nav-btn');nextBtn.textContent='Seg. →';
  var addPost=mkEl('button','btn btn-primary btn-sm');addPost.textContent='+ Post';addPost.style.marginLeft='auto';
  var addDl=mkEl('button','btn btn-sm');addDl.textContent='+ Data clau';
  toolbar.appendChild(prevBtn);toolbar.appendChild(lbl);toolbar.appendChild(nextBtn);toolbar.appendChild(addPost);toolbar.appendChild(addDl);
  prevBtn.addEventListener('click',function(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendarPage(el,page);});
  nextBtn.addEventListener('click',function(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendarPage(el,page);});
  var plPage=getPage('__pipeline__');
  var dlPage=getPage('__deadlines__');
  addPost.addEventListener('click',function(){if(plPage)openRecordModal(plPage,null,'Idea');});
  addDl.addEventListener('click',function(){if(dlPage)openRecordModal(dlPage,null,null);});
  var calBody=mkEl('div','cal-body');
  var grid=mkEl('div','cal-grid');
  CAL_DAYS.forEach(function(d){var h=mkEl('div','cal-day-name');h.textContent=d;grid.appendChild(h);});
  var first=new Date(calYear,calMonth,1),last=new Date(calYear,calMonth+1,0);
  var start=first.getDay();if(start===0)start=7;start--;
  function makeCalCell(date,other){
    var ds=date.toISOString().split('T')[0];
    var isToday=ds===todayStr;
    var cell=mkEl('div','cal-cell'+(other?' other-month':'')+(isToday?' today':''));
    var num=mkEl('div','cal-num');num.textContent=date.getDate();cell.appendChild(num);
    // Deadlines
    if(dlPage)(dlPage.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
      var cat=D.categories.find(function(c){return c.name===r.cat;});var col=cat?cat.color:'#00c8d4';
      var ev=mkEl('div','cal-event');ev.style.cssText='background:'+col+'22;color:'+col;ev.textContent=r.title||r._title||'';
      ev.addEventListener('click',function(e){e.stopPropagation();if(dlPage)openRecordModal(dlPage,r,null);});
      cell.appendChild(ev);
    });
    // Posts
    if(plPage)(plPage.records||[]).filter(function(r){return r.date===ds;}).forEach(function(r){
      var col=r._status==='Publicat'?'#52c97a':'#a78bfa';
      var ev=mkEl('div','cal-event');ev.style.cssText='background:'+col+'22;color:'+col;
      ev.textContent=(r._status==='Publicat'?'✓ ':'')+(r.title||r._title||'');
      ev.addEventListener('click',function(e){e.stopPropagation();if(plPage)openRecordModal(plPage,r,null);});
      cell.appendChild(ev);
    });
    cell.addEventListener('click',function(){if(plPage){openRecordModal(plPage,null,'Idea');setTimeout(function(){var di=gid('rf-date');if(di)di.value=ds;},50);}});
    return cell;
  }
  for(var i=0;i<start;i++)grid.appendChild(makeCalCell(new Date(calYear,calMonth,1-start+i),true));
  for(var dd=1;dd<=last.getDate();dd++)grid.appendChild(makeCalCell(new Date(calYear,calMonth,dd),false));
  var rem=42-(start+last.getDate());
  for(var d2=1;d2<=rem;d2++)grid.appendChild(makeCalCell(new Date(calYear,calMonth+1,d2),true));
  calBody.appendChild(grid);
  // Legend
  var leg=mkEl('div','legend-row');
  D.categories.forEach(function(c){var item=mkEl('div','legend-item');item.innerHTML='<div class="legend-swatch" style="background:'+c.color+'"></div>'+escH(c.name);leg.appendChild(item);});

function renderDocumentPage(el,page){
  var body=mkEl('div','ed-body');

  if(isAdmin()){
    var addRow=mkEl('div','');addRow.style.cssText='display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap';
    var addLink=mkEl('button','btn btn-sm');addLink.textContent='+ Link/Recurs';

    var addImg=mkEl('button','btn btn-sm');addImg.textContent='+ Imatge';
    addLink.addEventListener('click',function(){openAddLinkBlock(page,el);});
    addText.addEventListener('click',function(){openAddTextBlock(page,el);});
    addImg.addEventListener('click',function(){openAddImageBlock(page,el);});
    addRow.appendChild(addLink);addRow.appendChild(addText);addRow.appendChild(addImg);

  body.appendChild(hdr);

        var col=typeColors[l.linktype]||'#888';
        var card=mkEl('a','link-card');card.href=l.url||'#';card.target='_blank';card.style.setProperty('--lc',col);

        body.appendChild(card);
      });

      var tb=mkEl('div','ed-text-block');tb.textContent=block.content||'';
      if(isAdmin()){var etb=mkEl('button','btn btn-xs');etb.style.cssText='float:right;margin-left:8px';etb.textContent='✏️';
        etb.addEventListener('click',function(){openEditTextBlock(page,block,el);});tb.prepend(etb);}
      body.appendChild(tb);

      var ib=mkEl('div','ed-img-block');
      if(block.content){var im=mkEl('img','');im.src=block.content;im.alt=block.caption||'';ib.appendChild(im);}
      if(block.caption){var cap=mkEl('div','');cap.style.cssText='font-size:11px;color:var(--muted);margin-top:4px';cap.textContent=block.caption;ib.appendChild(cap);}
      if(isAdmin()){var eib=mkEl('button','btn btn-xs');eib.textContent='✏️';eib.addEventListener('click',function(){openEditImageBlock(page,block,el);});ib.appendChild(eib);}
      body.appendChild(ib);
    }
  });
  // Hashtags section
  if(page.id==='__editorial__'){
    var hh=mkEl('div','ed-h3');hh.textContent='Hashtags';body.appendChild(hh);
    var htRow=mkEl('div','');htRow.style.cssText='display:flex;flex-wrap:wrap;gap:7px';

    body.appendChild(htRow);
  }
  el.appendChild(body);
}

function sendToTrash(type,item){
  var cutoff=new Date(Date.now()-864e5).toISOString();
  D.trash=(D.trash||[]).filter(function(x){return x.deletedAt>cutoff;});
  D.trash.push({id:uid(),type:type,item:JSON.parse(JSON.stringify(item)),deletedAt:new Date().toISOString()});
}
function renderTrashPage(el,page){
  var hdr=mkEl('div','page-header');
  hdr.innerHTML='<div class="page-title">🗑 Paperera</div><span style="font-size:12px;color:var(--muted);margin-left:10px">Auto-eliminació als 24h</span>';
  if(isAdmin()&&D.trash&&D.trash.length){var eb=mkEl('button','btn btn-danger btn-sm');eb.textContent='Buidar tot';eb.style.marginLeft='auto';eb.addEventListener('click',async function(){D.trash=[];await saveMain();renderTrashPage(el,page);showToast('Paperera buidada');});hdr.appendChild(eb);}
  el.appendChild(hdr);
  var body=mkEl('div','page-body');
  var cutoff=new Date(Date.now()-864e5).toISOString();
  D.trash=(D.trash||[]).filter(function(x){return x.deletedAt>cutoff;});
  if(!D.trash.length){body.innerHTML='<div style="color:var(--muted);font-size:13px;padding:16px 0">La paperera és buida.</div>';}
  else{
    D.trash.slice().reverse().forEach(function(ti){
      var item=mkEl('div','trash-item');
      var typeLabel={pipeline:'Post',list:'Tasca',deadlines:'Data clau'}[ti.type]||ti.type;
      item.innerHTML='<div class="trash-info"><div class="trash-name">'+escH(ti.item.title||ti.item._title||ti.item.name||'Element')+'</div><div class="trash-meta">'+typeLabel+' · '+new Date(ti.deletedAt).toLocaleString('ca-ES')+'</div></div>';
      var rb=mkEl('button','btn btn-sm btn-xs');rb.textContent='↩ Restaurar';
      rb.addEventListener('click',async function(){
        saveUndo();
        var pg=D.pages.find(function(p){return p.type===ti.type;});
        if(pg){if(!pg.records)pg.records=[];pg.records.push(ti.item);}
        D.trash=D.trash.filter(function(x){return x.id!==ti.id;});
        await saveMain();renderTrashPage(el,page);buildStats();showToast('↩ Restaurat');
      });
      var db=mkEl('button','btn btn-xs btn-danger');db.textContent='× Eliminar';
      db.addEventListener('click',async function(){D.trash=D.trash.filter(function(x){return x.id!==ti.id;});await saveMain();renderTrashPage(el,page);showToast('Eliminat definitivament');});
      item.appendChild(rb);item.appendChild(db);body.appendChild(item);
    });
  }
  el.appendChild(body);
}

var STABS_DEF=[
  {id:'general',label:'General',group:''},
  {id:'pages',label:'Pàgines',group:'ESTRUCTURA'},
  {id:'fields',label:'Camps & Formularis',group:''},
  {id:'categories',label:'Categories',group:'DADES'},
  {id:'people',label:'Persones',group:''},
  {id:'hashtags',label:'Hashtags',group:''},
  {id:'access',label:'Usuaris & Accés',group:'ACCÉS'},
];

function renderSettingsPage(el,page){
  if(!isAdmin())return;
  el.innerHTML='';
  var wrap=mkEl('div','settings-wrap');
  var sidebar=mkEl('div','settings-sidebar');
  var body=mkEl('div','settings-body');
  var lastGroup='';
  STABS_DEF.forEach(function(s){
    if(s.group&&s.group!==lastGroup){var g=mkEl('div','settings-sidebar-group');g.textContent=s.group;sidebar.appendChild(g);lastGroup=s.group;}
    var item=mkEl('div','settings-sidebar-item'+(activeStab===s.id?' active':''));
    item.textContent=s.label;
    item.addEventListener('click',function(){activeStab=s.id;renderSettingsPage(el,page);});
    sidebar.appendChild(item);
  });
  wrap.appendChild(sidebar);wrap.appendChild(body);el.appendChild(wrap);
  if(activeStab==='general')stGeneral(body);
  else if(activeStab==='pages')stPages(body);
  else if(activeStab==='fields')stFields(body);
  else if(activeStab==='categories')stCategories(body);
  else if(activeStab==='people')stPeople(body);
  else if(activeStab==='hashtags')stHashtags(body);
  else if(activeStab==='access')stAccess(body);
}

function stPages(body){
  body.innerHTML='';

function editPageSettings(pgId,body){

  openGenModal('Editar pàgina "'+escH(pg.name)+'"',
    '<div class="field"><div class="field-label">Nom</div><input type="text" id="gm-pgname" value="'+escQ(pg.name)+'"></div>'+
    '<div class="field"><div class="field-label">Descripció</div><input type="text" id="gm-pgdesc" value="'+escQ(pg.desc||'')+'"></div>',
    async function(){saveUndo();pg.name=gval('gm-pgname')||pg.name;pg.desc=gval('gm-pgdesc');closeModal('gen-modal');await saveMain();buildNav();stPages(body);showToast('✓ Guardat');},
    pg.id.startsWith('__')?null:async function(){
      if(!confirm('Eliminar la pàgina "'+pg.name+'"? S\'eliminaran tots els seus elements.'))return;
      saveUndo();D.pages=D.pages.filter(function(p){return p.id!==pgId;});
      closeModal('gen-modal');await saveMain();buildNav();buildContentArea();goPageId(getAllowedPageIds()[0]||'__pipeline__');showToast('Pàgina eliminada');
    }
  );
}

function openNewPageModal(){
  selectedPageType=null;
  var grid=gid('pagetype-grid');grid.innerHTML='';
  PAGE_TYPES.forEach(function(pt){
    var card=mkEl('div','page-type-card');
    card.innerHTML='<div class="page-type-icon">'+pt.icon+'</div><div class="page-type-name">'+escH(pt.name)+'</div><div class="page-type-desc">'+escH(pt.desc)+'</div>';
    card.addEventListener('click',function(){
      document.querySelectorAll('.page-type-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');selectedPageType=pt.type;
    });
    grid.appendChild(card);
  });
  gid('newpage-name').value='';gid('newpage-desc').value='';
  openModal('pagetype-modal');
}
gid('newpage-create').addEventListener('click',async function(){
  if(!selectedPageType){showToast('⚠️ Selecciona un tipus');return;}
  var name=gval('newpage-name').trim();if(!name){showToast('⚠️ Posa un nom');return;}
  saveUndo();
  var newPg={id:'pg_'+uid(),type:selectedPageType,name:name,desc:gval('newpage-desc'),
    fields:JSON.parse(JSON.stringify(DEFAULT_FIELDS[selectedPageType]||[])),records:[],blocks:[]};
  if(selectedPageType==='pipeline')newPg.stages=['Idea','Esborrany','Llest'];
  D.pages.splice(D.pages.length-2,0,newPg);// before trash & settings
  // Add to all users
  Object.keys(D.userTabs).forEach(function(u){if(D.userTabs[u]&&u!=='admin')D.userTabs[u].push(newPg.id);});
  closeModal('pagetype-modal');await saveMain();buildNav();buildContentArea();goPageId(newPg.id);showToast('✓ Pàgina creada');
});

function stFields(body){
  body.innerHTML='';
  var s=mkEl('div','s-section');
  s.innerHTML='<h3>Selecciona una pàgina per editar els seus camps</h3>';
  var selWrap=mkEl('div','field');selWrap.style.marginBottom='14px';
  var sel=mkEl('select','');sel.style.cssText='background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;padding:8px 11px;outline:none;width:300px';
  D.pages.filter(function(p){return p.type!=='settings'&&p.type!=='trash'&&p.type!=='calendar';}).forEach(function(pg){
    var op=document.createElement('option');op.value=pg.id;op.textContent=pg.name+' ('+pg.type+')';sel.appendChild(op);
  });
  selWrap.appendChild(sel);s.appendChild(selWrap);
  var fieldsContainer=mkEl('div','');s.appendChild(fieldsContainer);
  body.appendChild(s);
  function renderFieldList(){
    fieldsContainer.innerHTML='';
    var pgId=sel.value;var pg=getPage(pgId);if(!pg)return;
    var fh=mkEl('div','');fh.style.cssText='font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px';fh.textContent='Camps del formulari "'+pg.name+'"';
    fieldsContainer.appendChild(fh);
    (pg.fields||[]).forEach(function(field,idx){
      var row=mkEl('div','field-builder-item');
      row.innerHTML='<span style="font-size:13px;color:var(--text);flex:1">'+escH(field.name)+'</span>'+
        '<span class="field-type-badge">'+escH(field.type)+'</span>';
      if(!field.system){
        var eb=mkEl('button','btn btn-xs');eb.textContent='✏️ Editar';
        var db=mkEl('button','btn btn-xs btn-danger');db.textContent='×';
        eb.addEventListener('click',function(){openFieldEditor(pg,field,renderFieldList);});
        db.addEventListener('click',async function(){saveUndo();pg.fields.splice(idx,1);await saveMain();renderFieldList();showToast('Camp eliminat');});
        row.appendChild(eb);row.appendChild(db);
      }else{row.innerHTML+='<span style="font-size:10px;color:var(--muted)">sistema</span>';}
      fieldsContainer.appendChild(row);
    });
    var addBtn=mkEl('button','btn btn-sm');addBtn.textContent='+ Nou camp';addBtn.style.marginTop='8px';
    addBtn.addEventListener('click',function(){openNewFieldModal(pg,renderFieldList);});
    fieldsContainer.appendChild(addBtn);
  }
  sel.addEventListener('change',renderFieldList);renderFieldList();
}

function openNewFieldModal(pg,cb){
  gid('field-modal-title').textContent='Nou camp';
  gid('fm-name').value='';gid('fm-type').value='text';gid('fm-options').value='';gid('fm-required').checked=false;
  gid('fm-options-wrap').style.display='none';
  gid('fm-type').onchange=function(){gid('fm-options-wrap').style.display=(['select','multiselect','checklist'].includes(gid('fm-type').value))?'block':'none';};
  var oldSave=gid('fm-save').onclick;
  gid('fm-save').onclick=async function(){
    var name=gval('fm-name').trim();if(!name){showToast('⚠️ Afegeix un nom');return;}
    saveUndo();
    var field={id:'f_'+uid(),name:name,type:gval('fm-type'),required:gid('fm-required').checked};
    if(['select','multiselect','checklist'].includes(field.type))field.options=gval('fm-options').split('\n').map(function(s){return s.trim();}).filter(Boolean);
    if(!pg.fields)pg.fields=[];pg.fields.push(field);
    closeModal('field-modal');await saveMain();if(cb)cb();showToast('✓ Camp afegit');
  };
  openModal('field-modal');
}

function openFieldEditor(pg,field,cb){
  gid('field-modal-title').textContent='Editar camp';
  gid('fm-name').value=field.name;gid('fm-type').value=field.type;
  gid('fm-options').value=(field.options||[]).join('\n');gid('fm-required').checked=field.required||false;
  gid('fm-options-wrap').style.display=(['select','multiselect','checklist'].includes(field.type))?'block':'none';
  gid('fm-type').onchange=function(){gid('fm-options-wrap').style.display=(['select','multiselect','checklist'].includes(gid('fm-type').value))?'block':'none';};
  gid('fm-save').onclick=async function(){
    saveUndo();field.name=gval('fm-name')||field.name;field.type=gval('fm-type');field.required=gid('fm-required').checked;
    if(['select','multiselect','checklist'].includes(field.type))field.options=gval('fm-options').split('\n').map(function(s){return s.trim();}).filter(Boolean);
    closeModal('field-modal');await saveMain();if(cb)cb();showToast('✓ Camp actualitzat');
  };
  openModal('field-modal');
}

function stCategories(body){
  body.innerHTML='';var s=mkEl('div','s-section');s.innerHTML='<h3>Categories globals</h3><div style="font-size:12px;color:var(--muted);margin-bottom:10px">Apareixen a tasques, dates clau i llegenda del calendari.</div>';
  D.categories.forEach(function(c){
    var row=mkEl('div','item-row');
    row.innerHTML='<div class="cswatch" style="background:'+c.color+'"></div><div class="item-main"><div class="item-name">'+escH(c.name)+'</div></div><button class="btn btn-xs" data-edit-cat="'+c.id+'">Editar</button>';
    s.appendChild(row);
  });
  var addBtn=mkEl('button','btn btn-sm');addBtn.textContent='+ Nova categoria';addBtn.style.marginTop='7px';
  addBtn.addEventListener('click',function(){openGenModal('Nova categoria','<div class="field"><div class="field-label">Nom</div><input type="text" id="gm-name"></div><div class="field"><div class="field-label">Color</div><input type="color" id="gm-color" value="#5aa8d4"></div>',async function(){var name=gval('gm-name').trim();if(!name)return;saveUndo();D.categories.push({id:uid(),name:name,color:gval('gm-color')});closeModal('gen-modal');await saveMain();stCategories(body);showToast('✓ Afegida');});});
  s.appendChild(addBtn);body.appendChild(s);
  body.querySelectorAll('[data-edit-cat]').forEach(function(btn){btn.addEventListener('click',function(){var id=+btn.dataset.editCat;var c=D.categories.find(function(x){return x.id===id;});openGenModal('Editar categoria','<div class="field"><div class="field-label">Nom</div><input type="text" id="gm-name" value="'+escQ(c.name)+'"></div><div class="field"><div class="field-label">Color</div><input type="color" id="gm-color" value="'+c.color+'"></div>',async function(){saveUndo();c.name=gval('gm-name');c.color=gval('gm-color');closeModal('gen-modal');await saveMain();stCategories(body);showToast('✓ Guardat');},async function(){saveUndo();D.categories=D.categories.filter(function(x){return x.id!==id;});closeModal('gen-modal');await saveMain();stCategories(body);showToast('Eliminada');});});});
}

function stPeople(body){
  body.innerHTML='';var s=mkEl('div','s-section');s.innerHTML="<h3>Persones de l'equip</h3>";
  D.people.forEach(function(p){var row=mkEl('div','item-row');row.innerHTML='<div class="person-av" style="background:'+p.color+'22;color:'+p.color+'">'+p.name[0]+'</div><div class="item-main"><div class="item-name">'+escH(p.name)+'</div><div class="item-sub">'+escH(p.role)+'</div></div><button class="btn btn-xs" data-edit-person="'+p.id+'">Editar</button>';s.appendChild(row);});
  var addBtn=mkEl('button','btn btn-sm');addBtn.textContent='+ Afegir persona';addBtn.style.marginTop='7px';
  addBtn.addEventListener('click',function(){openGenModal('Nova persona','<div class="field"><div class="field-label">Nom</div><input type="text" id="gm-name"></div><div class="field"><div class="field-label">Rol</div><input type="text" id="gm-role"></div><div class="field"><div class="field-label">Color</div><input type="color" id="gm-color" value="#7b5cf0"></div>',async function(){var name=gval('gm-name').trim();if(!name)return;saveUndo();D.people.push({id:uid(),name:name,role:gval('gm-role'),color:gval('gm-color')});closeModal('gen-modal');await saveMain();stPeople(body);showToast('✓ Afegit');});});
  s.appendChild(addBtn);body.appendChild(s);
  body.querySelectorAll('[data-edit-person]').forEach(function(btn){btn.addEventListener('click',function(){var id=+btn.dataset.editPerson;var p=D.people.find(function(x){return x.id===id;});openGenModal('Editar persona','<div class="field"><div class="field-label">Nom</div><input type="text" id="gm-name" value="'+escQ(p.name)+'"></div><div class="field"><div class="field-label">Rol</div><input type="text" id="gm-role" value="'+escQ(p.role)+'"></div><div class="field"><div class="field-label">Color</div><input type="color" id="gm-color" value="'+p.color+'"></div>',async function(){saveUndo();p.name=gval('gm-name');p.role=gval('gm-role');p.color=gval('gm-color');closeModal('gen-modal');await saveMain();stPeople(body);showToast('✓ Guardat');},async function(){saveUndo();D.people=D.people.filter(function(x){return x.id!==id;});closeModal('gen-modal');await saveMain();stPeople(body);showToast('Eliminat');});});});
}

function stHashtags(body){
  body.innerHTML='';var s=mkEl('div','s-section');s.innerHTML='<h3>Hashtags</h3>';
  var list=mkEl('div','');list.style.cssText='display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px';
  D.hashtags.forEach(function(tag,i){var sp=mkEl('span','');sp.style.cssText='background:var(--cyan3);color:var(--cyan);padding:3px 9px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:5px';sp.innerHTML=escH(tag)+' <span style="cursor:pointer;opacity:.5" data-rm-ht="'+i+'">×</span>';list.appendChild(sp);});
  s.appendChild(list);
  var ar=mkEl('div','');ar.style.cssText='display:flex;gap:7px';
  ar.innerHTML='<input type="text" id="new-ht" placeholder="#aerodance" style="background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;padding:7px 11px;outline:none;flex:1"><button class="btn btn-primary btn-sm" id="ht-add">Afegir</button>';
  s.appendChild(ar);body.appendChild(s);
  list.querySelectorAll('[data-rm-ht]').forEach(function(el){el.addEventListener('click',async function(){saveUndo();D.hashtags.splice(+el.dataset.rmHt,1);await saveMain();stHashtags(body);});});
  gid('ht-add').addEventListener('click',async function(){var t=(gval('new-ht')||'').trim();if(!t)return;var tag=t.startsWith('#')?t:'#'+t;if(!D.hashtags.includes(tag)){saveUndo();D.hashtags.push(tag);await saveMain();stHashtags(body);}});
}

function stAccess(body){
  body.innerHTML='';var s=mkEl('div','s-section');s.innerHTML="<h3>Usuaris & Accés</h3>";
  Object.keys(D.users).forEach(function(u){
    var card=mkEl('div','');card.style.cssText='background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px';
    var hdr2=mkEl('div','');hdr2.style.cssText='display:flex;align-items:center;gap:8px';
    hdr2.innerHTML='<div class="person-av" style="background:rgba(255,255,255,.08);color:var(--text)">'+u[0].toUpperCase()+'</div><div style="flex:1"><div class="item-name">'+escH(u)+'</div><div class="item-sub">'+(u==='admin'?'Administrador':'Usuari')+'</div></div>';
    var chBtn=mkEl('button','btn btn-xs');chBtn.textContent='Canviar contrasenya';
    chBtn.addEventListener('click',function(){openGenModal('Contrasenya de "'+escH(u)+'"','<div class="field"><div class="field-label">Nova contrasenya</div><input type="password" id="gm-newpwd"></div><div class="field"><div class="field-label">Confirmar</div><input type="password" id="gm-confpwd"></div><div style="font-size:12px;color:var(--red);min-height:14px" id="gm-pwd-err"></div>',async function(){var nw=gval('gm-newpwd'),conf=gval('gm-confpwd');if(nw.length<4){stxt('gm-pwd-err','Mínim 4 caràcters');return;}if(nw!==conf){stxt('gm-pwd-err','No coincideixen');return;}D.users[u]=nw;await saveUsers();closeModal('gen-modal');showToast('✓ Contrasenya actualitzada');});});
    hdr2.appendChild(chBtn);
    if(u!=='admin'){var delBtn=mkEl('button','btn btn-xs btn-danger');delBtn.textContent='× Eliminar';delBtn.addEventListener('click',async function(){if(!confirm('Eliminar "'+u+'"?'))return;delete D.users[u];delete D.userTabs[u];await saveUsers();await saveMain();stAccess(body);showToast('Usuari eliminat');});hdr2.appendChild(delBtn);}
    card.appendChild(hdr2);s.appendChild(card);
  });
  var addBtn=mkEl('button','btn btn-sm');addBtn.textContent='+ Nou usuari';addBtn.style.marginTop='8px';
  addBtn.addEventListener('click',function(){openGenModal('Nou usuari','<div class="field"><div class="field-label">Nom d\'usuari</div><input type="text" id="gm-user"></div><div class="field"><div class="field-label">Contrasenya</div><input type="password" id="gm-pass"></div>',async function(){var u2=gval('gm-user').trim(),p=gval('gm-pass');if(!u2||!p){showToast('⚠️ Omple els camps');return;}D.users[u2]=p;D.userTabs[u2]=getAllowedPageIds().filter(function(id){return id!=='__settings__';});closeModal('gen-modal');await saveUsers();await saveMain();stAccess(body);showToast('✓ Usuari creat');});});
  s.appendChild(addBtn);body.appendChild(s);
}

// ══════════════════════════════════════════
// GENERIC MODAL
// ══════════════════════════════════════════
function openGenModal(title,bodyHTML,saveFn,deleteFn){
  stxt('gen-lbl',title);gid('gen-body').innerHTML=bodyHTML;
  var foot=gid('gen-foot');foot.innerHTML='';
  if(deleteFn){var db=mkEl('button','btn btn-danger btn-sm');db.style.marginRight='auto';db.textContent='Eliminar';db.addEventListener('click',deleteFn);foot.appendChild(db);}
  var cb=mkEl('button','btn btn-sm');cb.textContent='Cancel·lar';cb.addEventListener('click',function(){closeModal('gen-modal');});foot.appendChild(cb);
  var sb=mkEl('button','btn btn-primary btn-sm');sb.textContent='Guardar';sb.addEventListener('click',saveFn);foot.appendChild(sb);
  openModal('gen-modal');
}
</script>
